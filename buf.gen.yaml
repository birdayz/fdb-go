version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: fdb.dev/gen
    # The demo schema is test data: its own package keeps its
    # com.apple.foundationdb.record types out of every production binary.
    - file_option: go_package
      path: record_layer_demo.proto
      value: fdb.dev/gen/demopb
plugins:
  - local:
      - bazelisk
      - run
      - "@org_golang_google_protobuf//cmd/protoc-gen-go"
      - --
    out: gen
    opt:
      - module=fdb.dev/gen
  - local:
      - bazelisk
      - run
      - "@com_github_planetscale_vtprotobuf//cmd/protoc-gen-go-vtproto"
      - --
    out: gen
    opt:
      - module=fdb.dev/gen
      - features=marshal+unmarshal+size+pool
      - pool=fdb.dev/gen.*
      - pool=fdb.dev/gen/demopb.*
