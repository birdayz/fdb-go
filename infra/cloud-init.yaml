#cloud-config

# `packages:` starts docker.io in the CONFIG stage, before runcmd links the CI volume, so
# the daemon creates its data-root as a mode-0711 dir on the ROOT DISK. The volume link
# then refuses to nest inside it (100 GB unused, caches filling the 75 GB root), and the
# traverse-only ancestor makes the runner refuse to start: "Fail to create and validate
# runner's work directory". bootcmd is the only hook before package install; runcmd
# unmasks once the link exists.
bootcmd:
  - systemctl mask docker.service docker.socket

package_update: true
packages:
  - docker.io
  - build-essential
  - curl
  - git
  - jq

# This box is 7.6 GB RAM with the FDB-container suite running at --local_test_jobs=4
# (each test spawns a multi-GB FDB server). With NO swap, a memory spike OOM-kills test
# processes and can wedge the whole runner — zero headroom (observed: 10 OOM-kills in a
# 42-day session, culminating in an sshd-starving wedge). A swap file converts those fatal
# OOM-kills into survivable slowdowns; swappiness=10 keeps tests on RAM until real pressure
# so the common path stays fast. NOTE: this only buys headroom — for real capacity, bump
# server_type (e.g. cx33 -> a 16 GB type) or lower --local_test_jobs.
swap:
  filename: /swapfile
  size: 4294967296 # 4 GiB

write_files:
  - path: /etc/sysctl.d/99-ci-swap.conf
    content: |
      vm.swappiness=10

  - path: /etc/docker/daemon.json
    content: |
      {"data-root": "/mnt/ci-data/docker", "default-address-pools": [{"base": "172.17.0.0/12", "size": 24}, {"base": "192.168.0.0/16", "size": 24}]}

  # Supply-chain gate (RFC-108 §1): download an artifact and ABORT provisioning if its
  # SHA-256 doesn't match the pin. Every tool fetch below goes through this, so a
  # corrupted / tampered / silently-moved artifact fails loud instead of installing.
  - path: /usr/local/bin/fetch-verified.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      # fetch-verified.sh URL SHA256 DEST
      set -euo pipefail
      url="$1"; sha="$2"; dest="$3"
      curl -fsSL -o "$dest" "$url"
      echo "$sha  $dest" | sha256sum -c - \
        || { echo "::error::checksum mismatch for $url (expected $sha)"; exit 1; }

  # link-ci-volume.sh points the stable /mnt/ci-data at the attached CI data
  # volume. It is a FILE, not an inline runcmd block, so infra/link_ci_volume_test.sh
  # can execute this exact code against fixtures instead of testing a copy of it.
  #
  # The link step is migrate-or-abort, never `ln -sfn` onto whatever is there.
  # `ln -sfn TARGET LINK` creates the link INSIDE LINK when LINK is a real
  # directory, and that is not hypothetical: on the runner pool the volumes were
  # attached AFTER the mount wait expired, a later step created /mnt/ci-data as a
  # plain root-disk directory, and the link landed at /mnt/ci-data/HC_Volume_<id>.
  # Docker's data-root and every bazel cache then ran on the 75GB root disk
  # (91-94% full) while the 100GB volume sat at 1%. Silence is the whole failure
  # mode, so an occupied /mnt/ci-data aborts and asks for a migration.
  - path: /usr/local/bin/link-ci-volume.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      # link-ci-volume.sh [ROOT] -- ROOT defaults to "" (the real filesystem); the
      # test passes a fixture prefix. Idempotent: safe to re-run on every boot.
      set -eu
      R="$${1:-}"
      # 10 minutes, not 3: the volume is a separate TF resource attached after boot, so
      # cloud-init races the attach, and losing is unrecoverable (cloud-init is one-shot —
      # the box sits with no runner). Measured: 3 minutes lost the race on 1 of 5 boxes.
      for i in $(seq 1 300); do
        VOL=$(ls -d "$R"/mnt/HC_Volume_* 2>/dev/null | head -1) || true
        [ -n "$${VOL:-}" ] && { [ -n "$R" ] || mountpoint -q "$VOL"; } && break
        # Mount it ourselves: Hetzner automounts only at ATTACH time, so a volume attached
        # after boot has no mount and no fstab entry, and waiting cannot produce one.
        # Measured: 2 of 5 boxes came up with /dev/sdb attached, unmounted, unlisted.
        if [ -z "$R" ]; then
          dev=$(ls /dev/disk/by-id/scsi-0HC_Volume_* 2>/dev/null | head -1) || true
          if [ -n "$${dev:-}" ]; then
            mp="/mnt/HC_Volume_$(basename "$dev" | sed 's/scsi-0HC_Volume_//')"
            mkdir -p "$mp"
            grep -q " $mp " /etc/fstab 2>/dev/null || echo "$dev $mp ext4 discard,nofail,defaults 0 0" >> /etc/fstab
            mount "$mp" 2>/dev/null || true
          fi
        fi
        sleep 2
      done
      [ -n "$${VOL:-}" ] || { echo "::error::CI data volume not present"; exit 1; }
      if [ -z "$R" ] && ! mountpoint -q "$VOL"; then
        echo "::error::CI data volume $VOL is not mounted"; exit 1
      fi
      CI="$R/mnt/ci-data"
      if [ -L "$CI" ]; then
        cur=$(readlink "$CI")
        [ "$cur" = "$VOL" ] || { echo "::error::$CI already links to $cur, want $VOL"; exit 1; }
      elif [ -e "$CI" ]; then
        [ -d "$CI" ] || { echo "::error::$CI exists and is not a directory"; exit 1; }
        if [ -n "$(ls -A "$CI" 2>/dev/null)" ]; then
          echo "::error::$CI is a NON-EMPTY directory on the root disk. Refusing to nest the volume link inside it (that is how the pool ran 30GB of caches on the root disk with the volume empty). Migrate its contents onto $VOL, replace it with a symlink, then re-run."
          exit 1
        fi
        rmdir "$CI"
        ln -s "$VOL" "$CI"
      else
        ln -s "$VOL" "$CI"
      fi
      [ "$(readlink "$CI")" = "$VOL" ] || { echo "::error::$CI is not the expected symlink"; exit 1; }
      # 0755, not the 0711 a fresh volume root has defaulted to: actions/runner
      # validates its work directory by walking the ancestor chain and LISTING
      # each level, so a traverse-only ancestor makes every JIT runner refuse to
      # start with "Fail to create and validate runner's work directory" -- which
      # cost this fleet four of its five slots until it was found.
      chmod 0755 "$VOL"
      mkdir -p "$CI/docker" "$CI/bazel"

  # Watchdog: restart the unit that serves jobs on THIS box. The mode branch writes the
  # unit name to a config file; hardcoding it is how the pool boxes burned NRestarts of
  # 1143, 94, 4115 and 2141 restarting a bazelscaleset binary never installed on them.
  # No config => do nothing. The heartbeat arm is opt-in: a supervisor stamps one on each
  # successful poll, so a stale stamp means wedged rather than idle; a classic runner
  # stamps nothing and its liveness IS the unit being active, which the first arm covers.
  - path: /usr/local/bin/runner-watchdog.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      set -uo pipefail
      CONF=/etc/runner-watchdog.conf
      [ -r "$CONF" ] || exit 0
      # shellcheck source=/dev/null
      . "$CONF"
      UNIT="$${WATCH_UNIT:-}"
      [ -n "$UNIT" ] || exit 0
      # A masked unit is a deliberate "never run this here" from the mode branch; a
      # watchdog that restarts through a mask defeats the enforcement.
      if [ "$(systemctl is-enabled "$UNIT" 2>/dev/null)" = "masked" ]; then
        exit 0
      fi
      # Dead process -> restart (Restart=always usually beats us; this is the backstop).
      if ! systemctl is-active --quiet "$UNIT"; then
        echo "$UNIT not active, restarting"
        systemctl restart "$UNIT"
        exit 0
      fi
      # Alive but wedged, for units that publish a heartbeat. No heartbeat configured =>
      # active is the whole health signal, and we are done.
      HEARTBEAT="$${WATCH_HEARTBEAT:-}"
      [ -n "$HEARTBEAT" ] || exit 0
      POLL_TIMEOUT=120                 # matches --poll-timeout (2m)
      STALE=$(( POLL_TIMEOUT * 3 ))    # 6m: heartbeat older than this => wedged
      NOW=$(date +%s)
      LAST=$(cat "$HEARTBEAT" 2>/dev/null || echo 0)
      if ! [ "$LAST" -gt 0 ] 2>/dev/null; then
        LAST=0
      fi
      AGE=$(( NOW - LAST ))
      if [ "$AGE" -gt "$STALE" ]; then
        echo "$UNIT heartbeat stale ($${AGE}s > $${STALE}s), restarting"
        systemctl restart "$UNIT"
      fi

  - path: /etc/systemd/system/runner-watchdog.service
    content: |
      [Unit]
      Description=GitHub Actions Runner Watchdog

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/runner-watchdog.sh

  - path: /etc/systemd/system/runner-watchdog.timer
    content: |
      [Unit]
      Description=Check GitHub Actions Runner health every 10 minutes

      [Timer]
      OnBootSec=5min
      OnUnitActiveSec=10min

      [Install]
      WantedBy=timers.target

  # Orphan-FDB-container sweep. testcontainers-go starts a Ryuk reaper
  # that's supposed to clean up FDB containers when the parent test
  # process dies. Under memory pressure the OS OOM-killer can take
  # Ryuk out before reaping (Ryuk is small, ~14 MB image, so a likely
  # victim). When that happens, FDB containers become orphans:
  # `docker ps` shows them running with no Ryuk watcher and no parent
  # test. Each leaks ~700 MB of RSS via the inner fdbserver process.
  # See `automemory/project_hetzner_runner_fdbserver_leak.md`.
  #
  # The sweep kills any foundationdb/foundationdb container running
  # for more than 30 minutes (no real test should run that long —
  # max test_timeout is 60 min for the eternal slot, but containers
  # are scoped per-test which finishes well under that). It also
  # bumps Ryuk's oom_score_adj to -500 so the kernel prefers to OOM
  # almost any other process before it.
  - path: /usr/local/bin/orphan-fdb-sweep.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      # Match containers by IMAGE NAME (tag-agnostic). The previous version used
      # `docker ps --filter ancestor=foundationdb/foundationdb` (no tag), which on
      # this Docker version matches NOTHING — the containers are tagged `:7.3.77`
      # and the untagged ancestor filter does not match a tagged image. That made
      # the whole sweep AND the Ryuk priority bump a silent no-op (exit 0, killed
      # nothing), so FDB orphans accumulated for weeks until a fresh CI run OOMed
      # (fdbserver code 137 / bazel "Server terminated abruptly").
      set -uo pipefail
      now=$(date -u +%s)
      docker ps --format '{{.ID}} {{.Image}}' 2>/dev/null | while read -r id image; do
        case "$image" in
          testcontainers/ryuk*)
            # Make Ryuk the LAST thing the OOM-killer picks, so it survives to reap.
            pid=$(docker inspect -f '{{.State.Pid}}' "$id" 2>/dev/null || true)
            if [ -n "$${pid:-}" ] && [ -w "/proc/$pid/oom_score_adj" ]; then
              echo -500 > "/proc/$pid/oom_score_adj" 2>/dev/null || true
            fi
            ;;
          foundationdb/foundationdb*)
            # Kill FDB containers running > 30 min — no per-test container lives
            # that long, so these are orphans.
            started=$(docker inspect -f '{{.State.StartedAt}}' "$id" 2>/dev/null || true)
            [ -z "$${started:-}" ] && continue
            age=$(( now - $(date -u -d "$started" +%s 2>/dev/null || echo "$now") ))
            if [ "$age" -gt 1800 ]; then
              echo "killing orphan FDB container $id ($image, running $${age}s)"
              # -v: remove the container's anonymous volumes too. Without it every
              # orphan kill strands its volume — testcontainers' Ryuk only reaps
              # volumes for containers it removes itself, so force-removed orphans
              # leaked ~1 GB/day until the root disk filled (observed: 289 dangling
              # volumes / 29.7 GB).
              docker rm -fv "$id" 2>/dev/null || true
            fi
            ;;
        esac
      done

      # Belt-and-braces for volumes stranded by any other path (OOM-killed Ryuk,
      # jobs killed mid-run): prune unreferenced volumes. Anonymous volumes are
      # referenced from container creation onward, so in-use ones are never touched.
      docker volume prune -f >/dev/null 2>&1 || true

  - path: /etc/systemd/system/orphan-fdb-sweep.service
    content: |
      [Unit]
      Description=Sweep orphan FDB testcontainers + bump Ryuk OOM priority

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/orphan-fdb-sweep.sh

  - path: /etc/systemd/system/orphan-fdb-sweep.timer
    content: |
      [Unit]
      Description=Run orphan-FDB-container sweep every 5 minutes

      [Timer]
      OnBootSec=2min
      OnUnitActiveSec=5min

      [Install]
      WantedBy=timers.target

  # Bazel-cache LRU prune. The /etc/bazel.bazelrc GC flags below
  # (--experimental_disk_cache_gc_*) run IN-SERVER during IDLE only — and this
  # box's servers rarely idle long enough (jobs `bazelisk shutdown` up front, the
  # watchdog reaps residents), so the native GC never engaged and the disk cache
  # grew unbounded until the 98 GB CI volume hit 100% (ENOSPC failed CI builds
  # with empty compiler diagnostics). This timer is the lifecycle-independent
  # backstop: mtime is a true LRU signal (Bazel >=7 touches disk-cache entries on
  # hit). Also sweeps stale per-workspace-path output bases (layout churn strands
  # dead multi-GB _bazel_runner/<hash> dirs).
  - path: /etc/systemd/system/bazel-cache-prune.service
    content: |
      [Unit]
      Description=LRU-prune the shared bazel disk cache and stale output bases

      [Service]
      Type=oneshot
      # $$ = literal $ for the shell (systemd would otherwise expand $var/$( to
      # empty in ExecStart and silently no-op the tighten branch and the sweep).
      ExecStart=/bin/sh -c "find /mnt/ci-data/bazel-disk-cache -type f -mtime +14 -delete 2>/dev/null; use=$$(df --output=pcent /mnt/ci-data | tail -1 | tr -dc 0-9); [ \"$$use\" -gt 70 ] && find /mnt/ci-data/bazel-disk-cache -type f -mtime +7 -delete 2>/dev/null; exit 0"
      ExecStart=/bin/sh -c "for d in /mnt/ci-data/bazel/_bazel_runner/*/; do case $$d in *cache*|*install*) continue;; esac; [ -n \"$$(find $$d -maxdepth 0 -mtime +14 2>/dev/null)\" ] && rm -rf $$d; done; exit 0"

  - path: /etc/systemd/system/bazel-cache-prune.timer
    content: |
      [Unit]
      Description=Weekly bazel cache prune

      [Timer]
      OnCalendar=Sun 04:00
      RandomizedDelaySec=1h
      Persistent=true

      [Install]
      WantedBy=timers.target

  # --- bazelscaleset (RFC-155) — runner scale-set supervisor (runner_mode=scaleset) ---

  # CI-box-only Bazel config (NOT the committed repo .bazelrc). Read as the system rc
  # before the workspace .bazelrc; the committed config stays "build from source, no
  # cache" (RFC-108) for every developer + fresh checkout. The caches here are LOCAL-ONLY
  # (this box's own from-source outputs / hash-verified externals, never remote/imported),
  # so they stay inside RFC-108 — a wider reuse window than the per-output_base action
  # cache, hardened by --incompatible_strict_action_env (set in the repo). Build flags.
  - path: /etc/bazel.bazelrc
    permissions: "0644"
    content: |
      # Keep the single warm slot's bazel server resident between jobs (RFC-155 §7).
      # No --host_jvm_args=-Xmx bound: at maxRunners=1 the one server has ample RAM, and
      # a cold-build analysis wants the JVM default heap, not a cap (the cap was only ever
      # to squeeze two servers onto this 7.6 GiB box, which proved unviable — see below).
      startup --max_idle_secs=21600
      build --disk_cache=/mnt/ci-data/bazel-disk-cache
      build --repository_cache=/mnt/ci-data/bazel-repo-cache
      build --experimental_disk_cache_gc_max_size=20G
      build --experimental_disk_cache_gc_max_age=14d

  # Wrapper: load the GitHub App private key from its 0600 file into the env var the
  # supervisor reads, then exec it (keeps the multi-line PEM out of the unit). App ids are
  # not secret (templated in); the private key is written separately in runcmd.
  - path: /usr/local/bin/bazelscaleset-run.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      set -euo pipefail
      export BAZELSCALESET_APP_PRIVATE_KEY="$(cat /etc/bazelscaleset/app.pem)"
      # --max-runners 1 is deliberate, NOT just the default: two concurrent heavy
      # bazel+FDB jobs exhaust this 7.6 GiB box (RAM + 4 GiB swap) into a swap-thrash
      # sshd-starving wedge (observed live). Real 2-slot capacity needs a bigger
      # server_type, not this flag. The backlog just serializes — slow is fine.
      exec /usr/local/bin/bazelscaleset \
        --url https://github.com/${github_repo} \
        --name hetzner-fdb \
        --labels hetzner-fdb \
        --max-runners 1 \
        --runner-dir /home/runner/actions-runner-ss \
        --work-base /mnt/ci-data/bazelwork \
        --heartbeat-file /run/bazelscaleset/heartbeat \
        --app-client-id ${bazelscaleset_app_client_id} \
        --app-installation-id ${bazelscaleset_app_installation_id} \
        --log-level info

  - path: /etc/systemd/system/bazelscaleset.service
    content: |
      [Unit]
      Description=bazelscaleset runner scale-set supervisor (hetzner-fdb)
      After=network-online.target docker.service
      Wants=network-online.target

      [Service]
      Type=simple
      User=runner
      RuntimeDirectory=bazelscaleset
      ExecStart=/usr/local/bin/bazelscaleset-run.sh
      Restart=always
      RestartSec=5
      # A leaked/oversized job process getting OOM-killed must fail THAT job, not
      # stop the whole supervisor. The systemd default (OOMPolicy=stop) tore the
      # unit down mid-job when the kernel OOM-killed one leaked conformance JVM:
      # the running job was canceled, the supervisor exited, and (pre-PR-#444
      # binaries) the scale set was deleted+recreated on the restart. The main
      # process dying is still handled by Restart=always.
      OOMPolicy=continue
      # The supervisor's self-exit-for-restart paths (poll timeout, listener
      # error) leave runners running for the next incarnation to ADOPT. With
      # the default KillMode=control-group, systemd would SIGTERM/SIGKILL every
      # leftover process in the cgroup — i.e. the local in-flight runner — the
      # moment the main process exits, defeating adoption and canceling the
      # job. KillMode=process signals only the main process; runner lifecycle
      # (TERM/grace/KILL on genuine stop, watchdogs, adoption) is entirely the
      # supervisor's own, tracked via slot pidfiles.
      KillMode=process

      [Install]
      WantedBy=multi-user.target

  # Cap journal disk usage. Uncapped, journald had accumulated 2.3G on the 75G
  # root disk that also hosts Docker images and bazel install bases — disk
  # pressure on this box turns into failed CI jobs. 500M keeps ~days of
  # runner/job logs, which is all incident forensics has ever needed here.
  - path: /etc/systemd/journald.conf.d/cap.conf
    content: |
      [Journal]
      SystemMaxUse=500M

runcmd:
  # journald starts before cloud-init writes the 500M cap drop-in above; restart
  # so the cap applies from first boot (it also vacuums any existing overage).
  - systemctl restart systemd-journald

  # CI data volume (RFC-115 §7): the 100GB ext4 volume (hcloud_volume.runner_data) is
  # ext4-formatted by tofu and auto-mounted by Hetzner at /mnt/HC_Volume_<id>. Link it to a
  # STABLE /mnt/ci-data and create Docker + Bazel subdirs on it BEFORE Docker starts, so
  # Docker's data-root (/etc/docker/daemon.json) is valid on first boot. Without this the
  # wire-oracle FDB-from-source build fills the 75GB root disk and the genrule OOMs. Fail
  # loud if the volume never mounts (a silent fall-back to root re-creates the disk bug).
  # The logic lives in /usr/local/bin/link-ci-volume.sh (see its write_files entry for
  # why it is a file: infra/link_ci_volume_test.sh executes that exact script).
  # Fail loud for real: runcmd shares one shell with no `set -e`, so a bare invocation
  # would log the error and provision onto the root disk anyway. `exit 1` aborts it.
  - /usr/local/bin/link-ci-volume.sh || { echo "::error::CI data volume link failed — refusing to provision onto the root disk"; exit 1; }

  # Docker, now that /mnt/ci-data resolves to the volume (see the bootcmd mask above).
  - systemctl unmask docker.service docker.socket
  - systemctl enable --now docker
  - systemctl restart docker

  # Pinned + checksummed tool installs (RFC-108 §1). ONE block under `set -eu` so a
  # checksum mismatch in fetch-verified.sh ABORTS — cloud-init runcmd has no set -e by
  # default, so as separate items the next install (e.g. `dpkg -i`) would still run on the
  # corrupt artifact and defeat the supply-chain gate (codex). pipefail is omitted (runcmd
  # runs under dash); fetch-verified.sh enforces its own pipefail internally.
  - |
    set -eu
    FV=/usr/local/bin/fetch-verified.sh
    # FDB client (version matches MODULE.bazel + the testcontainers default)
    "$FV" "https://github.com/apple/foundationdb/releases/download/${fdb_version}/foundationdb-clients_${fdb_version}-1_amd64.deb" "${fdb_clients_sha256}" /tmp/fdb-clients.deb
    dpkg -i /tmp/fdb-clients.deb
    rm -f /tmp/fdb-clients.deb
    # Bazelisk launcher (reads .bazelversion → Bazel 9.0.1)
    "$FV" "https://github.com/bazelbuild/bazelisk/releases/download/v${bazelisk_version}/bazelisk-linux-amd64" "${bazelisk_sha256}" /usr/local/bin/bazelisk
    chmod 0755 /usr/local/bin/bazelisk
    ln -sf /usr/local/bin/bazelisk /usr/local/bin/bazel
    # Just (pinned tarball — no curl|bash). --no-same-owner + chown root: GNU tar as root
    # would otherwise preserve the archive's uid/gid (the just release ships uid 1001), so
    # on an image where the runner account gets uid 1001 /usr/local/bin/just would be
    # CI-job-writable and persist across runs (codex).
    "$FV" "https://github.com/casey/just/releases/download/${just_version}/just-${just_version}-x86_64-unknown-linux-musl.tar.gz" "${just_sha256}" /tmp/just.tar.gz
    tar --no-same-owner -xzf /tmp/just.tar.gz -C /usr/local/bin just
    chown root:root /usr/local/bin/just
    chmod 0755 /usr/local/bin/just
    rm -f /tmp/just.tar.gz
    # MinIO client (pinned dated release)
    "$FV" "https://dl.min.io/client/mc/release/linux-amd64/archive/${mc_release}" "${mc_sha256}" /usr/local/bin/mc
    chmod 0755 /usr/local/bin/mc

  # Runner user
  - useradd -m -s /bin/bash runner
  - usermod -aG docker runner

  # Bazel output base on the CI volume (RFC-115 §7): symlink the runner's bazel cache to
  # /mnt/ci-data/bazel so all build outputs — incl. the wire-oracle's bazel-out tar — land
  # on the 100GB volume, not the root disk. (Bazel's --output_user_root defaults to
  # ~/.cache/bazel, so the symlink is sufficient; no flag needed.)
  - install -d -o runner -g runner /mnt/ci-data/bazel /home/runner/.cache
  - ln -sfn /mnt/ci-data/bazel /home/runner/.cache/bazel
  - chown -h runner:runner /home/runner/.cache/bazel

  # Go toolchain, pinned + checksummed. Not every job goes through Bazel: the libfdbc cgo
  # build runs `go build` directly and the Bazel-Go-SDK resolver falls back to system `go`,
  # so without this those jobs die on `go: command not found` (exit 127).
  - |
    set -eu
    /usr/local/bin/fetch-verified.sh "https://go.dev/dl/go${go_version}.linux-amd64.tar.gz" "${go_sha256}" /tmp/go.tar.gz
    rm -rf /usr/local/go
    tar -C /usr/local -xzf /tmp/go.tar.gz
    rm /tmp/go.tar.gz
    # /etc/profile.d covers interactive shells; the runner service is NOT one, so its
    # PATH comes from the .path file the runner reads at job start (written below).
    printf 'export PATH=$PATH:/usr/local/go/bin\n' > /etc/profile.d/go.sh
    chmod 0644 /etc/profile.d/go.sh

  # GitHub Actions runner (pinned version + checksummed — was releases/latest, RFC-108 §1).
  # --ephemeral (opt-in via runner_ephemeral) gives one-job-per-process fresh state;
  # continuous ephemeral operation also needs a token-refresh service (a PAT to mint a new
  # registration token after each job) — that automation is a documented follow-up.
  - |
    set -eu
    # Extract the stock actions/runner BINARIES (both modes need them: classic registers
    # this dir; bazelscaleset clones it per its own runner dir). Pinned + checksummed.
    RUNNER_DIR="/home/runner/actions-runner"
    mkdir -p "$RUNNER_DIR"
    /usr/local/bin/fetch-verified.sh "https://github.com/actions/runner/releases/download/v${runner_version}/actions-runner-linux-x64-${runner_version}.tar.gz" "${runner_sha256}" "$RUNNER_DIR/runner.tar.gz"
    tar --no-same-owner -xzf "$RUNNER_DIR/runner.tar.gz" -C "$RUNNER_DIR"
    rm "$RUNNER_DIR/runner.tar.gz"
    chown -R runner:runner "$RUNNER_DIR"
    systemctl daemon-reload
    # Runner-owned bazel caches. BOTH modes need these: /etc/bazel.bazelrc points
    # disk_cache/repository_cache at them unconditionally, so a classic runner without
    # them dies with "ERROR: [unix_jni.cc] /mnt/ci-data/bazel-disk-cache (Permission
    # denied)" on its first bazel invocation (measured, 2026-08-01 drain fleet).
    install -d -o runner -g runner /mnt/ci-data/bazelwork /mnt/ci-data/bazel-disk-cache /mnt/ci-data/bazel-repo-cache
    RUNNER_MODE="${runner_mode}"
    if [ "$RUNNER_MODE" = "worker" ]; then
      # Remote-slot worker for the bazelscaleset supervisor (one listener on the
      # main box, JIT-ephemeral runners launched here over SSH — tools/bazelscaleset
      # README). No registration, no service: the box only needs the extracted
      # actions/runner binaries above, Docker, the ci-data volume, and the
      # supervisor's public key in runner's authorized_keys (installed by the
      # operator at cutover; a fresh provision needs it re-installed before the
      # supervisor can launch slots here).
      #
      # "No service" has to be ENFORCED, not merely not-configured. write_files
      # installs bazelscaleset.service on every box regardless of mode, and these
      # boxes are typically repurposed from a scaleset/classic provision that
      # enabled runner-watchdog.timer -- whose whole job is `systemctl restart
      # bazelscaleset.service` whenever that unit is not active. On a worker the
      # supervisor binary is never installed, so the pair becomes a perpetual
      # motion machine: the unit dies with status 127, the watchdog restarts it
      # ten minutes later, forever. Measured across the pool: NRestarts of 1143,
      # 94, 4115 and 2141 against a binary that was never there, and the unit
      # reporting `disabled` the whole time, which is what made it easy to miss.
      #
      # There is exactly ONE listener per scale set and it lives on the main box.
      # Stop the unit, delete it, mask the name so nothing can recreate it, and
      # stop the watchdog that would otherwise keep resurrecting it.
      systemctl disable --now bazelscaleset.service 2>/dev/null || true
      systemctl disable --now runner-watchdog.timer 2>/dev/null || true
      rm -f /etc/systemd/system/bazelscaleset.service
      rm -rf /etc/systemd/system/bazelscaleset.service.d
      systemctl daemon-reload
      systemctl mask bazelscaleset.service 2>/dev/null || true
    elif [ "$RUNNER_MODE" = "classic" ]; then
      # Register-and-listen: one durable registration per box, so the runner list stays
      # the size of the fleet. The scale set minted a JIT runner per job and never
      # unregistered them (1907 offline registrations against 5 live slots), and its single
      # supervisor gated every box. --disableupdate pins the reviewed runner_version/SHA.
      # --work puts job workspaces on the 100 GB volume; the default (_work under the
      # runner dir) is the 75 GB root disk the volume exists to avoid.
      install -d -o runner -g runner /mnt/ci-data/runner-work
      su - runner -c "cd $RUNNER_DIR && ./config.sh --unattended --url https://github.com/${github_repo} --token ${github_runner_token} --name ${runner_name} --labels ${runner_labels} --work /mnt/ci-data/runner-work --replace --disableupdate %{ if runner_ephemeral }--ephemeral%{ endif }"
      # The runner service is not a login shell: it takes PATH from this file, so
      # /etc/profile.d/go.sh does not reach it and Go has to be added here explicitly.
      printf '%s\n' "/usr/local/go/bin:/home/runner/go/bin:$(cat /etc/environment | sed -n 's/^PATH="\(.*\)"$/\1/p')" > "$RUNNER_DIR/.path"
      chown runner:runner "$RUNNER_DIR/.path"
      ( cd "$RUNNER_DIR" && ./svc.sh install runner && ./svc.sh start )
      # The supervisor unit ships in write_files on every box regardless of mode. Here it
      # must never run: enforce that the same way worker mode does, or a repurposed box
      # keeps a second claimant on this fleet's jobs.
      systemctl disable --now bazelscaleset.service 2>/dev/null || true
      rm -f /etc/systemd/system/bazelscaleset.service
      rm -rf /etc/systemd/system/bazelscaleset.service.d
      systemctl daemon-reload
      systemctl mask bazelscaleset.service 2>/dev/null || true
      # Point the watchdog at the unit svc.sh just installed. Its name embeds the repo and
      # runner name, so resolve it rather than guessing.
      RUNNER_UNIT=$(systemctl list-unit-files --no-legend 'actions.runner.*.service' | awk '{print $1}' | head -1)
      if [ -n "$RUNNER_UNIT" ]; then
        printf 'WATCH_UNIT=%s\n' "$RUNNER_UNIT" > /etc/runner-watchdog.conf
        systemctl enable --now runner-watchdog.timer
      else
        echo "::error::classic runner service unit not found after svc.sh install"
        exit 1
      fi
    else
      # bazelscaleset (RFC-155). Clean second runner dir (own .runner/.credentials so it can
      # never collide), CI-only bazel caches, the App private key, then the supervisor.
      rsync -aL --exclude=_work --exclude=_diag --exclude='.runner*' --exclude='.credentials*' \
        --exclude=.service --exclude='bin.*' --exclude='externals.*' \
        "$RUNNER_DIR/" /home/runner/actions-runner-ss/
      chown -R runner:runner /home/runner/actions-runner-ss
      install -d -m 0755 /etc/bazelscaleset
      printf '%s' "${base64encode(bazelscaleset_app_private_key)}" | base64 -d > /etc/bazelscaleset/app.pem
      chmod 0600 /etc/bazelscaleset/app.pem && chown runner:runner /etc/bazelscaleset/app.pem
      # TODO: fetch the pinned bazelscaleset binary once a CI-built release exists; until then
      # it is placed out-of-band (a `GOOS=linux go build` of tools/bazelscaleset, scp'd in):
      #   "$FV" ".../bazelscaleset-${bazelscaleset_version}-linux-amd64" "${bazelscaleset_sha256}" /usr/local/bin/bazelscaleset && chmod 0755 /usr/local/bin/bazelscaleset
      systemctl enable --now bazelscaleset.service
      # The watchdog backstops a wholesale supervisor hang via the heartbeat the supervisor
      # stamps on every successful poll; systemd Restart=always handles a plain crash.
      printf 'WATCH_UNIT=%s\nWATCH_HEARTBEAT=%s\n' \
        bazelscaleset.service /run/bazelscaleset/heartbeat > /etc/runner-watchdog.conf
      systemctl enable --now runner-watchdog.timer
    fi

  # Orphan FDB sweep timer (both modes; bazelscaleset also sweeps per-job, this is the net).
  - systemctl daemon-reload
  - systemctl enable --now orphan-fdb-sweep.timer
  # Weekly bazel-cache LRU prune (deployed live 2026-07-05 after the volume-full CI outage).
  - systemctl enable --now bazel-cache-prune.timer
