# union_join_leg_aggregate_forms.yaml
#
# A UNION of grouped-aggregate branches used as a JOIN LEG, over the aggregate
# operand forms a since-deleted translator gate classified as "not
# normalizable": a qualified operand (SUM(ga.v)), a constant operand
# (COUNT(1)), and a group-only branch with no aggregate at all. The gate
# refused them on the premise that the executor's position-remap could not
# re-key such a branch's rows; RFC-242 deleted the remap, and with it the gate.
# Every SQL-built branch is a projection, so the gate's aggregate arm never
# fired on SQL — these rows were correct before the deletion and are pinned
# here so they stay correct after it, with the bare-column form as the control
# the gate always allowed.
#
# ga groups g={100,200} (sums 12, 9; counts 2, 1); gb groups h={100,300}
# (sums 1, 2; counts 1, 1); c maps 100→1, 200→2, 300→3. The union exposes the
# first branch's names (g, s / n), and the second branch's h / s2 / m are
# re-emitted onto them by ordinal.
name: union_join_leg_aggregate_forms
schema_template: |
  CREATE TABLE ga (id BIGINT, g BIGINT, v BIGINT, PRIMARY KEY (id))
  CREATE INDEX cnt_by_g AS SELECT COUNT(*) FROM ga GROUP BY g
  CREATE INDEX sum_by_g AS SELECT SUM(v) FROM ga GROUP BY g
  CREATE TABLE gb (id BIGINT, h BIGINT, v BIGINT, PRIMARY KEY (id))
  CREATE INDEX cnt_by_h AS SELECT COUNT(*) FROM gb GROUP BY h
  CREATE INDEX sum_by_h AS SELECT SUM(v) FROM gb GROUP BY h
  CREATE TABLE c (id BIGINT, w BIGINT, PRIMARY KEY (id))
setup:
  - INSERT INTO ga VALUES (1, 100, 5), (2, 100, 7), (3, 200, 9)
  - INSERT INTO gb VALUES (10, 100, 1), (20, 300, 2)
  - INSERT INTO c VALUES (100, 1), (200, 2), (300, 3)
tests:
  # Qualified operand: the gate rejected SUM(T.C) because the physical
  # aggregate spells it SUM(C).
  - query: WITH u AS (SELECT g, SUM(ga.v) AS s FROM ga GROUP BY g UNION ALL SELECT h, SUM(gb.v) AS s2 FROM gb GROUP BY h) SELECT c.w, u.s FROM u, c WHERE u.g = c.id
    plan_contains: "FlatMap(outer=UnorderedUnion("
    unordered: true
    rows:
      - [1, 12]
      - [2, 9]
      - [1, 1]
      - [3, 2]
  # Constant operand: the gate rejected COUNT(1) because it folds to the
  # count-star index whose canonical name is COUNT(*).
  - query: WITH u AS (SELECT g, COUNT(1) AS n FROM ga GROUP BY g UNION ALL SELECT h, COUNT(1) AS m FROM gb GROUP BY h) SELECT c.w, u.n FROM u, c WHERE u.g = c.id
    plan_contains: "FlatMap(outer=UnorderedUnion("
    unordered: true
    rows:
      - [1, 2]
      - [2, 1]
      - [1, 1]
      - [3, 1]
  # Group-only branches: the gate rejected a 0-aggregate branch outright.
  - query: WITH u AS (SELECT g FROM ga GROUP BY g UNION ALL SELECT h FROM gb GROUP BY h) SELECT c.w FROM u, c WHERE u.g = c.id
    plan_contains: "FlatMap(outer=UnorderedUnion("
    unordered: true
    rows:
      - [1]
      - [2]
      - [1]
      - [3]
  # Control: the bare-column form the gate always allowed.
  - query: WITH u AS (SELECT g, SUM(v) AS s FROM ga GROUP BY g UNION ALL SELECT h, SUM(v) AS s2 FROM gb GROUP BY h) SELECT c.w, u.s FROM u, c WHERE u.g = c.id
    plan_contains: "FlatMap(outer=UnorderedUnion("
    unordered: true
    rows:
      - [1, 12]
      - [2, 9]
      - [1, 1]
      - [3, 2]
