# order_by_dupe_col.yaml
#
# Java's orderby.yamsql: `ORDER BY b, b` (same column repeated) errors
# 42701 (COLUMN_ALREADY_EXISTS). dayshift-40: aligned with Java per
# 100%-alignment direction, even though Postgres / SQL standard
# accept it (second key is a no-op).
#
# Multi-column ORDER BY (`ORDER BY b, id`, `ORDER BY b + 1, b + 1`) is
# rejected by Java's Cascades planner: there is no `ImplementSortRule` for
# multi-key sorts in the SQL stack, so when no inner plan satisfies the
# requested ordering the planner raises `UnableToPlan`.
#
# Go does NOT match there, and the two stanzas below say so in their own
# comments while the paragraph that used to sit here claimed the opposite —
# that Go "matches structurally" and also rejects. It does not: both
# multi-key queries plan and return rows, via `RecordQueryInMemorySortPlan`,
# the sanctioned read-side fallback for orderings no access path provides.
# That is an allowed read-side extension, not a divergence to close, so the
# assertions pin the sort rather than an error — and they pin something the
# rows cannot see: `ORDER BY b + 1, b + 1` DEDUPLICATES to a single sort key.
# The duplicate-COLUMN form never gets that far (42701 first), which is why
# the dedup only shows up on the expression form.
name: order_by_dupe_col
schema_template: |
  CREATE TABLE t (id BIGINT, b BIGINT, PRIMARY KEY (id))
setup:
  - INSERT INTO t VALUES (1, 10), (2, 20), (3, 30)
tests:
  # Duplicate column → 42701.
  - query: SELECT b FROM t ORDER BY b, b
    error_code: "42701"
  # Multi-column ORDER BY — Go extension: in-memory sort handles this.
  - query: SELECT id, b FROM t ORDER BY b, id
    plan_contains: "InMemorySort([_current.B#1 ASC, _current.ID#0 ASC], Scan(T))"
    rows:
      - [1, 10]
      - [2, 20]
      - [3, 30]
  # Duplicate via positional + name mix (ORDER BY 1, b on `SELECT b`
  # → both resolve to column `b`).
  - query: SELECT b FROM t ORDER BY 1, b
    error_code: "42701"
  # Multi-column ORDER BY with expression — Go extension: in-memory sort.
  - query: SELECT b FROM t ORDER BY b + 1, b + 1
    plan_contains: "InMemorySort([(_current.B#1 + 1) ASC], Scan(T))"
    # The duplicate sort key must be deduplicated to ONE. Spelled with the
    # renderer's CURRENT qualifier: this asserted `T.B#1` and the printer emits
    # `_current.B#1`, so it could not match whatever the plan did — a
    # plan_not_contains that cannot match is satisfied by every plan, including
    # the undeduplicated one it was written to forbid.
    plan_not_contains: "(_current.B#1 + 1) ASC, (_current.B#1 + 1) ASC"
    rows:
      - [10]
      - [20]
      - [30]
