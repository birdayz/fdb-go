# select_count_where.yaml — COUNT with various WHERE predicates
#
# Exercises COUNT(*) and COUNT(col) with different filter conditions.
# (Column renamed type->kind: TYPE is a hard keyword in both engines'
# grammars — the original schema never created.)
name: select_count_where
schema_template: |
  CREATE TABLE events (id BIGINT NOT NULL, kind STRING, severity BIGINT, PRIMARY KEY (id))
setup:
  - INSERT INTO events VALUES (1, 'error', 3), (2, 'warn', 2), (3, 'error', 3), (4, 'info', 1), (5, 'warn', 2), (6, 'error', 1)
tests:
  # COUNT with equality filter
  - query: SELECT COUNT(*) FROM events WHERE kind = 'error'
    rows:
      - [3]

  # COUNT with inequality filter
  - query: SELECT COUNT(*) FROM events WHERE severity >= 2
    rows:
      - [4]

  # COUNT with IN filter
  - query: SELECT COUNT(*) FROM events WHERE kind IN ('error', 'warn')
    rows:
      - [5]

  # COUNT with LIKE filter
  - query: SELECT COUNT(*) FROM events WHERE kind LIKE 'e%'
    rows:
      - [3]

  # GROUP BY with COUNT and filter
  - query: >
      SELECT kind, COUNT(*) FROM events
      WHERE severity > 1
      GROUP BY kind ORDER BY kind
    rows:
      - ["error", 2]
      - ["warn", 2]
