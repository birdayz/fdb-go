# FROM-less SELECT uses Java 4.14.2.0's one-row source. Bare NULL retains
# the Go raw-read behavior; the live Java probe pins its metadata rejection.
name: select_no_from
schema_template: |
  CREATE TABLE t (id BIGINT, PRIMARY KEY (id))
tests:
  - query: SELECT 1 + 2
    plan_contains: Explode
    rows: [[3]]
  - query: SELECT 'hello'
    rows: [[hello]]
  - query: SELECT NULL
    rows: [[null]]
  - query: SELECT 'abc'
    rows: [[abc]]
  - query: SELECT NOT TRUE
    rows: [[false]]
  - query: SELECT CAST(1.7 AS BIGINT)
    rows: [[2]]
