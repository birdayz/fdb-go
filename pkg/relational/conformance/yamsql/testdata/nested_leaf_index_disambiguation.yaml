# nested_leaf_index_disambiguation.yaml
#
# A nested leaf and a top-level column with the same name are different
# columns. An index on ADDR.CITY and one on CITY over one table each serve only
# their own column: the expansion reads the nested leaf by its full path, a
# covering row places ADDR.CITY inside a partial ADDR, and a primary-key column
# named like the nested leaf is never trimmed against it.
name: nested_leaf_index_disambiguation
schema_template: |
  CREATE TYPE AS STRUCT ADDRESS (city STRING, id BIGINT)
  CREATE TABLE P (id BIGINT, city STRING, addr ADDRESS, PRIMARY KEY (id))
  CREATE INDEX p_addr_city AS SELECT addr.city FROM P ORDER BY addr.city
  CREATE INDEX p_city AS SELECT city FROM P ORDER BY city
  CREATE INDEX p_addr_id AS SELECT addr.id FROM P ORDER BY addr.id
setup:
  - INSERT INTO P VALUES (1, 'oslo', ('rome', 30)), (2, 'rome', ('oslo', 10)), (3, 'lima', ('rome', 20))
tests:
  - query: SELECT id FROM P WHERE addr.city = 'rome'
    plan_contains: "IndexScan(P_ADDR_CITY, [=] COVERING)"
    rows:
      - [1]
      - [3]
  - query: SELECT id FROM P WHERE city = 'rome'
    plan_contains: "IndexScan(P_CITY, [=] COVERING)"
    rows:
      - [2]
  - query: SELECT id, city, addr.city FROM P WHERE addr.city = 'oslo'
    plan_contains: "P_ADDR_CITY"
    rows:
      - [2, rome, oslo]
  - query: SELECT addr.city, id FROM P ORDER BY addr.city, id
    plan_contains: "IndexScan(P_ADDR_CITY, [*] COVERING)"
    plan_not_contains: "Sort"
    rows:
      - [oslo, 2]
      - [rome, 1]
      - [rome, 3]
  # The entry of P_ADDR_ID is (ADDR.ID, ID): the record's ID is not trimmed
  # against the nested ADDR.ID, so the scan reads the right primary key.
  - query: SELECT id, addr.id FROM P ORDER BY addr.id
    plan_contains: "IndexScan(P_ADDR_ID, [*] COVERING)"
    rows:
      - [2, 10]
      - [3, 20]
      - [1, 30]
  - query: SELECT id FROM P WHERE addr.id = 20
    rows:
      - [3]
