# not_null_constraint_java.yaml — NOT NULL constraint surface, Java parity.
#
# Java rejects NOT NULL on any non-ARRAY column at CREATE
# (DdlVisitor.visitColumnDefinition: "NOT NULL is only allowed for ARRAY
# column type", UNSUPPORTED_OPERATION). There is therefore no scalar
# NOT NULL column to violate: nullable columns accept NULL freely, and the
# 23502 surface exists only for constructs Java can express.
name: not_null_constraint_java
schema_template: |
  CREATE TABLE items (
    id BIGINT,
    name STRING,
    optional_val BIGINT,
    PRIMARY KEY (id)
  )
setup:
  - INSERT INTO items VALUES (1, 'first', 10), (2, 'second', null)
tests:
  # Verify initial data
  - query: SELECT id, name, optional_val FROM items ORDER BY id
    rows:
      - [1, 'first', 10]
      - [2, 'second', null]

  # NULL in a nullable column is fine — including UPDATE to NULL.
  - query: INSERT INTO items VALUES (3, 'third', null)
    rowcount: 1
  - query: UPDATE items SET optional_val = null WHERE id = 1
    rowcount: 1
  - query: SELECT optional_val FROM items WHERE id = 1
    rows:
      - [null]

  # The constraint itself is unexpressible: NOT NULL on a scalar column
  # dies at CREATE with Java's exact error.
  - exec: CREATE SCHEMA TEMPLATE bad_items_nn CREATE TABLE items2 (id BIGINT NOT NULL, name STRING, PRIMARY KEY (id))
    error_code: "0A000"
    error: "NOT NULL is only allowed for ARRAY column type"

  # Verify table state after operations
  - query: SELECT COUNT(*) FROM items
    rows:
      - [3]
