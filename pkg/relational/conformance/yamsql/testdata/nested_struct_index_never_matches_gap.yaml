# nested_struct_index_never_matches_gap.yaml
#
# THIS FILE IS A GAP MARKER, NOT COVERAGE. Its name says so because its single
# arm asserts the WRONG plan on purpose, and a reader who finds that assertion
# inside a file called `..._index_bridge.yaml` would reasonably read it as
# "nested struct indexes are supported". They are not.
#
# THE GAP. A `CARDINALITY` index over a NESTED quoted struct path now BUILDS —
# that is what RFC-237 unblocked, and it is what took `arrays-cardinality.yamsql`
# from 0 to 29 executed Java-corpus queries. The planner never MATCHES it:
#
#   SELECT "id" FROM qnest WHERE CARDINALITY("struct"."int_arr") = 1
#   go   : Project([_current.id#0], PredicatesFilter(Scan(QNEST), [1 preds]))
#   java : ISCAN(tab2_index [EQUALS promote(@c21 AS INT)])
#
# The FLAT twin — `CARDINALITY("int_arr")` over a top-level array — matches
# correctly and is pinned as real coverage in
# `quoted_identifier_index_bridge.yaml`. So this is specific to the nested
# struct path: a Cascades matching change, needing its own RFC and review gate,
# not something to slip into an identifier fix.
#
# WHY IT IS PINNED AT THE WRONG PLAN. Three options, and only one is honest:
#
#   - assert the IndexScan we want → a RED test, which cannot ship;
#   - assert only the rows → BLIND, because a declining candidate full-scans
#     and filters to exactly the right answer. That is the entire difficulty
#     of this defect class and the reason RFC-237 §2.1 exists;
#   - assert the full scan → this arm. Closing the gap REDDENS it, which is
#     how the fix gets noticed instead of passing silently.
#
# So when the nested-path matching lands: DELETE this file and add the
# `plan_contains: IndexScan(...)` arm to the bridge scenario. The redness is
# the handoff. Booked in TODO.md under "A nested-struct CARDINALITY index is
# BUILT but never MATCHED".
name: nested_struct_index_never_matches_gap
schema_template: |
  CREATE TYPE AS STRUCT "QS" ("int_arr" INTEGER ARRAY)
  CREATE TABLE qnest ("id" BIGINT, "struct" "QS", PRIMARY KEY ("id"))
  CREATE INDEX qnest_card AS SELECT CARDINALITY("struct"."int_arr") AS "card" FROM qnest ORDER BY "card"
setup:
  - INSERT INTO qnest VALUES (1, ([])), (2, ([1])), (3, ([1, 2]))
tests:
  - query: SELECT "id" FROM qnest WHERE CARDINALITY("struct"."int_arr") = 1
    plan_contains: "PredicatesFilter(Scan(QNEST)"
    rows:
      - [2]
