# function_key_value_index.yaml
#
# A value index over a long-arithmetic key function is a match candidate whose
# column Value is the arithmetic of the same logical operator
# (LongArithmethicFunctionKeyExpression.toValue), so the query's `d & 1`,
# `d + 1` and `bitmap_bucket_offset(id)` bind it as Java's do (conformance
# "WS-J Go-stored template planned by the target": COVERING(DMASK [EQUALS ...]),
# COVERING(DPLUS [EQUALS ...]), ISCAN(AGG_BUCKET <,>)). An argument that is not
# INT or LONG makes no candidate: its entries hold the truncated long, not the
# query expression's value (DIVERGENCES.md).
name: function_key_value_index
schema_template: |
  CREATE TABLE T1 (id BIGINT, category STRING, PRIMARY KEY (id))
  CREATE INDEX agg_bucket AS SELECT bitmap_bucket_offset(id) FROM T1 ORDER BY bitmap_bucket_offset(id)
  CREATE TABLE T2 (id BIGINT, d BIGINT, PRIMARY KEY (id))
  CREATE INDEX dmask AS SELECT d & 1 FROM T2 ORDER BY d & 1
  CREATE INDEX dplus AS SELECT d + 1 FROM T2 ORDER BY d + 1
  CREATE TABLE TD (id BIGINT, d DOUBLE, PRIMARY KEY (id))
  CREATE INDEX dd AS SELECT d + d FROM TD ORDER BY d + d
setup:
  - INSERT INTO T1 VALUES (1, 'a'), (20005, 'a'), (30002, 'b')
  - INSERT INTO T2 VALUES (1, 4), (2, 5), (3, 7)
  - INSERT INTO TD VALUES (1, 1.5), (2, 2.0)
tests:
  - query: SELECT bitmap_bucket_offset(id) FROM T1 ORDER BY bitmap_bucket_offset(id)
    plan_contains: "IndexScan(AGG_BUCKET, [*]"
    plan_not_contains: "Sort"
    rows:
      - [0]
      - [20000]
      - [30000]
  - query: SELECT id FROM T2 WHERE d & 1 = 1
    plan_contains: "IndexScan(DMASK, [=]"
    rows:
      - [2]
      - [3]
  - query: SELECT id FROM T2 WHERE d + 1 = 5
    plan_contains: "IndexScan(DPLUS, [=]"
    rows:
      - [1]
  - query: SELECT * FROM T2 WHERE d + 1 = 5
    plan_contains: "IndexScan(DPLUS, [=])"
    rows:
      - [1, 4]
  - query: SELECT id, d & 1 FROM T2 ORDER BY d & 1, id
    rows:
      - [1, 0]
      - [2, 1]
      - [3, 1]
  - query: SELECT id FROM TD WHERE d + d = 3
    plan_not_contains: "IndexScan(DD"
    rows:
      - [1]
