# join_using_shapes.yaml
#
# `JOIN … USING (cols)` has no ON expression of its own — one is
# SYNTHESIZED, and which source the left side of that predicate names is
# the whole subject of this file.
#
# A USING column resolves to its unique visible left OWNER, with the RIGHT
# copy of every column an earlier USING consumed hidden. One owner
# qualifies, two is ambiguous (42702), none does not exist (42703).
#
# It used to be qualified by POSITION — the prior join's right alias — which
# is right only by coincidence, and wrong in both directions where it is
# observable at all: it answered an ambiguous chain by silently picking one
# column, and refused a valid chain whose column lives on the first source.
# Both were measured against a live JVM before the rule was replaced.
#
# The fixture is built so the outcomes are distinguishable rather than
# coincidental: a.k and b.k DIFFER at id=2, so a chain that resolved `k` to
# the wrong side would return a different row count instead of the same one,
# and `j` exists only on `a` and `c`, never on the middle source.
name: join_using_shapes
schema_template: |
  CREATE TABLE a (id BIGINT, k BIGINT, j BIGINT, PRIMARY KEY (id))
  CREATE TABLE b (id BIGINT, k BIGINT, PRIMARY KEY (id))
  CREATE TABLE c (id BIGINT, k BIGINT, j BIGINT, PRIMARY KEY (id))
setup:
  - INSERT INTO a VALUES (1, 10, 5), (2, 20, 6), (3, 30, 7)
  - INSERT INTO b VALUES (1, 10), (2, 99), (3, 30)
  - INSERT INTO c VALUES (1, 10, 5), (2, 20, 9), (3, 77, 9)
tests:
  # Single-column USING, first join — the simple case.
  - query: SELECT a.id FROM a JOIN b USING (id) ORDER BY a.id
    rows:
      - [1]
      - [2]
      - [3]
  # Multi-column USING. Both columns must be equated: only id=1 and id=3
  # have a.k = b.k, so id=2 (k 20 vs 99) must drop. A synthesis that
  # equated only the FIRST column returns all three.
  - query: SELECT a.id FROM a JOIN b USING (id, k) ORDER BY a.id
    rows:
      - [1]
      - [3]
  # THE CHAIN. A USING column resolves to its unique visible left OWNER,
  # with the RIGHT copy of every column an earlier USING consumed hidden.
  # The three arms below are the three outcomes of that rule, and they
  # were each measured against a live JVM before being written here.
  #
  # ONE OWNER. The first `USING (id, k)` hides b.id and b.k, so the
  # second sees exactly one candidate for each and the chain is legal.
  - query: SELECT a.id FROM a JOIN b USING (id, k) JOIN c USING (id, k) ORDER BY a.id
    rows:
      - [1]
  # TWO OWNERS — ambiguous. Joining first on `(id)` alone leaves both a.k
  # and b.k visible, so `k` in the second USING names two columns and the
  # query is refused. Go used to answer it, silently choosing b.k.
  - query: SELECT a.id FROM a JOIN b USING (id) JOIN c USING (id, k) ORDER BY a.id
    error_code: "42702"
  # ONE OWNER, AND IT IS NOT THE PRIOR JOIN'S RIGHT SIDE. `j` exists only
  # on `a`, so the owner is the FIRST source. A rule that qualified by
  # position looked for b.j and refused this valid query with 42703.
  - query: SELECT a.id FROM a JOIN b USING (id) JOIN c USING (j) ORDER BY a.id
    rows:
      - [1]
  # NO OWNER — the column exists nowhere on the left. Worth knowing HOW this
  # one passes, because it is not this layer that reports it: the owner
  # lookup DECLINES rather than raising, since it reads the record
  # descriptor and not every legal USING column is a descriptor field.
  # `USING("__ROW_VERSION")` names a pseudo-column, and raising here broke
  # exactly that query in the Java corpus (join-tests-row-version.yamsql,
  # which is where the pseudo-column case stays pinned — it needs a table
  # with row versioning enabled, which this fixture has no reason to have).
  # So the parse-time predicate stands and ordinary column resolution
  # reports 42703 downstream, from the layer that can tell a pseudo-column
  # from a typo.
  - query: SELECT a.id FROM a JOIN b USING (id) JOIN c USING (nosuchcol)
    error_code: "42703"
  # USING on an OUTER join — the same synthesis through the other
  # grammar arm, where the clause is mandatory rather than optional.
  - query: SELECT a.id, b.k FROM a LEFT JOIN b USING (id, k) ORDER BY a.id
    rows:
      - [1, 10]
      - [2, null]
      - [3, 30]
  # NON-BASE SOURCES IN A USING SCOPE. Ownership is read off the record
  # descriptor, so a derived table, an inline VALUES carrier and a CTE
  # cannot be looked up — the retarget declines for the whole join and the
  # parse-time predicate stands.
  #
  # The reason this is pinned rather than assumed: a derived table and an
  # inline source both carry their ALIAS in the field the lookup would use
  # as a table name, so an alias colliding with a real table would resolve
  # ownership against a COMPLETELY DIFFERENT relation's descriptor and
  # build a plausible predicate on it. The alias below is deliberately `b`,
  # which IS a real table here, so this arm fails if the decline is ever
  # decided by name instead of by what the source structurally is.
  - query: SELECT x.id FROM a JOIN (SELECT id, k FROM c) x USING (id) ORDER BY x.id
    rows:
      - [1]
      - [2]
      - [3]
  # The collision itself: a derived table aliased with the name of a real
  # table that has DIFFERENT columns. Resolving `id` against table `b`'s
  # descriptor instead of the subquery would still find a column named id
  # and answer — wrongly and silently — so the row set is what catches it.
  - query: SELECT b.id FROM a JOIN (SELECT id FROM c WHERE id > 1) b USING (id) ORDER BY b.id
    rows:
      - [2]
      - [3]
  # A CTE source, which is referenced by a bare name that no structural
  # flag distinguishes from a table.
  - query: WITH cte AS (SELECT id, k FROM c) SELECT a.id FROM a JOIN cte USING (id) ORDER BY a.id
    rows:
      - [1]
      - [2]
      - [3]
  # A DERIVED SOURCE TO THE LEFT OF A SECOND USING, which is the only
  # position where a non-base source's columns matter: as the right-hand
  # side of its own join it contributes an alias and nothing else.
  #
  # The subquery exports `k`, and `a.k` is still visible, so `k` in the
  # second USING has TWO owners and the query is ambiguous — measured
  # against the live JVM, which answers `Ambiguous reference K`.
  #
  # Getting here took two corrections worth keeping. Resolving the source
  # by NAME read `b`'s columns off the real table `b` — right answer,
  # unrelated descriptor. Treating a derived source as unknowable and
  # declining then made Go ANSWER a query Java refuses, and an earlier
  # draft of this very arm asserted those rows, pinning the divergence as
  # the specification. Both are why the source's projection is derived
  # properly (buildCTEColumnSource) rather than guessed from its name or
  # given up on.
  - query: SELECT a.id FROM a JOIN (SELECT id, k FROM c) b USING (id) JOIN c USING (k) ORDER BY a.id
    error_code: "42702"
  # ERROR ORDER ACROSS JOINS. Two joins are each faulty in a different
  # way: the FIRST has a USING column the right source lacks (`b` has no
  # `j`), the SECOND is ambiguous (`id` is on both `a` and `b`). Java
  # visits and resolves each right source left-to-right, so the first
  # join's fault wins.
  #
  # This is a pre-pass that walks every join before the FROM clause is
  # visited, so without an explicit right-side check at each join the
  # later ambiguity is raised first and the earlier, more specific fault
  # is masked — 42702 for ID instead of 42703 for J.
  - query: SELECT a.id FROM a JOIN b USING (j) JOIN c USING (id)
    error_code: "42703"
  # The same first join alone, to show the 42703 is the join's own fault
  # and not an artefact of there being a second one.
  - query: SELECT a.id FROM a JOIN b USING (j)
    error_code: "42703"
  # A DERIVED PRIMARY whose alias collides with a real table. The primary
  # source carries its ALIAS where a table name would be, so resolving by
  # name invents an owner from an unrelated relation: `b` exports only
  # `id` here, and a phantom `b.k` would make the second USING ambiguous
  # and refuse a valid query.
  - query: SELECT b.id FROM (SELECT id FROM a) b JOIN c USING (id) JOIN a USING (k) ORDER BY b.id
    rows:
      - [1]
      - [2]
