# unquoted_dml_against_a_quoted_table.yaml
#
# AN UNQUOTED DML TARGET MUST NOT REACH A TABLE THAT ONLY QUOTES CAN NAME.
#
# `CREATE TABLE "Customer"` stores the record type as `Customer`. An unquoted
# `DELETE FROM customer` normalises to `CUSTOMER`, which is a different name.
# Java rejects that outright -- `select * from restaurant` against a table
# declared `"Restaurant"` throws UNDEFINED_TABLE / "Unknown table RESTAURANT"
# (CaseSensitivityQueryTests.caseSensitiveConnectionTestCase3) -- and so did
# every Go path except DML, which resolved its target through a CASE-FOLDING
# helper.
#
# THE FOLD DID NOT MAKE THE STATEMENT WORK; IT MADE IT LIE. Validation passed,
# and the plan then carried the SQL-normalised `CUSTOMER` as its delete target
# and as the type it read -- a name no record type in that metadata answers to.
# Nothing was read, nothing was removed, and the statement reported success. The
# same shape on UPDATE modified nothing. The plan itself is not asserted here
# because after the fix these statements do not plan at all; it is recorded in
# RFC-238 and measured in mixed_case_stored_name_probe_test.go, which reaches
# the translator with validation bypassed.
#
# CANONICALISING THE NAME WOULD HAVE BEEN WORSE, which is why this file asserts
# a rejection rather than a row count. Rewriting `CUSTOMER` to the stored
# `Customer` would let an unquoted write mutate a table that can only be named
# with quotes -- silently doing the wrong thing instead of silently doing
# nothing. Strict resolution is what Java does and what the SELECT and
# INSERT ... VALUES paths here already did.
#
# The quoted arms are the control: the same statements, spelled the way the
# table was declared, must work. Without them a regression that rejected ALL
# DML would pass this file.
name: unquoted_dml_against_a_quoted_table
schema_template: |
  CREATE TABLE "Customer" (id BIGINT, name STRING, PRIMARY KEY (id))
setup:
  - INSERT INTO "Customer" VALUES (1, 'alpha'), (2, 'beta')
tests:
  # The control: quoted, the spellings coincide and everything works.
  - query: SELECT id, name FROM "Customer" ORDER BY id
    rows:
      - [1, 'alpha']
      - [2, 'beta']

  # SELECT already rejected this, and must keep doing so -- it is the arm that
  # says the DML behaviour below is agreement rather than a new divergence.
  - query: SELECT id FROM customer
    error: "42F01"

  # THE FIX. Before it this returned success having deleted nothing.
  - query: DELETE FROM customer WHERE id = 1
    error: "42F01"

  # And the same for UPDATE, which had the identical shape.
  - query: UPDATE customer SET name = 'zzz' WHERE id = 1
    error: "42F01"

  # A NONEXISTENT COLUMN ON THE SAME NONEXISTENT TABLE MUST STILL SAY 42F01.
  # The SET-column check runs during logical construction, BEFORE the target
  # guard runs on the built op, so while it resolved its table case-insensitively
  # this reported `42703 column "NOSUCHCOL" not found in table "CUSTOMER"` --
  # diagnosing a column of a table that does not exist. The table is the first
  # thing wrong and must be the thing reported.
  - query: UPDATE customer SET nosuchcol = 'z' WHERE id = 1
    error: "42F01"

  # THE WHERE SIDE STILL ANSWERS 42703, AND THAT IS AGREEMENT, NOT AN OVERSIGHT.
  # The WHERE-column resolver runs during logical construction and folds case,
  # so it names the column before the target guard runs on the built operator.
  # SELECT does exactly the same thing with the same spelling, so changing this
  # one alone would make DML disagree with SELECT to fix a diagnostic ordering
  # neither of them gets right. Asserted at the value it HAS, so that a change
  # to either path has to come here and say which way the two are being made to
  # agree.
  - query: DELETE FROM customer WHERE nosuchcol = 1
    error: "42703"

  # The SELECT twin, which is what makes the arm above agreement rather than a
  # DML-only wart. If these two ever diverge, that is the finding.
  - query: SELECT nosuchcol FROM customer
    error: "42703"

  # UPDATE IS INCONSISTENT WITH ITSELF, and this arm is what says so. The SET
  # check resolves strictly now, so a bad SET column on a bad table reports the
  # TABLE; the WHERE clause goes through the shared analyzer and reports the
  # COLUMN. Same statement kind, same bad table, two different answers
  # depending on which clause carries the second error. §7e says why closing it
  # moves SELECT too.
  - query: UPDATE customer SET name = 'z' WHERE nosuchcol = 1
    error: "42703"

  # And the control that keeps the arms above about the TABLE: on the table as
  # declared, a nonexistent column is a genuine 42703.
  - query: UPDATE "Customer" SET nosuchcol = 'z' WHERE id = 1
    error: "42703"

  # The rows are still here. A rejection that had partially applied would show
  # up as a changed row rather than as an error.
  - query: SELECT id, name FROM "Customer" ORDER BY id
    rows:
      - [1, 'alpha']
      - [2, 'beta']

  # The quoted DML controls: same statements, declared spelling, must work.
  - query: DELETE FROM "Customer" WHERE id = 1
    rowcount: 1

  - query: SELECT id, name FROM "Customer" ORDER BY id
    rows:
      - [2, 'beta']

  # INSERT ... SELECT HAD NO PLANNING-TIME TARGET CHECK AT ALL, and the two
  # arms differ only in whether the source produces rows -- which is what makes
  # it worse than the DELETE/UPDATE case. The target is resolved lazily, per
  # row, in the executor. A source with rows reached that lookup and raised a
  # RAW error carrying no SQLSTATE; a source with none never reached it, and
  # the statement reported SUCCESS against a table that does not exist.
  - query: INSERT INTO customer SELECT id, name FROM "Customer"
    error: "42F01"

  # The empty-source arm. This is the one that reported success.
  - query: INSERT INTO customer SELECT id, name FROM "Customer" WHERE id < 0
    error: "42F01"

  # INSERT ... VALUES is covered TWICE and that is worth knowing before anyone
  # mutation-tests this file. It had its own strict check (the
  # `md.GetRecordType(insOp.Table)` in the VALUES block) before the target guard
  # above existed, and the guard now reaches it first -- so mutating EITHER one
  # alone leaves this arm green, and only mutating BOTH reddens it. Measured:
  # disabling the target guard reddens the two INSERT ... SELECT arms and not
  # this one; disabling the VALUES check alone reddens nothing; disabling both
  # reddens all three. Pinned so a consolidation of the two paths cannot quietly
  # drop the survivor.
  - query: INSERT INTO customer VALUES (9, 'nope')
    error: "42F01"

  # The quoted controls, so a regression that rejected ALL INSERTs fails here.
  - query: INSERT INTO "Customer" VALUES (9, 'nine')
    rowcount: 1

  - query: SELECT id, name FROM "Customer" ORDER BY id
    rows:
      - [2, 'beta']
      - [9, 'nine']
