# like_prefix_pushdown.yaml
#
# No LIKE prefix pushdown exists — every LIKE query here is a full scan.
#
# The filename is an aspiration, not a description. Each LIKE query below
# plans as a full type scan with the pattern left as a per-row residual —
# `PredicatesFilter(Scan(T))` —
# including `name LIKE 'a%'` where `name` IS the primary key, and
# `status LIKE 'a%'` where `status` carries a single-column VALUE index that
# the plan does not even open. The one non-LIKE control in the file
# (`WHERE name = 'banana'` → `Scan(T, [=])`) proves the sarging machinery
# itself works; LIKE simply never reaches it.
#
# The header this replaces described a pushdown in the present tense, listed
# a six-line eligibility scope for it, and contradicted itself: it said
# interior wildcards "bail", while the section at the bottom of the file
# said an ESCAPE pattern with an interior `_` "narrows to the prefix before
# the `_`". Neither statement was true and nothing could tell, because the
# file asserted only rows — and rows are identical whether the range is
# narrowed or the predicate is applied per row. That is exactly why the
# claim survived: a pushdown that never existed read as covered.
#
# What this file actually pins now: `plan_not_contains: "<>"` on every LIKE
# case. A range bound is how any narrowing would render — `Scan(T, [<>])`
# on the PK, `IndexScan(IDX_STATUS, [<>])` on the secondary index,
# `IndexScan(IDX_REGION_NAME, [=, <>])` on the composite. So these
# assertions go RED the moment a real pushdown lands, which is the correct
# and intended signal: whoever implements it updates this file from
# "no narrowing" to the narrowed shape, case by case, and the eligibility
# scope gets WRITTEN from what the assertions show rather than asserted from
# a design note. Until then the rows below are still the correctness
# invariant they always were — LIKE returns the right answers via the scan.
name: like_prefix_pushdown
schema_template: |
  CREATE TABLE t (
    name STRING,
    tag STRING,
    v BIGINT,
    PRIMARY KEY (name)
  )
  CREATE TABLE t2 (
    id BIGINT,
    status STRING,
    PRIMARY KEY (id)
  )
  CREATE INDEX idx_status ON t2 (status)
  CREATE TABLE cp (
    region STRING,
    name STRING,
    v BIGINT,
    PRIMARY KEY (region, name)
  )
  CREATE TABLE ci (
    id BIGINT,
    region STRING,
    name STRING,
    PRIMARY KEY (id)
  )
  CREATE INDEX idx_region_name ON ci (region, name)
setup:
  - INSERT INTO t VALUES
      ('apple',   'fruit',   10),
      ('apricot', 'fruit',   20),
      ('banana',  'fruit',   30),
      ('bean',    'veggie',  40),
      ('carrot',  'veggie',  50),
      ('cabbage', 'veggie',  60),
      ('date',    'fruit',   70)
  - INSERT INTO t2 VALUES
      (1, 'active'),
      (2, 'archived'),
      (3, 'awaiting'),
      (4, 'deleted'),
      (5, 'disabled')
  - INSERT INTO cp VALUES
      ('us', 'apple',   10),
      ('us', 'apricot', 20),
      ('us', 'banana',  30),
      ('eu', 'apple',   40),
      ('eu', 'bean',    50)
  - INSERT INTO ci VALUES
      (1, 'us', 'apple'),
      (2, 'us', 'apricot'),
      (3, 'us', 'banana'),
      (4, 'eu', 'apple'),
      (5, 'eu', 'bean')
tests:
  # -------------------------------------------------------------------
  # PK LIKE prefix — basic cases
  # -------------------------------------------------------------------

  # 'a%' matches apple, apricot.
  - query: SELECT name FROM t WHERE name LIKE 'a%' ORDER BY name
    plan_contains: "PredicatesFilter"
    plan_not_contains: "<>"
    rows:
      - ['apple']
      - ['apricot']

  # 'ba%' matches banana (not bean — 'bean' starts with 'be').
  - query: SELECT name FROM t WHERE name LIKE 'ba%'
    plan_contains: "PredicatesFilter"
    plan_not_contains: "<>"
    rows:
      - ['banana']

  # 'be%' matches bean.
  - query: SELECT name FROM t WHERE name LIKE 'be%'
    plan_contains: "PredicatesFilter"
    plan_not_contains: "<>"
    rows:
      - ['bean']

  # Longer prefix — 'car%' matches only carrot.
  - query: SELECT name FROM t WHERE name LIKE 'car%'
    plan_contains: "PredicatesFilter"
    plan_not_contains: "<>"
    rows:
      - ['carrot']

  # Exact prefix (pattern without wildcards not covered by LIKE
  # pushdown — it's equality, but LIKE 'apple' with no % still works
  # via scan).
  - query: SELECT name FROM t WHERE name LIKE 'apple'
    plan_contains: "PredicatesFilter"
    plan_not_contains: "<>"
    rows:
      - ['apple']

  # No matches.
  - query: SELECT name FROM t WHERE name LIKE 'xyz%'
    plan_contains: "PredicatesFilter"
    plan_not_contains: "<>"
    rows: []

  # Prefix matches everything starting with that letter.
  - query: SELECT name FROM t WHERE name LIKE 'c%' ORDER BY name
    plan_contains: "PredicatesFilter"
    plan_not_contains: "<>"
    rows:
      - ['cabbage']
      - ['carrot']

  # Prefix matches single row where the prefix is longer than row
  # (pattern "appleX%" matches nothing, since "apple" != "appleX").
  - query: SELECT name FROM t WHERE name LIKE 'appleX%'
    plan_contains: "PredicatesFilter"
    plan_not_contains: "<>"
    rows: []

  # -------------------------------------------------------------------
  # PK LIKE prefix + residual AND predicates
  # -------------------------------------------------------------------

  # No narrowing: the LIKE and `v > 10` are both per-row residuals.
  - query: SELECT name FROM t WHERE name LIKE 'a%' AND v > 10 ORDER BY name
    plan_contains: "PredicatesFilter"
    plan_not_contains: "<>"
    rows:
      - ['apricot']

  # No narrowing: the LIKE and the tag equality are both per-row residuals.
  - query: SELECT name FROM t WHERE name LIKE 'b%' AND tag = 'fruit'
    plan_contains: "PredicatesFilter"
    plan_not_contains: "<>"
    rows:
      - ['banana']

  # -------------------------------------------------------------------
  # NOT LIKE
  # -------------------------------------------------------------------

  # NOT LIKE, correct via the scan.
  - query: SELECT name FROM t WHERE name NOT LIKE 'a%' ORDER BY name
    plan_contains: "PredicatesFilter"
    plan_not_contains: "<>"
    rows:
      - ['banana']
      - ['bean']
      - ['cabbage']
      - ['carrot']
      - ['date']

  # -------------------------------------------------------------------
  # Interior wildcard / underscore / leading wildcard
  # -------------------------------------------------------------------

  # Interior `_`: matches 'bean' (4 chars: b-e-a-n), pattern 'b_an'
  # wildcards the second char → 'bean' matches; 'banana' doesn't
  # (wrong length).
  - query: SELECT name FROM t WHERE name LIKE 'b_an'
    plan_contains: "PredicatesFilter"
    plan_not_contains: "<>"
    rows:
      - ['bean']

  # Interior `%`: pattern 'b%an%' — 'banana' (has 'an' after 'b'),
  # 'bean' (has 'an' at end).
  - query: SELECT name FROM t WHERE name LIKE 'b%an%' ORDER BY name
    plan_contains: "PredicatesFilter"
    plan_not_contains: "<>"
    rows:
      - ['banana']
      - ['bean']

  # Leading wildcard.
  - query: SELECT name FROM t WHERE name LIKE '%ate'
    plan_contains: "PredicatesFilter"
    plan_not_contains: "<>"
    rows:
      - ['date']

  # Empty-prefix `%` matches everything.
  - query: SELECT COUNT(*) FROM t WHERE name LIKE '%'
    plan_contains: "PredicatesFilter"
    plan_not_contains: "<>"
    rows:
      - [7]

  # -------------------------------------------------------------------
  # Secondary index: not opened at all
  # -------------------------------------------------------------------

  # idx_status is a VALUE index on status (STRING), and `status LIKE 'a%'`
  # does not reach it — the plan is a full scan of T2. That is what
  # `plan_not_contains: IndexScan` records.
  - query: SELECT id, status FROM t2 WHERE status LIKE 'a%' ORDER BY id
    plan_contains: "PredicatesFilter(Scan(T2)"
    plan_not_contains: "IndexScan"
    rows:
      - [1, 'active']
      - [2, 'archived']
      - [3, 'awaiting']

  # `status LIKE 'd%'` hits the 'de*' and 'di*' rows.
  - query: SELECT id FROM t2 WHERE status LIKE 'd%' ORDER BY id
    plan_contains: "PredicatesFilter(Scan(T2)"
    plan_not_contains: "IndexScan"
    rows:
      - [4]
      - [5]

  # Longer prefix: only the matching status.
  - query: SELECT id FROM t2 WHERE status LIKE 'awa%'
    plan_contains: "PredicatesFilter(Scan(T2)"
    plan_not_contains: "IndexScan"
    rows:
      - [3]

  # No matching rows → empty.
  - query: SELECT id FROM t2 WHERE status LIKE 'zzz%'
    plan_contains: "PredicatesFilter(Scan(T2)"
    plan_not_contains: "IndexScan"
    rows: []

  # -------------------------------------------------------------------
  # UPDATE / DELETE with a PK LIKE predicate
  # -------------------------------------------------------------------

  - query: UPDATE t SET tag = 'updated' WHERE name LIKE 'a%'
  - query: SELECT name, tag FROM t WHERE name LIKE 'a%' ORDER BY name
    plan_contains: "PredicatesFilter"
    plan_not_contains: "<>"
    rows:
      - ['apple',   'updated']
      - ['apricot', 'updated']
  # Rows outside the prefix untouched.
  - query: SELECT tag FROM t WHERE name = 'banana'
    plan_contains: "Scan(T, [=])"
    plan_not_contains: "PredicatesFilter"
    rows:
      - ['fruit']

  - query: DELETE FROM t WHERE name LIKE 'c%'
  - query: SELECT COUNT(*) FROM t WHERE name LIKE 'c%'
    plan_contains: "PredicatesFilter"
    plan_not_contains: "<>"
    rows:
      - [0]
  - query: SELECT COUNT(*) FROM t
    rows:
      - [5]

  # -------------------------------------------------------------------
  # Composite-PK LIKE prefix: leading eq on region + LIKE on name
  # -------------------------------------------------------------------

  # PK (region, name). The region equality opens the scan at [=]; the LIKE
  # on the second PK column does NOT add a bound, it stays a residual. The old
  # comment claimed it narrowed
  # to the tuple prefix ['us', 'a'] — it does not.
  - query: SELECT region, name FROM cp WHERE region = 'us' AND name LIKE 'a%' ORDER BY name
    plan_contains: "PredicatesFilter(Scan(CP, [=])"
    plan_not_contains: "<>"
    rows:
      - ['us', 'apple']
      - ['us', 'apricot']

  # Same shape, different prefix.
  - query: SELECT region, name FROM cp WHERE region = 'eu' AND name LIKE 'b%'
    plan_contains: "PredicatesFilter(Scan(CP, [=])"
    plan_not_contains: "<>"
    rows:
      - ['eu', 'bean']

  # Composite PK LIKE + residual on non-indexed col.
  - query: SELECT name FROM cp WHERE region = 'us' AND name LIKE 'a%' AND v > 10
    plan_contains: "PredicatesFilter(Scan(CP, [=])"
    plan_not_contains: "<>"
    rows:
      - ['apricot']

  # Composite PK LIKE with NO match.
  - query: SELECT region FROM cp WHERE region = 'us' AND name LIKE 'zzz%'
    plan_contains: "PredicatesFilter(Scan(CP, [=])"
    plan_not_contains: "<>"
    rows: []

  # -------------------------------------------------------------------
  # Composite secondary-index LIKE prefix
  # -------------------------------------------------------------------

  # idx_region_name on (region, name). WHERE region = 'us' AND
  # WHERE region = 'us' opens the index at [=, *]; the LIKE does NOT extend
  # that to a range on the second column — it stays a residual filter.
  - query: SELECT id, region, name FROM ci WHERE region = 'us' AND name LIKE 'a%' ORDER BY id
    plan_contains: "PredicatesFilter(IndexScan(IDX_REGION_NAME, [=, *])"
    plan_not_contains: "<>"
    rows:
      - [1, 'us', 'apple']
      - [2, 'us', 'apricot']

  - query: SELECT id FROM ci WHERE region = 'eu' AND name LIKE 'b%'
    plan_contains: "PredicatesFilter(IndexScan(IDX_REGION_NAME, [=, *])"
    plan_not_contains: "<>"
    rows:
      - [5]

  # Composite index + LIKE on second col + non-matching first col: the region
  # equality selects an empty index range
  # at the index level (no such region) — empty.
  - query: SELECT id FROM ci WHERE region = 'asia' AND name LIKE 'a%'
    plan_contains: "PredicatesFilter(IndexScan(IDX_REGION_NAME, [=, *])"
    plan_not_contains: "<>"
    rows: []

  # -------------------------------------------------------------------
  # LIKE prefix with ESCAPE clause
  # -------------------------------------------------------------------

  # Seed rows with literal underscores / percents so the ESCAPE patterns
  # below have real data to match.
  - query: INSERT INTO t VALUES ('x_ray', 'extra', 88), ('y%lo', 'extra', 99)
  - query: SELECT name FROM t WHERE name LIKE 'x\_%' ESCAPE '\' ORDER BY name
    plan_contains: "PredicatesFilter"
    plan_not_contains: "<>"
    rows:
      - ['x_ray']

  # Escaped `%` inside the pattern becomes a literal. Here pattern
  # 'y\%%' = literal "y%" + trailing wildcard → matches y%lo.
  - query: SELECT name FROM t WHERE name LIKE 'y\%%' ESCAPE '\' ORDER BY name
    plan_contains: "PredicatesFilter"
    plan_not_contains: "<>"
    rows:
      - ['y%lo']

  # ESCAPE without a trailing `%` is exact-match, and still a full scan.
  - query: SELECT name FROM t WHERE name LIKE 'x\_ray' ESCAPE '\'
    plan_contains: "PredicatesFilter"
    plan_not_contains: "<>"
    rows:
      - ['x_ray']

  # ESCAPE with an interior, unescaped `_`. This was the file's live
  # self-contradiction: the header called interior wildcards ineligible while
  # this comment said the pattern "narrows to the prefix before the `_`".
  # Neither happens — like every other case here it is a full scan with the
  # LIKE applied per row.
  - query: SELECT name FROM t WHERE name LIKE 'y\%l_' ESCAPE '\' ORDER BY name
    plan_contains: "PredicatesFilter"
    plan_not_contains: "<>"
    rows:
      - ['y%lo']

  # -------------------------------------------------------------------
  # Interior wildcards
  # -------------------------------------------------------------------
  #
  # These four cases were labelled "interior-wildcard prefix narrowing" and
  # described as narrowing at the first unescaped wildcard. They do not: the
  # pattern is matched per row against a full scan, exactly like the trailing-
  # `%` cases above. The rows are the real content of this block.

  # 'a%le' matches 'apple'.
  - query: SELECT name FROM t WHERE name LIKE 'a%le' ORDER BY name
    plan_contains: "PredicatesFilter"
    plan_not_contains: "<>"
    rows:
      - ['apple']

  # 'a_ple' matches 'apple' (5 chars, a-_-p-l-e
  # where `_` matches 'p'). Wait — the pattern has underscore at
  # position 1, literal 'p','l','e' at 2,3,4 — so "apple" is
  # a=a, _=p, p=p, l=l, e=e → matches. "apricot" doesn't match
  # (length mismatch).
  - query: SELECT name FROM t WHERE name LIKE 'a_ple' ORDER BY name
    plan_contains: "PredicatesFilter"
    plan_not_contains: "<>"
    rows:
      - ['apple']

  # 'bana%' — trailing wildcard, matches banana.
  - query: SELECT name FROM t WHERE name LIKE 'bana%'
    plan_contains: "PredicatesFilter"
    plan_not_contains: "<>"
    rows:
      - ['banana']

  # Underscore at the start — no literal prefix at all. Still
  # correct via the scan path.
  - query: SELECT name FROM t WHERE name LIKE '_anana'
    plan_contains: "PredicatesFilter"
    plan_not_contains: "<>"
    rows:
      - ['banana']
