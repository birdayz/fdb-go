# nested_correlation_over_a_join.yaml
#
# A CORRELATED EXISTS whose correlation is a NESTED struct path, over a JOIN.
# Nothing here involves ORDER BY or a projected EXISTS — this is the wrong-rows
# half of the leg-window re-anchor (RFC-222), and it lives in its own file
# precisely because it is NOT the projected-EXISTS fold: mixing it into
# projected_exists_nested_sort_key.yaml would have inflated that file's
# fold-coverage census with entries the fold never sees.
#
# THE DEFECT. `rebaseOuterLegValueOrdinal` dispatched on a reference's frontier
# pin rather than on its arity, so a nested leg reference took whichever arm its
# pin selected. Unpinned, it took the NAME arm, which looked up the reference's
# display Field — for a nested reference that is the struct ROOT — found it in
# the leg, baked the merged address of the whole struct and DROPPED the descent.
# `t2.t1_id = n.co` therefore compared a BIGINT against a record at a perfectly
# valid merged ordinal: no error, no rows.
#
# Measured pre-fix, this exact data: the EXISTS form returned NOTHING and the
# NOT EXISTS form returned all three ids.
#
# WHY THE CORRELATION IS ON `co`. `sk` is (50,40,30) and can never equal a
# t2.t1_id of 1 or 3, so an `sk` correlation returns zero rows with the fix AND
# without it — a stanza that would pass vacuously while claiming to detect the
# defect. `co` is (1,2,3) and matches ids 1 and 3, so the two outcomes differ.
#
# WHY THE JOIN IS ROW-PRESERVING. t3 holds exactly one row per t1 row, so the
# join cannot change which t1 rows qualify. The expected rows are therefore the
# single-table answer, which is what makes "the join changed the answer" a
# statement about the rebase rather than about the data.
name: nested_correlation_over_a_join
schema_template: |
  CREATE TYPE AS STRUCT nst (sk BIGINT, co BIGINT)
  CREATE TABLE t1 (id BIGINT, n nst, PRIMARY KEY (id))
  CREATE TABLE t2 (id BIGINT, t1_id BIGINT, PRIMARY KEY (id))
  CREATE TABLE t3 (id BIGINT, t1_id BIGINT, PRIMARY KEY (id))
setup:
  - INSERT INTO t1 VALUES (1, (50, 1)), (2, (40, 2)), (3, (30, 3))
  - INSERT INTO t2 VALUES (100, 1), (200, 3)
  - INSERT INTO t3 VALUES (900, 1), (901, 2), (902, 3)
tests:
  # THE SINGLE-TABLE CONTROLS COME FIRST, and they are not decoration: the join
  # results below are only interpretable as a rebase verdict if the same
  # predicate without a join gives the answer they are compared against.
  - query: |
      SELECT id FROM t1
      WHERE EXISTS (SELECT 1 FROM t2 WHERE t2.t1_id = n.co) ORDER BY id
    rows:
      - [1]
      - [3]

  - query: |
      SELECT id FROM t1
      WHERE NOT EXISTS (SELECT 1 FROM t2 WHERE t2.t1_id = n.co) ORDER BY id
    rows:
      - [2]

  # THE JOIN FORMS. Pre-fix these returned [] and [1 2 3] respectively.
  - query: |
      SELECT t1.id FROM t1 JOIN t3 ON t3.t1_id = t1.id
      WHERE EXISTS (SELECT 1 FROM t2 WHERE t2.t1_id = n.co) ORDER BY t1.id
    rows:
      - [1]
      - [3]

  # NOT EXISTS is its own stanza, not a restatement. The truncated comparison
  # matched nothing, so EXISTS collapsed to empty while NOT EXISTS inflated to
  # universal — one polarity alone shows only one of those two failures.
  - query: |
      SELECT t1.id FROM t1 JOIN t3 ON t3.t1_id = t1.id
      WHERE NOT EXISTS (SELECT 1 FROM t2 WHERE t2.t1_id = n.co) ORDER BY t1.id
    rows:
      - [2]
