# index_scan_direction.yaml — Index scan direction tests
#
# Verifies that ORDER BY on indexed columns produces correct results
# in both ASC and DESC directions. The Cascades planner should pick
# ordered index scans when available, avoiding in-memory sort.
# RFC-232 Explain output renders the aggregate's physical output through
# `_current` and retains the source-qualified root on its enforced sort key.
name: index_scan_direction
schema_template: |
  CREATE TABLE events (
    id BIGINT,
    ts BIGINT,
    category STRING,
    payload STRING,
    PRIMARY KEY (id)
  )
  CREATE INDEX idx_ts ON events (ts)
  CREATE INDEX idx_category ON events (category)
setup:
  - INSERT INTO events VALUES
      (1, 100, 'login', 'user1'),
      (2, 200, 'logout', 'user1'),
      (3, 150, 'login', 'user2'),
      (4, 300, 'error', 'user3'),
      (5, 250, 'login', 'user3'),
      (6, 50, 'error', 'user1')
tests:
  # ORDER BY indexed column ASC
  - query: SELECT id, ts FROM events WHERE ts >= 150 ORDER BY ts
    plan_contains: "IndexScan(IDX_TS, [<>] COVERING)"
    plan_not_contains: "InMemorySort"
    rows:
      - [3, 150]
      - [2, 200]
      - [5, 250]
      - [4, 300]

  # ORDER BY indexed column DESC
  - query: SELECT id, ts FROM events WHERE ts >= 150 ORDER BY ts DESC
    plan_contains: "IndexScan(IDX_TS, [<>] COVERING) REVERSE"
    plan_not_contains: "InMemorySort"
    rows:
      - [4, 300]
      - [5, 250]
      - [2, 200]
      - [3, 150]

  # ORDER BY PK ASC with range predicate
  - query: SELECT id, ts FROM events WHERE id > 3 ORDER BY id
    plan_contains: "Scan(EVENTS, [<>])"
    plan_not_contains: "InMemorySort"
    rows:
      - [4, 300]
      - [5, 250]
      - [6, 50]

  # ORDER BY PK DESC
  - query: SELECT id FROM events ORDER BY id DESC
    plan_contains: "Scan(EVENTS) REVERSE"
    plan_not_contains: "InMemorySort"
    rows:
      - [6]
      - [5]
      - [4]
      - [3]
      - [2]
      - [1]

  # ORDER BY string indexed column
  - query: SELECT id, category FROM events WHERE category >= 'l' ORDER BY category, id
    plan_contains: "IndexScan(IDX_CATEGORY, [<>] COVERING)"
    plan_not_contains: "InMemorySort"
    rows:
      - [1, 'login']
      - [3, 'login']
      - [5, 'login']
      - [2, 'logout']

  # Covering index scan with ORDER BY. The BETWEEN upper bound remains a
  # residual below the fetch, but ID (PK suffix) and TS are both present in the
  # index entry. MergeProjectionAndFetchRule and ImplementProjectionRule each
  # independently elide Fetch(PredicatesFilter(Covering)); disabling BOTH
  # restores that fetch and fails this positive RFC-220 covering pin.
  - query: SELECT id, ts FROM events WHERE ts BETWEEN 100 AND 200 ORDER BY ts
    plan_contains: "Project([_current.ID#0, _current.TS#1], PredicatesFilter(IndexScan(IDX_TS, [<>] COVERING), [1 preds]))"
    plan_not_contains: "InMemorySort"
    rows:
      - [1, 100]
      - [3, 150]
      - [2, 200]

  # COUNT with indexed filter
  - query: SELECT COUNT(*) FROM events WHERE category = 'login'
    plan_contains: "IndexScan(IDX_CATEGORY, [=] COVERING)"
    plan_not_contains: "Fetch"
    rows:
      - [3]

  # Multi-value aggregate with indexed filter
  - query: SELECT category, COUNT(*), MIN(ts), MAX(ts) FROM events GROUP BY category ORDER BY category
    plan_contains: "Project([_current.CATEGORY#0, _current.COUNT(*)#1, _current.MIN(TS)#2, _current.MAX(TS)#3], StreamingAgg(keys=[_current.CATEGORY#2], InMemorySort([EVENTS.CATEGORY#2 ASC], Scan(EVENTS))))"
    rows:
      - ['error', 2, 50, 300]
      - ['login', 3, 100, 250]
      - ['logout', 1, 200, 200]
