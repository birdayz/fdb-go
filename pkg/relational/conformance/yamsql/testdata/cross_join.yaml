# cross_join.yaml
#
# Which JOIN spellings produce a cartesian product, and which are
# refused. The dividing line is the JOIN CONDITION, not the CROSS
# keyword: a join with no ON and no USING is refused (fdb-relational
# NPEs on it), and every spelling that carries a condition is answered.
# Each surface syntax is pinned separately so the parser cannot silently
# split them into different execution paths.
name: cross_join
schema_template: |
  CREATE TABLE a (id BIGINT, v BIGINT, PRIMARY KEY (id))
  CREATE TABLE b (id BIGINT, w BIGINT, PRIMARY KEY (id))
setup:
  - INSERT INTO a VALUES (1, 10), (2, 20)
  - INSERT INTO b VALUES (1, 100), (2, 200)
tests:
  # Explicit CROSS JOIN with NO condition — rejected. fdb-relational 4.11.1.0
  # NPEs on `a CROSS JOIN b` because the visitor unconditionally
  # accepts the ON-clause expression, which is null when no ON or
  # USING clause is given. Go matches by rejecting at parse time.
  # Workaround: comma-join `FROM a, b`.
  - query: SELECT a.id, b.id FROM a CROSS JOIN b ORDER BY a.id, b.id
    error_code: "0A000"
  # Comma-join — same result.
  - query: SELECT a.id, b.id FROM a, b ORDER BY a.id, b.id
    rows:
      - [1, 1]
      - [1, 2]
      - [2, 1]
      - [2, 2]
  # INNER JOIN with a trivially-true ON — also cartesian.
  - query: SELECT a.id, b.id FROM a INNER JOIN b ON 1 = 1 ORDER BY a.id, b.id
    rows:
      - [1, 1]
      - [1, 2]
      - [2, 1]
      - [2, 2]
  # COUNT(*) over a cartesian product.
  - query: SELECT COUNT(*) FROM a, b
    rows:
      - [4]
  # Comma-join with a WHERE acting as the join predicate (SQL-89 style).
  - query: SELECT a.v, b.w FROM a, b WHERE a.id = b.id ORDER BY a.id
    rows:
      - [10, 100]
      - [20, 200]
  # THE SPELLINGS THIS FILE'S HEADER CLAIMED AND DID NOT COVER: a JOIN
  # with NO join condition at all. The grammar makes the condition
  # optional for #innerJoin — `(INNER | CROSS)? JOIN tableSourceItem
  # (ON expression | USING '(' uidList ')')?` — so `FROM a JOIN b` is a
  # legal parse producing the SAME null the CROSS-JOIN arm above rejects
  # for, reached without the CROSS token.
  #
  # Both were measured returning FOUR ROWS against a live fdb-relational
  # 4.11.1.0, which NPEs on them (`ExpressionContext.accept … because
  # "expressionCtx" is null`) — a cartesian product where Java has no
  # answer at all, which is the silent direction. The gate now keys on
  # the absent condition rather than on the keyword.
  - query: SELECT a.id, b.id FROM a JOIN b ORDER BY a.id, b.id
    error_code: "0A000"
  # INNER spelled out — same production, same null, same rejection.
  - query: SELECT COUNT(*) FROM a INNER JOIN b
    error_code: "0A000"
  # THE OTHER DIRECTION, and the arm that proves the gate keys on the
  # condition and not the keyword: CROSS *with* an ON parses with a
  # non-null expression, so Java's NPE cannot fire — it was measured
  # returning 4 rows. A gate that tested the CROSS token refused it.
  - query: SELECT a.id, b.id FROM a CROSS JOIN b ON 1 = 1 ORDER BY a.id, b.id
    rows:
      - [1, 1]
      - [1, 2]
      - [2, 1]
      - [2, 2]
  # USING supplies a condition without an `expression`. Both engines
  # answer it (measured: 2 rows), so it must not be caught by the gate.
  - query: SELECT a.id, b.id FROM a JOIN b USING (id) ORDER BY a.id, b.id
    rows:
      - [1, 1]
      - [2, 2]
