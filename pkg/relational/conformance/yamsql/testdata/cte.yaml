# cte.yaml
#
# WITH ... AS (SELECT ...) ... (common table expression). Pins:
#   - basic WITH projection
#   - WITH followed by a query that joins the CTE to another source
#   - multiple CTEs in a single WITH
name: cte
schema_template: |
  CREATE TABLE t (id BIGINT NOT NULL, v BIGINT, PRIMARY KEY (id))
setup:
  - INSERT INTO t VALUES (1, 10), (2, 20), (3, 30), (4, 40)
tests:
  # Basic CTE: materialise a filtered view, then query it.
  - query: |-
      WITH hi AS (SELECT id, v FROM t WHERE v >= 20)
      SELECT id FROM hi ORDER BY id
    rows:
      - [2]
      - [3]
      - [4]
  # CTE used in an aggregate.
  - query: |-
      WITH hi AS (SELECT id, v FROM t WHERE v >= 20)
      SELECT COUNT(*), SUM(v) FROM hi
    rows:
      - [3, 90]
  # Single CTE used as the only source, then filtered further.
  - query: |-
      WITH hi AS (SELECT id, v FROM t WHERE v >= 20)
      SELECT id FROM hi WHERE v >= 30 ORDER BY id
    rows:
      - [3]
      - [4]
  # Multi-CTE cross-join. Previously the wrapper routed the primary
  # source to execSelectFromCTE without checking for joins, which
  # ignored sq.joins entirely. Fixed nightshift-36 by gating that
  # short-circuit on len(sq.joins) == 0 so multi-source queries flow
  # through execSelectJoin, whose scanTableToMaps already resolves
  # CTE names.
  - query: |-
      WITH lo AS (SELECT id FROM t WHERE v < 20),
           hi AS (SELECT id FROM t WHERE v >= 30)
      SELECT COUNT(*) FROM lo, hi
    rows:
      # lo has 1 row (id=1), hi has 2 rows (id=3, id=4). Cross-join = 1*2 = 2.
      - [2]
  # ORDER BY a CTE column not in the projection. The execSelectFromCTE
  # sort path used colIdx, which only contained the projected column
  # names — `total` was missing → sort no-op'd → output came back in
  # insertion order. Now the sort falls back to the materialised CTE
  # row map for keys not in colIdx (mapRows[i] is in lockstep with
  # outRows[i] on the non-aggregate CTE path). Aggregate-on-CTE
  # ordering still uses the colName lookup against projected aggregate
  # outputs.
  - query: |-
      WITH s AS (SELECT id, v * 10 AS scaled FROM t)
      SELECT id FROM s ORDER BY scaled DESC
    rows:
      - [4]
      - [3]
      - [2]
      - [1]
  # ORDER BY a name that's neither in the projection nor a real CTE
  # column errors 42703 instead of silently no-op'ing the sort
  # (round-10 reviewer follow-up). Pre-fix typos would've been
  # masked as "stable order" output.
  - query: |-
      WITH s AS (SELECT id, v FROM t)
      SELECT id FROM s ORDER BY no_such_col
    error_code: "42703"
  # Java alignment: WITH ... AS (...) SELECT * FROM same-table without
  # using the CTE — the CTE is just defined, not referenced. Should
  # work, returning the t1 results.
  - query: |-
      WITH ignored AS (SELECT id FROM t WHERE id > 100)
      SELECT id FROM t ORDER BY id
    rows:
      - [1]
      - [2]
      - [3]
      - [4]
  # Java alignment: WITH c1 AS (SELECT * FROM t) SELECT * FROM c1.
  # CTE that selects everything, projection also selects everything.
  - query: |-
      WITH c1 AS (SELECT * FROM t)
      SELECT * FROM c1 ORDER BY id
    rows:
      - [1, 10]
      - [2, 20]
      - [3, 30]
      - [4, 40]
  # Java alignment: WITH c1(x, y) AS (SELECT id, v FROM t) — column
  # rename in CTE definition. nightshift-39: now applies the rename
  # positionally in the materialized CTE; references to x/y resolve.
  - query: |-
      WITH c1(x, y) AS (SELECT id, v FROM t)
      SELECT x FROM c1 WHERE y >= 30 ORDER BY x
    rows:
      - [3]
      - [4]
  # Mismatched rename count errors 42F10 (INVALID_COLUMN_REFERENCE,
  # Java class-42; cte.yamsql pins this). nightshift-39: aligned from
  # generic 22000 to Java's 42F10.
  - query: |-
      WITH c1(only_one) AS (SELECT id, v FROM t)
      SELECT only_one FROM c1
    error_code: "42F10"
  # Duplicate CTE names in the same WITH list error 42712 (DUPLICATE_
  # ALIAS) — Java's cte.yamsql pin:
  #   WITH c1(w, z) AS (...), c1(a, b) AS (...) SELECT * FROM c1 → 42712.
  # nightshift-39: added duplicate check at materialization time so the
  # error triggers before overwriting the first entry.
  - query: |-
      WITH c1 AS (SELECT id FROM t), c1 AS (SELECT v FROM t)
      SELECT * FROM c1
    error_code: "42712"
  # Single-column rename works.
  - query: |-
      WITH c1(my_id) AS (SELECT id FROM t)
      SELECT my_id FROM c1 ORDER BY my_id
    rows:
      - [1]
      - [2]
      - [3]
      - [4]
  # Java alignment: chained CTE renames — second CTE references the first
  # via its renamed columns.
  - query: |-
      WITH base(d, val) AS (SELECT id, v FROM t),
           filtered(x, y) AS (SELECT d, val FROM base WHERE val > 15)
      SELECT x, y FROM filtered ORDER BY x
    rows:
      - [2, 20]
      - [3, 30]
      - [4, 40]
  # Renamed CTE in CROSS JOIN (multi-CTE).
  - query: |-
      WITH lo(li) AS (SELECT id FROM t WHERE v < 20),
           hi(hi_id) AS (SELECT id FROM t WHERE v >= 30)
      SELECT li, hi_id FROM lo, hi ORDER BY li, hi_id
    rows:
      - [1, 3]
      - [1, 4]
  # Nested CTE references: b references a.
  - query: |-
      WITH a AS (SELECT id FROM t WHERE v >= 20),
           b AS (SELECT id FROM a WHERE id >= 3)
      SELECT id FROM b ORDER BY id
    rows:
      - [3]
      - [4]
  # 3-level CTE chain.
  - query: |-
      WITH a AS (SELECT id, v FROM t),
           b AS (SELECT id FROM a WHERE v >= 20),
           c AS (SELECT id FROM b WHERE id >= 3)
      SELECT id FROM c ORDER BY id
    rows:
      - [3]
      - [4]
  # Java alignment (cte.yamsql line 111,114): WITH rename hides the
  # original column names. `c1(w, z) AS (SELECT id, v FROM t)`
  # renames id→w, v→z; referencing `id` or `v` from c1 errors 42703
  # because those names are no longer in the CTE output.
  - query: |-
      WITH c1(w, z) AS (SELECT id, v FROM t) SELECT v FROM c1
    error_code: "42703"
  - query: |-
      WITH c1(w, z) AS (SELECT id, v FROM t) SELECT id FROM c1
    error_code: "42703"
  # SELECT * on a renamed CTE returns all renamed cols. Java alignment.
  - query: |-
      WITH c1(w, z) AS (SELECT id, v FROM t WHERE id <= 2) SELECT * FROM c1 ORDER BY w
    rows:
      - [1, 10]
      - [2, 20]
  # Nested WITH (Java cte.yamsql line 89): outer c1 renames (w, z);
  # inner c3 selects id from c1. Java errors 42703 (c1 is visible via
  # lexical CTE scoping but id is not among its renamed columns).
  # DIVERGENCE CLOSED (RFC-180): the nested WITH used to be silently
  # DROPPED by the CTE body build (VisitQueryBody skipped the body's
  # ctes), so `c3` was an unknown table (42F01). buildCTEBodyQuery now
  # builds the body as a full query — nested CTEs register with lexical
  # shadowing, enclosing CTEs stay visible — and Go matches Java's 42703.
  - query: |-
      WITH c1(w, z) AS (SELECT id, v FROM t),
           c2(a, b) AS (
             WITH c3(aa, bb) AS (SELECT id, v FROM c1 WHERE id <= 2)
             SELECT * FROM c3
           )
      SELECT * FROM c1, c2
    error_code: "42703"
  # CTE with aggregate (GROUP BY + SUM) joined to base table.
  - query: |-
      WITH sums AS (SELECT id, SUM(v) AS total FROM t GROUP BY id)
      SELECT t.id, s.total
      FROM t, sums s
      WHERE t.id = s.id AND s.total >= 30
      ORDER BY t.id
    rows:
      - [3, 30]
      - [4, 40]
  # RFC-180 regression pin (reviewer-caught restore-composition bug): a VALID
  # nested-WITH CTE body must not evict the ENCLOSING CTE from scope. The
  # nested build snapshots/restores the CTE maps; buildCTEBodySelfHidden
  # restores the enclosing name by mutating the map OBJECT it captured — a
  # clone-and-reassign restore stranded that write in an orphaned map, so c2
  # vanished after its own body build and the main query's NAMED column reads
  # over c2 failed (SELECT * near-missed it: no column resolution). Both the
  # main query and a later sibling reference c2 by column here.
  - query: |-
      WITH c1(w) AS (SELECT id FROM t),
           c2(a) AS (WITH c3(x) AS (SELECT id FROM t WHERE id <= 2) SELECT x FROM c3)
      SELECT w, a FROM c1, c2 WHERE w = a ORDER BY w
    rows:
      - [1, 1]
      - [2, 2]
  - query: |-
      WITH c1(w) AS (SELECT id FROM t WHERE id >= 3),
           c2(a) AS (WITH c3(x) AS (SELECT id FROM t WHERE id <= 2) SELECT x FROM c3),
           c4(b) AS (SELECT a FROM c2)
      SELECT b FROM c4 ORDER BY b
    rows:
      - [1]
      - [2]
  # Codex-caught: an UNDERIVABLE nested CTE (join-shaped body) shadowing an
  # outer same-name CTE must not leave the OUTER schema visible to the
  # enclosing body — before the fix the enclosing body's reads validated
  # against outer c1(w)'s schema and baked foreign ordinals over the inner's
  # row (silent wrong slot). With the shadow eviction the shape declines
  # LOUD: join-bodied CTE schema derivation is the documented ON-only reach
  # gap, so c2's registration declines and the named read cannot plan.
  # Correct-or-loud; rows ([1,1],[2,2]) when join-bodied derivation lands.
  - query: |-
      WITH c1(w) AS (SELECT id FROM t),
           c2(a) AS (WITH c1 AS (SELECT x.id AS id FROM t AS x, t AS y WHERE x.id = y.id) SELECT id FROM c1 WHERE id <= 2)
      SELECT w, a FROM c1, c2 WHERE w = a ORDER BY w
    error_code: "0AF00"
  # Deletion-as-eviction left ABSENCE, and absence falls back to the CATALOG:
  # here the underivable nested CTE shadows the BASE TABLE t itself, and its
  # output column `id` deliberately carries V values (reversed mapping). The
  # pre-tombstone silent path derived the enclosing schema from the BASE
  # table, so `WHERE id <= 2` filtered real ids (rows 1,2) instead of the
  # nested CTE's v-values (all >= 10 — EMPTY is the correct answer). The
  # tombstone (declared-but-underivable marker) suppresses catalog fallback
  # on every schema-resolution path, and the plan side (which always built
  # the nested body correctly) now runs to the right result end-to-end.
  - query: |-
      WITH c2(a) AS (WITH t AS (SELECT x.v AS id FROM t AS x, t AS y WHERE x.id = y.id) SELECT id FROM t WHERE id <= 2)
      SELECT a FROM c2 ORDER BY a
    rows: []
  # A COMPUTED enclosing projection routes through the projection resolver
  # (buildProjectionResolverWithCTEScopes), which AddSource'd the tombstone
  # unchecked — Scope.ResolveColumn nil-dereferenced (recovered → XX000 on a
  # valid-shaped query). AddSource now rejects nil-Table sources at the
  # chokepoint, so EVERY resolver path declines clean.
  - query: |-
      WITH c1(w) AS (SELECT id FROM t),
           c2(a) AS (WITH c1 AS (SELECT x.id AS id FROM t AS x, t AS y WHERE x.id = y.id) SELECT id + 1 FROM c1)
      SELECT w, a FROM c1, c2 WHERE w = a ORDER BY w
    error_code: "0AF00"
  # Alias-arity validation must not be bypassed by a tombstoned (underivable)
  # body: the derivable branch's 42F10 check never ran for this class, so a
  # two-alias list over a statically one-column body executed instead of
  # erroring like its derivable twin.
  - query: |-
      WITH c2(a, b) AS (WITH t AS (SELECT x.v AS id FROM t AS x, t AS y WHERE x.id = y.id) SELECT id FROM t)
      SELECT a FROM c2
    error_code: "42F10"
  # A MIXED qualified-star projection (x.* alongside named columns) occupies
  # one projCols sentinel but expands to every source column — the static
  # arity check must treat it as UNKNOWN width, not reject a valid four-alias
  # CTE against the three-slot sentinel count (t has 2 cols: x.* -> id,v).
  - query: |-
      WITH c(a, b, cc, d) AS (SELECT x.*, y.id, y.v FROM t AS x, t AS y WHERE x.id = y.id)
      SELECT COUNT(*) FROM c
    rows:
      - [4]
  # ...and the star EXPANDS for validation: two aliases over the same
  # four-column mixed-star body must still error 42F10 (skipping validation
  # for star-bearing bodies entirely would let this execute with the
  # mismatched alias list silently ignored).
  - query: |-
      WITH c(a, b) AS (SELECT x.*, y.id, y.v FROM t AS x, t AS y WHERE x.id = y.id)
      SELECT COUNT(*) FROM c
    error_code: "42F10"
  # ...and star width resolves CTE-FIRST: with a preceding CTE shadowing the
  # base table (t(z) = 1 column vs base t = 2), p.* expands to the CTE's
  # width — md-first counted 3 and rejected this valid two-alias list.
  - query: |-
      WITH t(z) AS (SELECT id FROM t),
           c(a, b) AS (SELECT p.*, q.z FROM t AS p, t AS q WHERE p.z = q.z)
      SELECT COUNT(*) FROM c
    rows:
      - [4]
  # A DERIVED source's range alias colliding with a CTE name must NOT expand
  # its star through the CTE (the CTE-first lookup would project the
  # UNRELATED one-column CTE's schema over the two-column derived row —
  # silent wrong columns). Derived sources register no star source; this
  # reach class was a plan-time 0AF00 before the shadowing work and stays
  # one (probed at the pre-change SHA) — loud, never wrong columns.
  - query: |-
      WITH x AS (SELECT id FROM t)
      SELECT x.*, x.id FROM (SELECT id, v FROM t WHERE id <= 2) AS x ORDER BY x.id
    error_code: "0AF00"
  # Nested-WITH arity at the point of truth (the deleted static predictor
  # counted the OUTER x's one-column width): nested x (2 cols) shadows outer
  # x (1 col) inside c's body; the BUILT body's output width (2) is the
  # alias-validation authority — (a,b) answers, (a) errors 42F10.
  - query: |-
      WITH x(one) AS (SELECT id FROM t),
           c(a, b) AS (WITH x(m, n) AS (SELECT id, v FROM t WHERE id <= 2) SELECT m, n FROM x)
      SELECT a, b FROM c ORDER BY a
    rows:
      - [1, 10]
      - [2, 20]
  - query: |-
      WITH x(one) AS (SELECT id FROM t),
           c(a) AS (WITH x(m, n) AS (SELECT id, v FROM t WHERE id <= 2) SELECT m, n FROM x)
      SELECT a FROM c
    error_code: "42F10"
