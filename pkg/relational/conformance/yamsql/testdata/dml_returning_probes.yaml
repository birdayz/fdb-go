# dml_returning_probes.yaml
#
# DML RETURNING (Java's QueryVisitor.visitUpdateStatement /
# visitDeleteStatement): UPDATE and DELETE answer a select over the modified
# rows, an UPDATE's "old" and "new" records and a DELETE's deleted record.
# INSERT has no RETURNING in the grammar.
name: dml_returning_probes
schema_template: |
  CREATE TABLE t (id BIGINT, n BIGINT, PRIMARY KEY (id))
setup:
  - INSERT INTO t VALUES (1, 10), (2, 20), (3, 30)
tests:
  - query: DELETE FROM t WHERE id = 1 RETURNING id, n
    rows:
      - [1, 10]
  - query: SELECT id FROM t WHERE id = 1
    rows: []
  # An UPDATE's list reads only "old" and "new".
  - query: UPDATE t SET n = 99 WHERE id = 2 RETURNING id, n
    error_code: "42703"
  - query: UPDATE t SET n = 99 WHERE id = 2 RETURNING "old".n, "new".n
    rows:
      - [20, 99]
  - query: SELECT n FROM t WHERE id = 2
    rows:
      - [99]
  # INSERT has no RETURNING in the grammar.
  - query: INSERT INTO t VALUES (4, 40) RETURNING id, n
    error_code: "42601"
