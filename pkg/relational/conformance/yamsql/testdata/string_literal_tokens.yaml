# string_literal_tokens.yaml — string literals are decoded token by token
#
# Java's stringLiteral is `STRING_LITERAL STRING_LITERAL+ | ...`
# (RelationalParser.g4), and SemanticAnalyzer.normalizeStringLiteral decodes
# EACH token (strip the quotes, '' -> ') before joining them, so 'a' 'b' is ab
# and 'a''b' is a'b. A charset-prefixed, national or collated literal is
# refused with 0AF00 in Java's words (ExpressionVisitor.visitStringLiteral),
# including its "charset not is supported" wording. Every outcome here is the
# measured Java 4.14.2.0 outcome (WS-E oracle: literal_*,
# like_adjacent_literal_pattern).
name: string_literal_tokens
schema_template: |
  CREATE TABLE T (id BIGINT, s STRING, PRIMARY KEY (id))
setup:
  - INSERT INTO T VALUES (1, 'abc'), (2, 'a''b'), (3, 'a%b'), (4, 'xyz')
tests:
  # Projection.
  - query: SELECT 'a' 'b' FROM T WHERE id = 1
    column_types: [STRING]
    rows:
      - ["ab"]
  - query: SELECT 'a''b' FROM T WHERE id = 1
    rows:
      - ["a'b"]
  - query: SELECT 'a''' 'b' FROM T WHERE id = 1
    rows:
      - ["a'b"]

  # Predicates compare the joined value.
  - query: SELECT id FROM T WHERE s = 'a' 'bc'
    rows:
      - [1]
  - query: SELECT id FROM T WHERE s = 'a''' 'b'
    rows:
      - [2]

  # LIKE patterns join their tokens; ESCAPE is one token.
  - query: SELECT id FROM T WHERE s LIKE 'a' '%' ORDER BY id
    rows:
      - [1]
      - [2]
      - [3]
  - query: SELECT id FROM T WHERE s LIKE 'a!%' 'b' ESCAPE '!'
    rows:
      - [3]

  # INSERT and UPDATE values.
  - query: INSERT INTO T VALUES (5, 'p' 'q''')
    rowcount: 1
  - query: SELECT s FROM T WHERE id = 5
    rows:
      - ["pq'"]
  - query: UPDATE T SET s = 'r' 's' WHERE id = 5
    rowcount: 1
  - query: SELECT s FROM T WHERE id = 5
    rows:
      - ["rs"]

  # Decorated literals are refused.
  - query: SELECT _utf8'abc' FROM T WHERE id = 1
    error_code: "0AF00"
    error_message: "charset not is supported"
  - query: SELECT N'abc' FROM T WHERE id = 1
    error_code: "0AF00"
    error_message: "national string literal is not supported"
  - query: SELECT 'abc' COLLATE utf8_bin FROM T WHERE id = 1
    error_code: "0AF00"
    error_message: "collation is not supported"
