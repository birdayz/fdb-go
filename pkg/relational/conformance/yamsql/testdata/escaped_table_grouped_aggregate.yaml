# escaped_table_grouped_aggregate.yaml
#
# RFC-238 §7c predicted five matching gates turn on when the escaped-name
# divergence is fixed. This file measured the streaming-aggregate gate before
# the fix (the escaped table sorted in memory where the index supplied the
# order) and pins it after: both tables get the covering index scan.
#
# The shape is the one the streaming-aggregate and aggregate-data-access gates
# need: an escaped table, a covering index over the grouping column, and a
# grouped query. `u` is the same query over an UNESCAPED table, and the pair is
# the whole point — a difference between them is the divergence, and a plan
# that is poor for BOTH is something else entirely.
name: escaped_table_grouped_aggregate
schema_template: |
  CREATE TABLE "AGG$T" (id BIGINT, g BIGINT, v BIGINT, PRIMARY KEY (id))
  CREATE TABLE u (id BIGINT, g BIGINT, v BIGINT, PRIMARY KEY (id))
  CREATE INDEX agg_g ON "AGG$T" (g)
  CREATE INDEX u_g ON u (g)
setup:
  - INSERT INTO "AGG$T" VALUES (1, 10, 100), (2, 10, 200), (3, 20, 300)
  - INSERT INTO u VALUES (1, 10, 100), (2, 10, 200), (3, 20, 300)
tests:
  # The unescaped control: whatever access path this schema affords, `u` gets
  # it.
  - query: SELECT g, COUNT(*) FROM u GROUP BY g ORDER BY g
    plan_contains: "StreamingAgg(keys=[_current.G#1], IndexScan(U_G, [*] COVERING))"
    rows:
      - [10, 2]
      - [20, 1]

  # The escaped table, same query, same access path.
  - query: SELECT g, COUNT(*) FROM "AGG$T" GROUP BY g ORDER BY g
    plan_contains: "StreamingAgg(keys=[_current.G#1], IndexScan(AGG_G, [*] COVERING))"
    rows:
      - [10, 2]
      - [20, 1]

  # And a grouped MAX, which reaches a different gate than COUNT does.
  - query: SELECT g, MAX(v) FROM u GROUP BY g ORDER BY g
    rows:
      - [10, 200]
      - [20, 300]

  - query: SELECT g, MAX(v) FROM "AGG$T" GROUP BY g ORDER BY g
    rows:
      - [10, 200]
      - [20, 300]
