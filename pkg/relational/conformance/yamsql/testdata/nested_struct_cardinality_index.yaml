# nested_struct_cardinality_index.yaml
#
# A CARDINALITY index over a NESTED quoted struct path is matched: the function
# key's argument is read by its full path ("struct"."int_arr"), so the
# candidate's column Value is CARDINALITY of that path and the query's
# CARDINALITY("struct"."int_arr") binds it (Java: ISCAN(tab2_index [EQUALS ...])
# in arrays-cardinality.yamsql).
name: nested_struct_cardinality_index
schema_template: |
  CREATE TYPE AS STRUCT "QS" ("int_arr" INTEGER ARRAY)
  CREATE TABLE qnest ("id" BIGINT, "struct" "QS", PRIMARY KEY ("id"))
  CREATE INDEX qnest_card AS SELECT CARDINALITY("struct"."int_arr") AS "card" FROM qnest ORDER BY "card"
setup:
  - INSERT INTO qnest VALUES (1, ([])), (2, ([1])), (3, ([1, 2])), (4, ([7]))
tests:
  - query: SELECT "id" FROM qnest WHERE CARDINALITY("struct"."int_arr") = 1
    plan_contains: "IndexScan(QNEST_CARD, [=]"
    rows:
      - [2]
      - [4]
  - query: SELECT "id" FROM qnest ORDER BY CARDINALITY("struct"."int_arr"), "id"
    plan_contains: "IndexScan(QNEST_CARD, [*]"
    plan_not_contains: "Sort"
    rows:
      - [1]
      - [2]
      - [4]
      - [3]
