# in_list_index_plan.yaml — IN-list queries must probe the index per value
#
# When a table has an index on a column used in an IN-list predicate,
# the Cascades planner should iterate over IN-list values and do
# per-value index probes. This is O(k) where k = IN-list size, versus
# O(N) for a full scan + filter.
#
# Which per-value operator wins is driven by the requested ordering. With
# no ORDER BY the planner picks InJoin; with an ORDER BY the ordered
# IN-UNION merge across the per-value streams PROVIDES that order, so it
# beats InJoin plus an enforcer sort (Java's RecordQueryInUnionPlan is the
# ordered-IN plan; InJoin provides no cross-value order).
#
# The plan_contains assertions verify the optimization fires.
name: in_list_index_plan
schema_template: |
  CREATE TABLE items (
    id BIGINT,
    category STRING,
    name STRING,
    price BIGINT,
    PRIMARY KEY (id)
  )
  CREATE INDEX idx_category ON items (category)
  CREATE INDEX idx_price ON items (price)
setup:
  - INSERT INTO items VALUES
      (1, 'books', 'Go Programming', 45),
      (2, 'books', 'Algorithms', 60),
      (3, 'electronics', 'Keyboard', 120),
      (4, 'electronics', 'Mouse', 30),
      (5, 'clothing', 'Shirt', 25),
      (6, 'clothing', 'Jacket', 90),
      (7, 'food', 'Coffee', 15),
      (8, 'food', 'Tea', 10)
tests:
  # IN-list on indexed column with small list, ORDER BY id — ordered IN-UNION
  - query: SELECT id, category FROM items WHERE category IN ('books', 'electronics') ORDER BY id
    plan_contains: "InUnion(IndexScan(IDX_CATEGORY, [=]), bindings=1, ASC)"
    rows:
      - [1, 'books']
      - [2, 'books']
      - [3, 'electronics']
      - [4, 'electronics']

  # IN-list on indexed column with single value (should become equality)
  - query: SELECT id, name FROM items WHERE category IN ('food') ORDER BY id
    plan_not_contains: InJoin
    rows:
      - [7, 'Coffee']
      - [8, 'Tea']

  # IN-list on integer indexed column, ORDER BY id — ordered IN-UNION
  - query: SELECT id, name FROM items WHERE price IN (25, 45, 120) ORDER BY id
    plan_contains: "InUnion(IndexScan(IDX_PRICE, [=]), bindings=1, ASC)"
    rows:
      - [1, 'Go Programming']
      - [3, 'Keyboard']
      - [5, 'Shirt']

  # IN-list on PK column (should use PK index probe)
  # ORDER BY over IN plans as an IN-UNION: the merge across per-value
  # streams PROVIDES the requested order (Java's RecordQueryInUnionPlan is
  # the ordered-IN plan — InJoin provides no cross-value order and would
  # need an enforcer sort). The leg-pinned in-union rule (RFC-181 P0.3)
  # fires for this shape now that leg satisfaction resolves structurally.
  - query: SELECT id, name FROM items WHERE id IN (2, 5, 7) ORDER BY id
    plan_contains: InUnion
    rows:
      - [2, 'Algorithms']
      - [5, 'Shirt']
      - [7, 'Coffee']

  # IN-list with no matching rows
  - query: SELECT id FROM items WHERE category IN ('toys', 'sports')
    plan_contains: InJoin
    rows: []

  # IN-list combined with another predicate AND an ORDER BY that neither
  # access path provides for free (id order has no relation to the price
  # range scan) — a single IDX_PRICE range scan with a residual
  # category-IN post-filter beats an InJoin that re-scans IDX_PRICE once
  # PER category value: since a sort is unavoidable either way, paying for
  # N re-scans (InJoin) is strictly more work than paying for one scan plus
  # a residual filter. RFC-190 190.2 re-pinned this from `plan_contains:
  # InJoin` — that pin predated the sort-invariant/promoted-sort-count cost
  # model fix and enshrined the costlier per-category re-scan plan.
  - query: SELECT id, name FROM items WHERE category IN ('books', 'electronics') AND price > 50 ORDER BY id
    plan_not_contains: InJoin
    plan_contains: IndexScan
    rows:
      - [2, 'Algorithms']
      - [3, 'Keyboard']
