# projected_exists_over_a_derived_source.yaml
#
# A correlated EXISTS over a DERIVED SOURCE — a CTE or a derived table — joined
# to another source, in the SELECT list and in the WHERE.
#
# ALL FOUR ARMS USED TO BE BROKEN, and they were broken for THREE UNRELATED
# reasons that one symptom hid. This file's earlier revision pinned the CTE arm
# as `error_code: "42703"` and attributed everything to one root cause — a
# projection not stating the row it produces. That attribution was refuted by
# measurement:
#
#   - The CTE arms failed 42703 because the subquery's OUTER SCOPE registered
#     every real FROM leg and no WITH leg. The arm that proved it is the WHERE
#     form below: same failure, no projected EXISTS anywhere.
#   - The derived-table arms planned and then died in the executor
#     ("multi-leg row cannot serve a source-relative ordinal") because the
#     join's step-1 ordinal seed had no arm for a PROJECTION leg, so the
#     materialized join kept the folded projection as its merged row.
#   - The WHERE arms additionally lost their plan entirely once a projection
#     began stating its row, because the join's orientation gate compared the
#     seed's UNSTATED window field types against the leg's newly stated ones.
#
# THE CONTROLS ARE STILL THE POINT, and they are kept: each arm has a twin
# differing only by removing the correlated EXISTS. They are what localized each
# defect to the derived leg rather than to EXISTS, to the join, or to ORDER BY.
name: projected_exists_over_a_derived_source
schema_template: |
  CREATE TABLE t1 (id BIGINT, v BIGINT, PRIMARY KEY (id))
  CREATE TABLE t2 (id BIGINT, t1_id BIGINT, PRIMARY KEY (id))
  CREATE TABLE t3 (id BIGINT, t1_id BIGINT, PRIMARY KEY (id))
setup:
  - INSERT INTO t1 VALUES (1, 10), (2, 20), (3, 30)
  - INSERT INTO t2 VALUES (100, 1), (200, 3)
  - INSERT INTO t3 VALUES (900, 1), (901, 2), (902, 3)
tests:
  # CONTROL for the CTE arms: identical but for the correlated EXISTS.
  - query: |-
      WITH c AS (SELECT id, v FROM t1)
      SELECT c.id, t1_id FROM c, t3 WHERE t3.t1_id = c.id ORDER BY c.id
    rows:
      - [1, 1]
      - [2, 2]
      - [3, 3]
  # A qualified CTE reference beside a projected EXISTS. t2 has rows for t1 ids
  # 1 and 3 only, so the EXISTS column carries BOTH values — an EXISTS that were
  # constant across the result could not witness a wrong-slot read.
  - query: |-
      WITH c AS (SELECT id, v FROM t1)
      SELECT c.id, t1_id, EXISTS (SELECT 1 FROM t2 WHERE t2.t1_id = c.id) AS h
      FROM c, t3 WHERE t3.t1_id = c.id ORDER BY c.id
    rows:
      - [1, 1, true]
      - [2, 2, false]
      - [3, 3, true]
  # The same correlation with the EXISTS in the WHERE. This arm is what showed
  # the CTE failure was a scope-registration gap and had nothing to do with the
  # projection, so it stays even though its sibling above now passes.
  - query: |-
      WITH c AS (SELECT id, v FROM t1)
      SELECT c.id, t1_id FROM c, t3
      WHERE t3.t1_id = c.id AND EXISTS (SELECT 1 FROM t2 WHERE t2.t1_id = c.id)
      ORDER BY c.id
    rows:
      - [1, 1]
      - [3, 3]
  # CONTROL for the derived-table arms.
  - query: |-
      SELECT d.id, t1_id FROM (SELECT id, v FROM t1) AS d, t3
      WHERE t3.t1_id = d.id ORDER BY d.id
    rows:
      - [1, 1]
      - [2, 2]
      - [3, 3]
  # The derived-table form of the projected EXISTS. This is the arm this runner
  # could not host before: it failed with a *values.UnboundEvalContextError
  # carrying no SQLSTATE, while the runner asserts errors only through
  # errors.As against an *api.Error. Now that it returns rows, the runner can
  # express it and the gap in this file's coverage is closed.
  - query: |-
      SELECT d.id, t1_id, EXISTS (SELECT 1 FROM t2 WHERE t2.t1_id = d.id) AS h
      FROM (SELECT id, v FROM t1) AS d, t3
      WHERE t3.t1_id = d.id ORDER BY d.id
    rows:
      - [1, 1, true]
      - [2, 2, false]
      - [3, 3, true]
  # And its WHERE form — the shape a projection stating its row took the plan
  # away from entirely until the orientation gate stopped reading an unstated
  # field type as a leg mismatch.
  - query: |-
      SELECT d.id, t1_id FROM (SELECT id, v FROM t1) AS d, t3
      WHERE t3.t1_id = d.id AND EXISTS (SELECT 1 FROM t2 WHERE t2.t1_id = d.id)
      ORDER BY d.id
    rows:
      - [1, 1]
      - [3, 3]
