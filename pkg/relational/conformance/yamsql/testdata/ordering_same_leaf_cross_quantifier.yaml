# ordering_same_leaf_cross_quantifier.yaml
#
# The ordering property's key identity must carry the CORRELATION, not just the
# column. Two quantifiers over the SAME table advertise byte-identical ordering
# keys -- same display name, same ordinal, same layout token -- and are
# different columns. A key identity that omits the correlation conflates them,
# and the conflation is not a lost optimisation: it hands a merge join, a
# streaming aggregate or an ORDER BY an adjacency guarantee the stream does not
# have.
#
# The shape is a self-join where the requested order names the INNER leg while
# only the OUTER leg is ordered. The outer scan runs in primary-key order, so
# the join output is ordered by `o.id`; nothing orders it by `i.id`. A planner
# that resolved `i.id` against the outer leg's provided `ID` would elide the
# sort and return rows in o.id order.
#
# The data is chosen so the two orders DISAGREE: `v` pairs each row with a
# different row, so ordering by i.id is a genuine permutation of ordering by
# o.id. With three rows and a bijection that is not the identity, an
# order-sensitive comparison separates the two answers -- which the equal-length
# row set alone would not.
name: ordering_same_leaf_cross_quantifier
schema_template: |
  CREATE TABLE t (id BIGINT NOT NULL, v BIGINT, w BIGINT, PRIMARY KEY (id))
setup:
  # v maps 1->30, 2->10, 3->20; the join `o.v = i.w` therefore pairs
  # o.id=1 with i.id=3, o.id=2 with i.id=1, o.id=3 with i.id=2.
  # Ordering by o.id gives inner ids [3, 1, 2]; by i.id it gives [1, 2, 3].
  - INSERT INTO t VALUES (1, 30, 10), (2, 10, 20), (3, 20, 30)
tests:
  # ORDER BY the INNER leg. Only the outer leg is PK-ordered, so this REQUIRES a
  # sort. The pairs sorted by i.id are (2,1), (3,2), (1,3).
  - query: SELECT o.id AS oid, i.id AS iid FROM t AS o, t AS i WHERE o.v = i.w ORDER BY i.id
    rows:
      - [2, 1]
      - [3, 2]
      - [1, 3]

  # ORDER BY the OUTER leg, the same join. This one IS satisfied by the outer
  # PK scan. Kept beside the case above because the pair is the detector: if a
  # change makes both answer the same way, the correlation stopped mattering.
  - query: SELECT o.id AS oid, i.id AS iid FROM t AS o, t AS i WHERE o.v = i.w ORDER BY o.id
    rows:
      - [1, 3]
      - [2, 1]
      - [3, 2]

  # The same collision through a STREAMING-AGGREGATE boundary, where a false
  # adjacency claim is not just a wrong row order but a wrong GROUPING: a
  # streaming aggregate that believes its input is grouped by the key emits one
  # row per RUN, so an unordered input splits a group into several rows.
  # Grouping by the inner leg's id while only the outer is ordered is exactly
  # that input.
  - query: SELECT i.id AS iid, SUM(o.v) AS s FROM t AS o, t AS i WHERE o.v = i.w GROUP BY i.id ORDER BY i.id
    rows:
      - [1, 10]
      - [2, 20]
      - [3, 30]

  # Grouping by the OUTER leg over the same join -- the direction that IS
  # ordered. Same pairing, so the sums are the outer rows' own v values, and any
  # group splitting shows up as extra rows here too.
  - query: SELECT o.id AS oid, SUM(o.v) AS s FROM t AS o, t AS i WHERE o.v = i.w GROUP BY o.id ORDER BY o.id
    rows:
      - [1, 30]
      - [2, 10]
      - [3, 20]
