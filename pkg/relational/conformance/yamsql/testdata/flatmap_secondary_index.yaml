# flatmap_secondary_index.yaml — FlatMap via secondary index
#
# The inner table has a secondary index on the join column (not PK), so the
# planner should use a correlated index scan via FlatMap. The outer table also
# has an index on name: an outer-only ORDER BY can therefore flow through the
# outer-major FlatMap without an enforcer sort. A paired unindexed ORDER BY
# keeps the InMemorySort fallback live.
name: flatmap_secondary_index
schema_template: |
  CREATE TABLE categories (id BIGINT NOT NULL, name STRING, priority BIGINT, PRIMARY KEY (id))
  CREATE INDEX idx_categories_name ON categories (name)
  CREATE TABLE items (id BIGINT NOT NULL, cat_id BIGINT NOT NULL, title STRING, PRIMARY KEY (id))
  CREATE INDEX idx_items_cat ON items (cat_id)
setup:
  # Names deliberately run opposite to PK order for ids 1 and 2, so the
  # indexed ORDER BY case cannot pass accidentally on the primary scan order.
  - INSERT INTO categories VALUES (1, 'Electronics', 10), (2, 'Books', 30), (3, 'Empty', 20)
  - INSERT INTO items VALUES (10, 1, 'Novel'), (20, 1, 'Textbook'), (30, 2, 'Laptop'), (40, 2, 'Phone'), (50, 2, 'Tablet')
tests:
  # Join via secondary index: categories.id = items.cat_id (cat_id has index)
  - query: SELECT c.name, i.title FROM categories c, items i WHERE c.id = i.cat_id ORDER BY c.name, i.title
    plan_contains: FlatMap
    rows:
      - ["Books", "Laptop"]
      - ["Books", "Phone"]
      - ["Books", "Tablet"]
      - ["Electronics", "Novel"]
      - ["Electronics", "Textbook"]
  # LEFT JOIN: category 'Empty' has no items → NULL title
  - query: SELECT c.name, i.title FROM categories c LEFT JOIN items i ON c.id = i.cat_id ORDER BY c.name, i.title
    rows:
      - ["Books", "Laptop"]
      - ["Books", "Phone"]
      - ["Books", "Tablet"]
      - ["Electronics", "Novel"]
      - ["Electronics", "Textbook"]
      - ["Empty", null]
  # With filter: only Electronics items
  - query: SELECT c.name, i.title FROM categories c, items i WHERE c.id = i.cat_id AND c.name = 'Electronics' ORDER BY i.title
    rows:
      - ["Electronics", "Novel"]
      - ["Electronics", "Textbook"]

  # RFC-190.6 Case 2a: the outer name index satisfies the whole requested
  # ordering. FlatMap drains each inner run before advancing the outer, so the
  # joined stream remains ordered by c.name and needs no InMemorySort.
  - query: SELECT c.name, i.title FROM categories c, items i WHERE c.id = i.cat_id ORDER BY c.name
    plan_contains: FlatMap
    plan_not_contains: InMemorySort
    rows:
      - ["Books", "Laptop"]
      - ["Books", "Phone"]
      - ["Books", "Tablet"]
      - ["Electronics", "Novel"]
      - ["Electronics", "Textbook"]

  # The paired control orders by an unindexed outer column. The same FlatMap
  # remains plannable, but no child ordering satisfies the request, so Go's
  # sanctioned InMemorySort fallback must remain.
  - query: SELECT c.priority, c.name, i.title FROM categories c, items i WHERE c.id = i.cat_id ORDER BY c.priority
    plan_contains: InMemorySort
    rows:
      - [10, "Electronics", "Novel"]
      - [10, "Electronics", "Textbook"]
      - [30, "Books", "Laptop"]
      - [30, "Books", "Phone"]
      - [30, "Books", "Tablet"]
