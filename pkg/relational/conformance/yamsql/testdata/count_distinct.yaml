# count_distinct.yaml
#
# COUNT(DISTINCT) is rejected by both engines. Java's intended code
# for non-ALL aggregators is UNSUPPORTED_QUERY 0AF00
# (ExpressionVisitor.java:353); Go deliberately aligned to that
# (commit cc303815c). Workaround: pre-aggregate via a derived table.
name: count_distinct
schema_template: |
  CREATE TABLE t (id BIGINT NOT NULL, n BIGINT, s STRING, PRIMARY KEY (id))
setup:
  # Mixed types that happen to share a string representation.
  - INSERT INTO t VALUES (1, 5, '5'), (2, 10, '10'), (3, 5, '5'), (4, null, null)
tests:
  - query: SELECT COUNT(DISTINCT n) FROM t
    ansi_gap: [E091-07]
    error_code: "0AF00"
  - query: SELECT COUNT(DISTINCT s) FROM t
    error_code: "0AF00"
  # COUNT(*) counts every row including NULLs — works.
  - query: SELECT COUNT(*) FROM t
    rows:
      - [4]
