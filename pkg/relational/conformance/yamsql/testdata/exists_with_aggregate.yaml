# exists_with_aggregate.yaml — EXISTS subquery with aggregate
#
# Exercises EXISTS where the inner subquery uses GROUP BY/HAVING.
name: exists_with_aggregate
schema_template: |
  CREATE TABLE customers (id BIGINT, name STRING, PRIMARY KEY (id))
  CREATE TABLE orders (id BIGINT, customer_id BIGINT, amount BIGINT, PRIMARY KEY (id))
setup:
  - INSERT INTO customers VALUES (1, 'Alice'), (2, 'Bob'), (3, 'Charlie')
  - INSERT INTO orders VALUES (10, 1, 100), (20, 1, 200), (30, 2, 50)
tests:
  # Customers with total orders > 150. TRACKED PARITY GAP (RFC-180): Java
  # plans a correlated EXISTS over a GROUP BY/HAVING subquery (answer:
  # [Alice]); Go's correlated-EXISTS fallback rebuilds only FROM + WHERE, so
  # before the RFC-180 guard it silently DROPPED the grouping and returned
  # [Alice, Bob] — Bob's group sums to 50 and fails HAVING. Until the port
  # lands, Go declines TYPED (correct-or-loud, never wrong rows). Restore the
  # [Alice] rows pin when the grouped correlated-EXISTS port lands.
  - query: >
      SELECT c.name FROM customers c
      WHERE EXISTS (
        SELECT 1 FROM orders o
        WHERE o.customer_id = c.id
        GROUP BY o.customer_id
        HAVING SUM(o.amount) > 150
      )
    error_code: "0AF00"

  # QUALIFY is a separate admission boundary even when its resolved predicate
  # folds to a constant. Dropping its provenance during bound-query construction
  # must not turn COUNT's one-row result into a constant-true EXISTS.
  - query: >
      SELECT c.name FROM customers c
      WHERE EXISTS (
        SELECT COUNT(*) FROM orders o
        WHERE o.customer_id = c.id
        QUALIFY 1 = 0
      )
    error_code: "0AF00"

  - query: >
      SELECT c.name FROM customers c
      WHERE NOT EXISTS (
        SELECT COUNT(*) FROM orders o
        WHERE o.customer_id = c.id
        QUALIFY 1 = 0
      )
    error_code: "0AF00"

  # OVER must be rejected before an aggregate can acquire an exactly-one-row
  # proof. A windowed aggregate preserves input cardinality instead.
  - query: >
      SELECT c.name FROM customers c
      WHERE EXISTS (
        SELECT COUNT(*) OVER () FROM orders o
        WHERE o.customer_id = c.id
      )
    error_code: "0AF00"

  # Independent UNION producers retain both branches' resolved WHERE bindings.
  # Rebuilding the right predicate under its SQL alias leaves an orphan instead
  # of the query-local source owner. The two controls differ only in emptiness.
  - query: >
      SELECT c.name FROM customers c
      WHERE EXISTS (
        SELECT id FROM orders WHERE amount > 150
        UNION ALL
        SELECT id FROM orders WHERE amount > 1000
      )
      ORDER BY c.name
    rows:
      - ["Alice"]
      - ["Bob"]
      - ["Charlie"]

  - query: >
      SELECT c.name FROM customers c
      WHERE EXISTS (
        SELECT id FROM orders WHERE amount > 1000
        UNION ALL
        SELECT id FROM orders WHERE amount > 1000
      )
    rows: []

  # A right-branch scalar subquery must not cause its QUALIFY to disappear.
  # The left branch is empty; the right MAX match is removed by QUALIFY.
  - query: >
      SELECT c.name FROM customers c
      WHERE EXISTS (
        SELECT id FROM orders WHERE amount < 0
        UNION ALL
        SELECT id FROM orders WHERE id = (SELECT MAX(id) FROM orders)
        QUALIFY 1 = 0
      )
    rows: []

  # Simple EXISTS (any order)
  - query: >
      SELECT c.name FROM customers c
      WHERE EXISTS (SELECT 1 FROM orders o WHERE o.customer_id = c.id)
      ORDER BY c.name
    rows:
      - ["Alice"]
      - ["Bob"]

  # A non-grouped aggregate emits exactly one row before pagination. Alice has
  # two raw order rows, which makes OFFSET 1 a discriminator: pagination over
  # raw rows would incorrectly leave one match, but aggregate-then-offset skips
  # the sole COUNT row and makes EXISTS false for every customer.
  - query: >
      SELECT c.name FROM customers c
      WHERE EXISTS (
        SELECT COUNT(*) FROM orders o
        WHERE o.customer_id = c.id
        LIMIT 1 OFFSET 1
      )
      ORDER BY c.name
    rows: []

  - query: >
      SELECT c.name FROM customers c
      WHERE EXISTS (
        SELECT MAX(o.amount) FROM orders o
        WHERE o.customer_id = c.id
        LIMIT 0
      )
      ORDER BY c.name
    rows: []

  # NOT EXISTS inverts the known-empty post-pagination result.
  - query: >
      SELECT c.name FROM customers c
      WHERE NOT EXISTS (
        SELECT SUM(o.amount) FROM orders o
        WHERE o.customer_id = c.id
        LIMIT 1 OFFSET 1
      )
      ORDER BY c.name
    rows:
      - ["Alice"]
      - ["Bob"]
      - ["Charlie"]

  # A positive LIMIT with zero OFFSET preserves the sole aggregate row,
  # including for Charlie's empty correlated input (COUNT(*) = 0).
  - query: >
      SELECT c.name FROM customers c
      WHERE EXISTS (
        SELECT COUNT(*) FROM orders o
        WHERE o.customer_id = c.id
        LIMIT 1 OFFSET 0
      )
      ORDER BY c.name
    rows:
      - ["Alice"]
      - ["Bob"]
      - ["Charlie"]
