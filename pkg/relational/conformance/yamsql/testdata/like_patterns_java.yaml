# like_patterns_java.yaml — LIKE/NOT LIKE pattern matching.
# Tests prefix, suffix, contains, exact, and escape patterns.
name: like_patterns_java
schema_template: |
  CREATE TABLE items (
    id BIGINT NOT NULL,
    name STRING,
    code STRING,
    PRIMARY KEY (id)
  )
  CREATE INDEX idx_name ON items (name)
setup:
  - INSERT INTO items VALUES
      (1, 'apple', 'A001'),
      (2, 'apricot', 'A002'),
      (3, 'banana', 'B001'),
      (4, 'blueberry', 'B002'),
      (5, 'cherry', 'C001'),
      (6, null, null),
      (7, 'app', 'A010')
tests:
  # Prefix match: LIKE 'ap%'
  - query: SELECT id, name FROM items WHERE name LIKE 'ap%' ORDER BY id
    rows:
      - [1, 'apple']
      - [2, 'apricot']
      - [7, 'app']

  # Suffix match: LIKE '%ry' — 'blueberry' also ends in 'ry'; the
  # original pin missed it.
  - query: SELECT id, name FROM items WHERE name LIKE '%ry' ORDER BY id
    rows:
      - [4, 'blueberry']
      - [5, 'cherry']

  # Contains: LIKE '%an%'
  - query: SELECT id, name FROM items WHERE name LIKE '%an%' ORDER BY id
    rows:
      - [3, 'banana']

  # Exact match via LIKE (no wildcards)
  - query: SELECT id FROM items WHERE name LIKE 'apple'
    rows:
      - [1]

  # Single char wildcard: LIKE 'app__'
  - query: SELECT id, name FROM items WHERE name LIKE 'app__' ORDER BY id
    rows:
      - [1, 'apple']

  # NOT LIKE
  - query: SELECT id, name FROM items WHERE name NOT LIKE 'a%' AND name IS NOT NULL ORDER BY id
    rows:
      - [3, 'banana']
      - [4, 'blueberry']
      - [5, 'cherry']

  # LIKE with NULL column → no match (UNKNOWN)
  - query: SELECT COUNT(*) FROM items WHERE name LIKE '%'
    rows:
      - [6]

  # LIKE prefix on indexed column. TRACKED PLAN-SHAPE GAP (RFC-180): Java
  # never converts LIKE to a range (RangeConstraints.java:780 `case LIKE:
  # return false`) but still accesses via an UNBOUNDED covering index scan +
  # residual LIKE + deferred FETCH (like.yamsql: COVERING | FILTER | FETCH).
  # Go lacks that covering/filter-before-fetch access path and full-scans;
  # rows are correct either way. plan_not_contains pins that no bounded
  # index RANGE is invented (would be un-Java); flip to a covering-scan
  # plan_contains when the access path lands (booked in TODO.md).
  - query: SELECT id, name FROM items WHERE name LIKE 'bl%' ORDER BY id
    plan_not_contains: "IndexScan(IDX_NAME ["
    rows:
      - [4, 'blueberry']

  # Code pattern match
  - query: SELECT id, code FROM items WHERE code LIKE 'A%' AND code IS NOT NULL ORDER BY id
    rows:
      - [1, 'A001']
      - [2, 'A002']
      - [7, 'A010']

  # LIKE with no match
  - query: SELECT COUNT(*) FROM items WHERE name LIKE 'xyz%'
    rows:
      - [0]
