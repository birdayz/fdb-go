# union_comprehensive.yaml — Comprehensive UNION tests
#
# Exercises UNION ALL with ORDER BY and multi-column legs, and pins
# that plain UNION (distinct) is rejected by both engines.
name: union_comprehensive
schema_template: |
  CREATE TABLE t1 (id BIGINT NOT NULL, name STRING, PRIMARY KEY (id))
  CREATE TABLE t2 (id BIGINT NOT NULL, name STRING, PRIMARY KEY (id))
setup:
  - INSERT INTO t1 VALUES (1, 'Alice'), (2, 'Bob'), (3, 'Charlie')
  - INSERT INTO t2 VALUES (2, 'Bob'), (3, 'Charlie'), (4, 'Dave')
tests:
  # UNION ALL — includes duplicates
  - query: >
      SELECT name FROM t1
      UNION ALL
      SELECT name FROM t2
      ORDER BY name
    rows:
      - ["Alice"]
      - ["Bob"]
      - ["Bob"]
      - ["Charlie"]
      - ["Charlie"]
      - ["Dave"]

  # Plain UNION (distinct) — rejected. Java QueryVisitor.java:349-351
  # asserts the set quantifier is ALL: UNSUPPORTED_QUERY 0AF00
  # "only UNION ALL is supported". Go's rejection is byte-identical.
  - query: >
      SELECT name FROM t1
      UNION
      SELECT name FROM t2
      ORDER BY name
    error_code: "0AF00"

  # UNION ALL with WHERE
  - query: >
      SELECT name FROM t1 WHERE id <= 2
      UNION ALL
      SELECT name FROM t2 WHERE id >= 3
      ORDER BY name
    rows:
      - ["Alice"]
      - ["Bob"]
      - ["Charlie"]
      - ["Dave"]

  # Multi-column UNION
  - query: >
      SELECT id, name FROM t1 WHERE id = 1
      UNION ALL
      SELECT id, name FROM t2 WHERE id = 4
      ORDER BY id
    rows:
      - [1, "Alice"]
      - [4, "Dave"]
