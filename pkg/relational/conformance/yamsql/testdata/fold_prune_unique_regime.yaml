# fold_prune_unique_regime.yaml — type annulments beside a UNIQUE index and in a union leg
#
# RFC-257 WS-E design 5.4(j), over the WS-E oracle's round-9 schema (T with
# the UNIQUE index T_UN on n). Each row is the oracle's measured Java 4.14.2.0
# answer (wsE9Pins): IS NULL over a NOT NULL COALESCE is FALSE and annuls its
# conjunction even beside a unique equality, and in one UNION ALL leg without
# touching the other.
name: fold_prune_unique_regime
schema_template: |
  CREATE TABLE T (id BIGINT, s STRING, n BIGINT, PRIMARY KEY (id))
  CREATE UNIQUE INDEX T_UN AS SELECT n FROM T ORDER BY n
setup:
  - INSERT INTO T VALUES (1, 'abc', NULL), (2, 'a%b', 5), (5, 'xyz', 2)
tests:
  # unique_eq_type_annulling_fold_where.
  - query: SELECT id FROM T WHERE n = 5 AND COALESCE(1 / 0, 5) IS NULL
    rows: []
  # union_leg_type_annulling_fold_where.
  - query: SELECT id FROM T WHERE id = 5 AND COALESCE(1 / 0, 5) IS NULL UNION ALL SELECT id FROM T WHERE id = 1
    rows: [[1]]
