# Development stack: Grafana 13.1 with this plugin's dist/ mounted (unsigned
# loading allowed) and a single-node FoundationDB 7.3. Build the plugin first:
# `npm run build` for the frontend and the mage build for gpx_foundationdb_*.
#
#   docker compose up --build
#   GRAFANA_VERSION=12.0.0 docker compose up --build   # oldest supported Grafana
#
# The datasource in provisioning/ reaches FDB with the cluster string
# docker:docker@fdb:4500 (a hostname coordinator, resolved on the compose network).
services:
  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    build:
      args:
        grafana_version: ${GRAFANA_VERSION:-13.1.9}
    environment:
      GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS: birdayz-foundationdb-datasource
    depends_on:
      fdb-init:
        condition: service_completed_successfully

  fdb:
    image: foundationdb/foundationdb:${FDB_VERSION:-7.3.77}
    hostname: fdb
    environment:
      FDB_NETWORKING_MODE: container
      FDB_CLUSTER_FILE_CONTENTS: docker:docker@fdb:4500
    volumes:
      - fdb-data:/var/fdb/data

  # Configures a new database on first start; on later starts it finds one available.
  fdb-init:
    image: foundationdb/foundationdb:${FDB_VERSION:-7.3.77}
    depends_on:
      - fdb
    entrypoint: ['bash', '-c']
    command:
      - |
        echo docker:docker@fdb:4500 > /tmp/fdb.cluster
        for i in $$(seq 60); do
          out=$$(fdbcli -C /tmp/fdb.cluster --exec 'status minimal' --timeout 5 2>&1)
          case "$$out" in *"is available"*) echo "$$out"; exit 0 ;; esac
          fdbcli -C /tmp/fdb.cluster --exec 'configure new single memory' --timeout 10 > /dev/null 2>&1
          sleep 1
        done
        echo "FoundationDB did not become available: $$out" >&2
        exit 1

volumes:
  fdb-data:
