# Proposed owned 4-process / 4-CPU / 16-GiB profile. Not launched.
# No internal queue-knob overrides. All state is on a NEW dedicated volume.
[fdbmonitor]
user = fdb
group = fdb

[general]
cluster-file = /var/fdb/data/cluster/fdb.cluster
restart-delay = 60
initial-restart-delay = 1

[fdbserver]
command = /usr/bin/fdbserver
public-address = 127.0.0.1:$ID
listen-address = 0.0.0.0:$ID
datadir = /var/fdb/data/processes/$ID
logdir = /var/fdb/data/traces/$ID
locality-machineid = otel283-vxnar-ingest20k
locality-zoneid = otel283-vxnar-ingest20k
memory = 4GiB
cache-memory = 64MiB
logsize = 10MiB
maxlogssize = 64MiB
trace-format = json
parentpid = $PID

[fdbserver.14883]
class = storage
cache-memory = 2GiB

[fdbserver.14884]
class = transaction

[fdbserver.14885]
class = stateless

[fdbserver.14886]
class = storage
cache-memory = 2GiB
