# Keep cmd/frl's fdb.dev pin fresh: the "we'll forget to bump it" insurance.
#
# cmd/frl is a nested Go module. `go install fdb.dev/cmd/frl@latest` runs in
# pure module mode (go.work never ships, replace directives are rejected), so
# its go.mod must pin the root library to a real version. This workflow bumps
# that pin to current master every night and maintains one rolling PR when it
# moved, verifying a GOWORK=off build first, so the pin can neither rot
# silently nor land broken.
#
# The frl release workflow builds GOWORK=off too, so even a stale pin can
# never ship a broken release; this bot just keeps staleness bounded to ~a day.
#
# Note: this PR's workflow runs are CREATED but then HELD, awaiting maintainer
# approval, and a held run does not surface as a check run — so `gh pr checks`
# prints "no checks reported" and the merge state reads UNSTABLE rather than
# blocked. Nothing has failed; nothing has run. Those are different states, and
# PR #637 was merged out of the confusion between them.
#
# The mechanism is the repository's Actions approval policy, measured:
#
#     $ gh api repos/{owner}/{repo}/actions/permissions/fork-pr-contributor-approval
#     {"approval_policy":"all_external_contributors"}
#
# github-actions[bot] is not a repository contributor, so it falls under that
# policy like any outside author. The remedy is to APPROVE the held runs (the
# "Approve and run" button on the PR's checks tab), or to change the policy.
# Closing and reopening the PR does NOT help — a re-opened PR's runs are held by
# the same policy for the same reason.
#
# An earlier version of this note blamed GITHUB_TOKEN's anti-recursion rule and
# prescribed close-and-reopen. Both were wrong, and the wrong text was believed:
# it sent a later investigation into rebuilding CI as a reusable workflow to
# solve a problem that did not exist. cmd/verify-pr-checks is the gate that now
# makes the real state — expected checks ABSENT — fail loudly instead of reading
# as green.

name: frl pin bump

on:
  schedule:
    - cron: "23 4 * * *" # nightly, offset to dodge top-of-hour load
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v5
        with:
          ref: master

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: cmd/frl/go.mod
          cache-dependency-path: cmd/frl/go.sum

      - name: Bump fdb.dev pin to master
        id: bump
        working-directory: cmd/frl
        env:
          GOWORK: "off"
        run: |
          set -euo pipefail
          before="$(go list -m -f '{{.Version}}' fdb.dev)"
          go get "fdb.dev@master"
          go mod tidy
          after="$(go list -m -f '{{.Version}}' fdb.dev)"
          echo "pin: $before -> $after"
          if git diff --quiet -- go.mod go.sum; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            {
              echo "changed=true"
              echo "before=$before"
              echo "after=$after"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the bumped module builds (what go install sees)
        if: steps.bump.outputs.changed == 'true'
        working-directory: cmd/frl
        env:
          GOWORK: "off"
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          go build -trimpath ./...
          go vet ./...

      - name: Open or update the rolling PR
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: bot/frl-pin-bump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add cmd/frl/go.mod cmd/frl/go.sum
          git commit -m "chore(frl): bump fdb.dev pin ${{ steps.bump.outputs.before }} -> ${{ steps.bump.outputs.after }}

          Nightly automated bump so \`go install fdb.dev/cmd/frl@latest\` builds
          against current master. GOWORK=off build + vet verified in CI before
          this PR was opened."
          git push -f origin "$BRANCH"
          if ! gh pr view "$BRANCH" --json state -q .state 2>/dev/null | grep -q OPEN; then
            gh pr create \
              --head "$BRANCH" \
              --title "chore(frl): bump fdb.dev pin to master" \
              --body "Automated nightly bump of the \`fdb.dev\` pin in \`cmd/frl/go.mod\` (${{ steps.bump.outputs.before }} → ${{ steps.bump.outputs.after }}) so \`go install fdb.dev/cmd/frl@latest\` tracks master.

          A \`GOWORK=off\` build and vet passed before this PR was opened/updated.

          If this PR shows no checks, they are HELD awaiting approval, not missing: the repository's
          \`all_external_contributors\` approval policy covers github-actions[bot], so its workflow runs sit at
          \`action_required\` and never surface as check runs. Approve them from the checks tab. **Do not read
          \"no checks reported\" as \"nothing failed\"** — nothing ran. Closing and reopening does not help."
          fi
