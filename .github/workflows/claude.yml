name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # One live run per issue/PR, newest wins. This job competes with the real CI gates
    # for the hetzner-fdb-vm boxes — a handful, one job each — so a pile of wedged or
    # superseded review runs still starves PR CI behind it (a 3h-wedged run + its queued
    # re-requests once held a box while CI sat queued for an hour).
    #
    # JOB-level concurrency, deliberately NOT workflow-level: the workflow
    # fires on EVERY issue_comment, and a workflow-level group is entered by
    # every run BEFORE the job's `if` filter runs — so the action's own
    # "working…" placeholder comment (claude[bot]) and any unrelated comment
    # (a codex review, a human note) spawned a run that CANCELLED the live
    # review and then skipped itself on the author allowlist below: every
    # @claude review self-cancelled ~30s in. A job-level group is entered
    # only by jobs that actually RUN (skipped jobs never join), so only a
    # genuine newer @claude trigger supersedes a live one.
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    # SECURITY: this runs on a SELF-HOSTED runner with write perms + secrets on a
    # PUBLIC repo. Only the owner, org members, and invited collaborators may trigger
    # it — never untrusted commenters (CONTRIBUTOR / FIRST_TIME_CONTRIBUTOR / NONE).
    # Each branch ANDs the '@claude' mention with an author_association allowlist so the
    # job never even STARTS for an untrusted actor (the action's own actor check runs too
    # late — the self-hosted runner has already checked out code and run steps by then).
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude') &&
        (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'COLLABORATOR')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude') &&
        (github.event.comment.author_association == 'OWNER' || github.event.comment.author_association == 'MEMBER' || github.event.comment.author_association == 'COLLABORATOR')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude') &&
        (github.event.review.author_association == 'OWNER' || github.event.review.author_association == 'MEMBER' || github.event.review.author_association == 'COLLABORATOR')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        (github.event.issue.author_association == 'OWNER' || github.event.issue.author_association == 'MEMBER' || github.event.issue.author_association == 'COLLABORATOR'))
    # GitHub-hosted, never the self-hosted fleet: the agent reads untrusted
    # issue and pull-request content, and the self-hosted boxes are persistent,
    # have sudo and write the fleet's shared Bazel cache (infra/runner-job-guard.sh
    # refuses such jobs there anyway). Nothing here needs Bazel or FDB.
    runs-on: ubuntu-latest
    # Hard wall so a wedged run can never hold a runner for hours
    # (a review normally completes in well under 15 minutes).
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Ensure bun is installed
        run: |
          mkdir -p "$HOME/.bun/bin"
          curl -fsSL "https://github.com/oven-sh/bun/releases/download/bun-v1.3.6/bun-linux-x64.zip" -o /tmp/bun.zip
          python3 -c "import zipfile; zipfile.ZipFile('/tmp/bun.zip').extractall('/tmp/bun-extract')"
          cp /tmp/bun-extract/bun-linux-x64/bun "$HOME/.bun/bin/bun"
          chmod +x "$HOME/.bun/bin/bun"
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
          rm -rf /tmp/bun.zip /tmp/bun-extract

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Give a custom prompt to Claude. If this is not specified, Claude will perform the instructions specified in the comment that tagged it.
          # prompt: 'Update the pull request description to include a summary of changes.'

          # Optional: Add claude_args to customize behavior and configuration
          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          # claude_args: '--allowed-tools Bash(gh pr:*)'

      # The action hides Claude's output on this public repo, and with it the reason a
      # run failed: an API refusal (auth, usage limit, model access) logs only as
      # "result is_error:true". Print the terminal result and API error text, never the
      # transcript; token-shaped strings are redacted (masking only covers registered
      # secrets) and lines prefixed so model text cannot issue workflow commands.
      - name: Report why Claude failed
        if: failure() && steps.claude.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: |
          python3 - <<'EOF'
          import json, os, re

          TOKEN = re.compile(r"sk-ant-[A-Za-z0-9_-]+|gh[pousr]_[A-Za-z0-9]+|github_pat_[A-Za-z0-9_]+")

          def show(label, text):
              text = TOKEN.sub("[REDACTED]", str(text))[:2000]
              print(f"{label}:")
              for line in text.splitlines() or [""]:
                  print(f"  | {line}")

          messages = json.load(open(os.environ["EXECUTION_FILE"]))
          for m in messages:
              if m.get("type") == "assistant" and m.get("error"):
                  parts = (m.get("message") or {}).get("content") or []
                  text = " ".join(p.get("text", "") for p in parts if isinstance(p, dict))
                  show(f"API error ({m['error']})", text)
          results = [m for m in messages if m.get("type") == "result"]
          if not results:
              show("No result message", f"{len(messages)} messages recorded")
          for r in results:
              show(f"Result (subtype={r.get('subtype')}, is_error={r.get('is_error')})",
                   r.get("result") or r.get("errors") or "<empty>")
          EOF

