name: Nightly Fuzz

# Lighter nightly tuned for ONE self-hosted runner (the 5 jobs serialize on it).
# The full-depth variant (17×6m diff-fuzz + every client/engine target × 4m)
# monopolised the single runner for ~8h and starved the other nightlies, so it
# was disabled. This version keeps NIGHTLY cadence but bounds total runtime to
# ~2-3h by:
#   - replaying every seed corpus deterministically EVERY night (regression net),
#   - actively fuzzing only a ROTATING 1/3 of targets per night (date-based, so
#     every target is covered across 3 nights), at shorter fuzztimes.
# Rotation offset = day-of-year mod 3; a target at discovery-index i runs when
# (i % 3) == offset.
on:
  schedule:
    # 4:17 AM UTC daily (off-minute to avoid GitHub's top-of-hour scheduler
    # congestion, which is the worst source of scheduled-run dispatch delay).
    - cron: '17 4 * * *'
  workflow_dispatch: # manual trigger

jobs:
  diff-fuzz:
    name: Differential Serialization Fuzzer
    runs-on: hetzner-fdb
    timeout-minutes: 45

    steps:
      - name: Check nightly window
        # A `schedule` trigger fires the WORKFLOW, but GitHub dispatches the
        # actual JOB whenever hetzner-fdb (our single self-hosted slot) is
        # free — a backlog (regular PR CI, or another nightly still running)
        # can delay that by hours, landing this job in the middle of the
        # workday. The check MUST run here, as the first step on the
        # runner that was actually allocated, not in a separate gate job
        # before the queue: a pre-queue check passes at dispatch time and is
        # stale by the time this runner is finally free hours later (codex,
        # PR #445 round 1 — the first version of this gate had exactly that
        # bug). `workflow_dispatch` (manual "run it now") always proceeds.
        id: window
        run: |
          # Anchor the fuzz-budget model to JOB start: timeout-minutes is measured
          # from here, not from the fuzz step, and the preamble (checkout, C++ oracle
          # build, bazel builds) can eat an unpredictable slice of it.
          echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HOUR=$(date -u +%-H)
          # 00:00-07:00 UTC: generous margin past the 04:17 cron plus this
          # workflow's longest job timeout (75m for engine-fuzz).
          if [ "$HOUR" -ge 0 ] && [ "$HOUR" -lt 7 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::this runner became available at ${HOUR}:00 UTC, outside the 00:00-07:00 nightly window (the self-hosted queue delayed dispatch) — skipping the rest of this job to protect daytime CI capacity; it fires again at tomorrow's scheduled time."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.window.outputs.ok == 'true'
        uses: actions/checkout@v5

      - name: Build C++ oracle
        if: steps.window.outputs.ok == 'true'
        run: bazelisk build //cmd/fdb-diff-oracle:diff_oracle_bin

      - name: Build Go fuzz test
        if: steps.window.outputs.ok == 'true'
        run: bazelisk build //cmd/fdb-diff-oracle:fdb-diff-oracle_test

      - name: Build fuzzrun (fuzz failure classifier)
        if: steps.window.outputs.ok == 'true'
        run: bazelisk build //cmd/fuzzrun

      - name: Resolve Bazel Go SDK
        if: steps.window.outputs.ok == 'true'
        id: go-sdk
        run: |
          OUTPUT_BASE=$(bazelisk info output_base 2>/dev/null)
          GO_BIN=$(ls "$OUTPUT_BASE"/external/rules_go++go_sdk+*download*/bin/go 2>/dev/null | head -1)
          if [ -z "$GO_BIN" ]; then
            echo "Bazel Go SDK not materialized (cold slot) — fetching it via bazel"
            bazelisk run @rules_go//go -- version >/dev/null 2>&1 || true
            GO_BIN=$(ls "$OUTPUT_BASE"/external/rules_go++go_sdk+*download*/bin/go 2>/dev/null | head -1)
          fi
          if [ -z "$GO_BIN" ]; then
            echo "Bazel Go SDK not found — trying system go"
            GO_BIN=go
          fi
          echo "go-bin=$GO_BIN" >> "$GITHUB_OUTPUT"
          echo "Using Go: $GO_BIN ($($GO_BIN version))"

      - name: Run deterministic tests (TestDiff + ALL fuzz seed corpora)
        if: steps.window.outputs.ok == 'true'
        # Runs EVERY night, full set — this is the regression net (replays every
        # known crasher / ground-truth seed). `^Fuzz` is load-bearing: -run=TestDiff
        # alone does NOT replay the Fuzz* seed corpora (same fix as per-PR ci.yml
        # wire-oracle). The active rotation below adds new-input discovery on top.
        run: |
          ORACLE=$(realpath bazel-bin/cmd/fdb-diff-oracle/diff-oracle)
          DIFF_ORACLE_BIN="$ORACLE" ${{ steps.go-sdk.outputs.go-bin }} test -run='TestDiff|^Fuzz' -v -count=1 ./cmd/fdb-diff-oracle/

      - name: Actively fuzz a rotating 1/3 of oracle types (2min each)
        if: steps.window.outputs.ok == 'true'
        # RFC-107: discover EVERY Fuzz* rather than a hard-coded list. Then fuzz only
        # a rotating third per night (date-based) at 2min each — ~6 targets × 2min ≈
        # 12min, vs the old 17 × 6m ≈ 1h45m. Over 3 nights every target gets an
        # active pass; the deterministic replay above runs the full set every night.
        # Fail on an empty discovery (no-op guard).
        run: |
          ORACLE=$(realpath bazel-bin/cmd/fdb-diff-oracle/diff-oracle)
          GO_BIN="${{ steps.go-sdk.outputs.go-bin }}"
          FUZZRUN=$(realpath "$(bazelisk cquery --output=files //cmd/fuzzrun 2>/dev/null | tail -1)")
          TARGETS=$(grep -rhoP '^func \KFuzz\w+' cmd/fdb-diff-oracle/*_test.go | sort -u)
          if [ -z "$TARGETS" ]; then
            echo "::error::no Fuzz targets discovered in cmd/fdb-diff-oracle — fuzz gate is a no-op"
            exit 1
          fi
          ROTATE=$(( 10#$(date -u +%j) % 3 ))
          echo "Discovered $(echo "$TARGETS" | wc -l) oracle fuzz targets; active rotation offset=$ROTATE (of 3)"
          # Select first so TOTAL is known: the retry cutoff below has to reserve a
          # first run for every target still queued, which needs the count up front.
          SELECTED=""
          i=0
          for target in $TARGETS; do
            if [ $(( i % 3 )) -eq "$ROTATE" ]; then SELECTED="$SELECTED $target"; fi
            i=$((i+1))
          done
          TOTAL=$(echo $SELECTED | wc -w)
          # Budget model. PER_TARGET seeds an estimate of one attempt (the `timeout 150`
          # cap plus process overhead); once the loop is running it is replaced by the
          # OBSERVED average, so a slow target corrects the schedule instead of
          # silently blowing it. STEP_END is anchored to JOB_START (see the window
          # step) minus a margin, because timeout-minutes (45) runs from job start and
          # the C++ oracle build ahead of this step can be slow on a cold cache.
          PER_TARGET=170
          STEP_END=$(( JOB_START + 40*60 ))
          FAILED=0
          RAN=0
          RACELOG=$(mktemp)
          LOOP_START=$(date +%s)
          BUDGET=$(( STEP_END - LOOP_START ))
          # Guard the MANDATORY floor: the reservation below protects retries, but
          # nothing protects one run of every target. TOTAL is discovered, so adding
          # fuzz targets silently walks this into the timeout — fail loud instead.
          if [ $(( TOTAL * PER_TARGET )) -ge "$BUDGET" ]; then
            echo "::error::rotation no longer fits its budget: $TOTAL targets x ~${PER_TARGET}s = $(( TOTAL * PER_TARGET / 60 ))min vs $(( BUDGET / 60 ))min left of timeout-minutes. Shrink the rotation, cut -fuzztime, or raise timeout-minutes; otherwise the job is killed before it reports."
            FAILED=1
          elif [ $(( (TOTAL + 1) * PER_TARGET )) -ge "$BUDGET" ]; then
            echo "::warning::budget leaves no room for a confirming retry; deadline-race runs will be accepted on classification alone. This is the silent-disable case — if it persists, the rotation has outgrown timeout-minutes."
          fi
          for target in $SELECTED; do
            # Incremented BEFORE the reservation on purpose: it counts THIS target as
            # still owed. Moving it below shifts the reservation by a whole target.
            RAN=$((RAN+1))
            # Observed pace, used ONLY to throttle retries. It counts a retried target
            # as one unit, so it over-estimates a single attempt — deliberately: erring
            # high declines retries (safe), and it must never feed a pass/fail decision,
            # which is why there is no "we will overrun" error built on it. A genuine
            # overrun still surfaces as the job hitting timeout-minutes, loudly.
            if [ "$RAN" -gt 1 ]; then
              AVG=$(( ($(date +%s) - LOOP_START) / (RAN - 1) ))
              [ "$AVG" -gt "$PER_TARGET" ] && PER_TARGET=$AVG
            fi
            # Allow a confirming retry only if this retry AND one run of every target
            # still queued both still fit. Without the reservation term a systematic
            # race doubles the early targets and the job is killed part-way through the
            # rest — losing the -summarize diagnosis in the one case it exists for.
            RETRY_DEADLINE=$(( STEP_END - (TOTAL - RAN + 1) * PER_TARGET ))
            echo "=== $target (2m) ==="
            "$FUZZRUN" -label "$target" -deadline "$RETRY_DEADLINE" -racelog "$RACELOG" -- \
              timeout 150 env DIFF_ORACLE_BIN="$ORACLE" "$GO_BIN" test \
                -run='^$' -fuzz="^${target}\$" -fuzztime=2m ./cmd/fdb-diff-oracle/ || FAILED=1
            echo ""
          done
          "$FUZZRUN" -summarize "$RACELOG" -total "$RAN" || FAILED=1
          exit $FAILED

      - name: Upload failing fuzz seeds
        if: steps.window.outputs.ok == 'true' && failure()
        uses: actions/upload-artifact@v7
        with:
          name: diff-oracle-fuzz-seeds
          path: cmd/fdb-diff-oracle/testdata/fuzz/**
          retention-days: 30
          if-no-files-found: ignore

  race-detector:
    name: Race Detector
    runs-on: hetzner-fdb
    timeout-minutes: 30

    steps:
      - name: Check nightly window
        # See diff-fuzz's "Check nightly window" step above for the full
        # rationale (must run on the allocated runner, not a pre-queue gate).
        id: window
        run: |
          # Anchor the fuzz-budget model to JOB start: timeout-minutes is measured
          # from here, not from the fuzz step, and the preamble (checkout, C++ oracle
          # build, bazel builds) can eat an unpredictable slice of it.
          echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HOUR=$(date -u +%-H)
          if [ "$HOUR" -ge 0 ] && [ "$HOUR" -lt 7 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::this runner became available at ${HOUR}:00 UTC, outside the 00:00-07:00 nightly window (the self-hosted queue delayed dispatch) — skipping the rest of this job to protect daytime CI capacity; it fires again at tomorrow's scheduled time."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.window.outputs.ok == 'true'
        uses: actions/checkout@v5

      - name: Check Docker (else the race gate silently no-ops)
        if: steps.window.outputs.ok == 'true'
        run: |
          docker info >/dev/null 2>&1 || { echo "::error::Docker unavailable — race tests would skip (exit 0) and the gate would silently pass"; exit 1; }

      - name: Run tests with race detector
        if: steps.window.outputs.ok == 'true'
        run: >
          bazelisk test
          //pkg/fdbgo/client:client_test
          //pkg/recordlayer:recordlayer_test
          //pkg/fdbgo/fdb:fdb_test
          //pkg/recordlayer/chaos:chaos_test
          //conformance:conformance_test
          --@rules_go//go/config:race
          --test_timeout=900
          --test_summary=detailed

  binding-stress:
    name: Binding Tester Stress (50 seeds)
    runs-on: hetzner-fdb
    timeout-minutes: 60

    steps:
      - name: Check nightly window
        # See diff-fuzz's "Check nightly window" step above for the full
        # rationale (must run on the allocated runner, not a pre-queue gate).
        id: window
        run: |
          # Anchor the fuzz-budget model to JOB start: timeout-minutes is measured
          # from here, not from the fuzz step, and the preamble (checkout, C++ oracle
          # build, bazel builds) can eat an unpredictable slice of it.
          echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HOUR=$(date -u +%-H)
          if [ "$HOUR" -ge 0 ] && [ "$HOUR" -lt 7 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::this runner became available at ${HOUR}:00 UTC, outside the 00:00-07:00 nightly window (the self-hosted queue delayed dispatch) — skipping the rest of this job to protect daytime CI capacity; it fires again at tomorrow's scheduled time."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.window.outputs.ok == 'true'
        uses: actions/checkout@v5

      - name: Check Docker (else binding stress silently no-ops)
        if: steps.window.outputs.ok == 'true'
        run: |
          docker info >/dev/null 2>&1 || { echo "::error::Docker unavailable — binding stress would skip and the gate would silently pass"; exit 1; }

      - name: Build
        if: steps.window.outputs.ok == 'true'
        run: bazelisk build //cmd/fdb-binding-stress:fdb-binding-stress //cmd/fdb-stacktester:fdb-stacktester

      - name: Run API binding stress (50 seeds × 1000 ops)
        if: steps.window.outputs.ok == 'true'
        run: bazelisk run //cmd/fdb-binding-stress -- -seeds 50 -ops 1000

      - name: Run directory binding stress (30 seeds × 500 ops)
        if: steps.window.outputs.ok == 'true'
        run: bazelisk run //cmd/fdb-binding-stress -- -seeds 30 -ops 500 -test-name directory

  client-fuzz:
    name: Pure-Go Client Fuzz (//pkg/fdbgo)
    runs-on: hetzner-fdb
    timeout-minutes: 60

    steps:
      - name: Check nightly window
        # See diff-fuzz's "Check nightly window" step above for the full
        # rationale (must run on the allocated runner, not a pre-queue gate).
        id: window
        run: |
          # Anchor the fuzz-budget model to JOB start: timeout-minutes is measured
          # from here, not from the fuzz step, and the preamble (checkout, C++ oracle
          # build, bazel builds) can eat an unpredictable slice of it.
          echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HOUR=$(date -u +%-H)
          if [ "$HOUR" -ge 0 ] && [ "$HOUR" -lt 7 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::this runner became available at ${HOUR}:00 UTC, outside the 00:00-07:00 nightly window (the self-hosted queue delayed dispatch) — skipping the rest of this job to protect daytime CI capacity; it fires again at tomorrow's scheduled time."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.window.outputs.ok == 'true'
        uses: actions/checkout@v5

      - name: Check Docker + libfdb_c (mandatory for client/bench fuzz)
        if: steps.window.outputs.ok == 'true'
        # RFC-107: pkg/fdbgo/client TestMain and pkg/fdbgo/bench always start an FDB
        # testcontainer (bench also exercises the cgo libfdb_c binding), so Docker is a
        # hard prerequisite — fail loudly rather than skip silently.
        run: |
          docker info >/dev/null 2>&1 || { echo "::error::Docker not available — client/bench fuzz cannot run"; exit 1; }

      - name: Fuzz a rotating 1/3 of //pkg/fdbgo Fuzz targets (Bazel-native, 90s each)
        if: steps.window.outputs.ok == 'true'
        # Bazel-native (NOT plain `go test -fuzz`) so the run is faithful to the
        # MODULE.bazel go_deps.module_override that patches the Apple FDB Go binding.
        # Targets are DISCOVERED, not hard-listed; an empty discovery fails the job
        # (no-op guard, RFC-107). Only a rotating third runs actively each night
        # (date-based offset); over 3 nights every target is covered. Seed corpora
        # for the non-selected targets are still replayed by the per-PR/CI gates.
        run: |
          mkdir -p /tmp/fuzz-cache
          bazelisk build //cmd/fuzzrun
          FUZZRUN=$(realpath "$(bazelisk cquery --output=files //cmd/fuzzrun 2>/dev/null | tail -1)")
          VALID=$(bazelisk query 'kind(go_test, //pkg/fdbgo/...)' 2>/dev/null)
          PAIRS=""
          for f in $(grep -rl '^func Fuzz' pkg/fdbgo/ --include='*_test.go'); do
            dir=$(dirname "$f")
            target="//$dir:$(basename "$dir")_test"
            echo "$VALID" | grep -qxF "$target" || {
              echo "::error::derived target $target (from $f) is not a real go_test — gazelle naming changed"
              exit 1
            }
            for fn in $(grep -oP '^func \KFuzz\w+' "$f"); do
              PAIRS="$PAIRS ${target}|${fn}"
            done
          done
          if [ -z "$PAIRS" ]; then
            echo "::error::no //pkg/fdbgo Fuzz targets discovered — client fuzz gate is a no-op"
            exit 1
          fi
          ROTATE=$(( 10#$(date -u +%j) % 3 ))
          echo "Discovered $(echo $PAIRS | wc -w) (target,func) pairs; active rotation offset=$ROTATE (of 3)"
          # Select first so TOTAL is known: the retry cutoff below has to reserve a
          # first run for every pair still queued, which needs the count up front.
          SELECTED=""
          i=0
          for pair in $PAIRS; do
            if [ $(( i % 3 )) -eq "$ROTATE" ]; then SELECTED="$SELECTED $pair"; fi
            i=$((i+1))
          done
          TOTAL=$(echo $SELECTED | wc -w)
          # Budget model. PER_TARGET seeds an estimate of one attempt (the 90s budget
          # plus bazel's per-test overhead); once the loop is running it is replaced by
          # the OBSERVED average, so a slow target — several of these packages start an
          # FDB testcontainer — corrects the schedule instead of silently blowing it.
          # STEP_END is anchored to JOB_START (see the window step) because
          # timeout-minutes (60) runs from job start, not from this step.
          PER_TARGET=110
          STEP_END=$(( JOB_START + 54*60 ))
          FAILED=0
          RAN=0
          RACELOG=$(mktemp)
          LOOP_START=$(date +%s)
          BUDGET=$(( STEP_END - LOOP_START ))
          # Guard the MANDATORY floor: the reservation below protects retries, but
          # nothing protects one run of every pair. TOTAL is discovered, so adding
          # fuzz targets silently walks this into the timeout — fail loud instead.
          if [ $(( TOTAL * PER_TARGET )) -ge "$BUDGET" ]; then
            echo "::error::rotation no longer fits its budget: $TOTAL pairs x ~${PER_TARGET}s = $(( TOTAL * PER_TARGET / 60 ))min vs $(( BUDGET / 60 ))min left of timeout-minutes. Shrink the rotation, cut -fuzztime, or raise timeout-minutes; otherwise the job is killed before it reports."
            FAILED=1
          elif [ $(( (TOTAL + 1) * PER_TARGET )) -ge "$BUDGET" ]; then
            echo "::warning::budget leaves no room for a confirming retry; deadline-race runs will be accepted on classification alone. This is the silent-disable case — if it persists, the rotation has outgrown timeout-minutes."
          fi
          for pair in $SELECTED; do
            # Incremented BEFORE the reservation on purpose: it counts THIS pair as
            # still owed. Moving it below shifts the reservation by a whole target.
            RAN=$((RAN+1))
            # Observed pace, used ONLY to throttle retries. It counts a retried target
            # as one unit, so it over-estimates a single attempt — deliberately: erring
            # high declines retries (safe), and it must never feed a pass/fail decision,
            # which is why there is no "we will overrun" error built on it. A genuine
            # overrun still surfaces as the job hitting timeout-minutes, loudly.
            if [ "$RAN" -gt 1 ]; then
              AVG=$(( ($(date +%s) - LOOP_START) / (RAN - 1) ))
              [ "$AVG" -gt "$PER_TARGET" ] && PER_TARGET=$AVG
            fi
            target="${pair%|*}"; fn="${pair#*|}"
            # Allow a confirming retry only if this retry AND one run of every pair
            # still queued both still fit. Without the reservation term a systematic
            # race doubles the early pairs and the job is killed part-way through the
            # rest — losing the -summarize diagnosis in the one case it exists for.
            RETRY_DEADLINE=$(( STEP_END - (TOTAL - RAN + 1) * PER_TARGET ))
            echo "=== $target $fn (90s) ==="
            "$FUZZRUN" -label "$target $fn" -deadline "$RETRY_DEADLINE" -racelog "$RACELOG" -- \
              bazelisk test "$target" \
                --test_arg=-test.run='^$' --test_arg=-test.fuzz="^${fn}\$" \
                --test_arg=-test.fuzztime=90s --test_arg=-test.fuzzcachedir=/tmp/fuzz-cache \
                --sandbox_writable_path=/tmp/fuzz-cache \
                --test_timeout=300 --nocache_test_results --test_output=errors || FAILED=1
          done
          "$FUZZRUN" -summarize "$RACELOG" -total "$RAN" || FAILED=1
          exit $FAILED

      - name: Upload failing fuzz logs + cache
        if: steps.window.outputs.ok == 'true' && failure()
        uses: actions/upload-artifact@v7
        with:
          name: client-fuzz-failure
          path: |
            bazel-testlogs/pkg/fdbgo/**/test.log
            /tmp/fuzz-cache/**
          retention-days: 30
          if-no-files-found: ignore

  engine-fuzz:
    name: SQL Engine + Record Layer Fuzz (//pkg/relational + //pkg/recordlayer + //pkg/rabitq)
    runs-on: hetzner-fdb
    timeout-minutes: 75

    steps:
      - name: Check nightly window
        # See diff-fuzz's "Check nightly window" step above for the full
        # rationale (must run on the allocated runner, not a pre-queue gate).
        id: window
        run: |
          # Anchor the fuzz-budget model to JOB start: timeout-minutes is measured
          # from here, not from the fuzz step, and the preamble (checkout, C++ oracle
          # build, bazel builds) can eat an unpredictable slice of it.
          echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HOUR=$(date -u +%-H)
          if [ "$HOUR" -ge 0 ] && [ "$HOUR" -lt 7 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::this runner became available at ${HOUR}:00 UTC, outside the 00:00-07:00 nightly window (the self-hosted queue delayed dispatch) — skipping the rest of this job to protect daytime CI capacity; it fires again at tomorrow's scheduled time."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.window.outputs.ok == 'true'
        uses: actions/checkout@v5

      - name: Check Docker (a few targets — e.g. FuzzSQL_QueryContext — need a live FDB)
        if: steps.window.outputs.ok == 'true'
        run: |
          docker info >/dev/null 2>&1 || { echo "::error::Docker not available — engine fuzz cannot run the e2e targets"; exit 1; }

      - name: Fuzz a rotating 1/3 of //pkg/relational + //pkg/recordlayer targets (Bazel-native, 90s each)
        if: steps.window.outputs.ok == 'true'
        # The ~95 SQL-engine + record-layer Fuzz targets (planner suite, value/predicate
        # simplification, continuations, proto/record deserialization, SQL front-end +
        # e2e). Rotating a third per night (~32 targets × 90s ≈ 48min) keeps this inside
        # the single-runner budget while covering the full set across 3 nights; the seed
        # corpora are still replayed by the per-PR/CI gates every change. Targets are
        # DISCOVERED, not hard-listed; an empty discovery fails the job (no-op guard).
        run: |
          mkdir -p /tmp/fuzz-cache
          bazelisk build //cmd/fuzzrun
          FUZZRUN=$(realpath "$(bazelisk cquery --output=files //cmd/fuzzrun 2>/dev/null | tail -1)")
          VALID=$(bazelisk query 'kind(go_test, //pkg/relational/... + //pkg/recordlayer/... + //pkg/rabitq/...)' 2>/dev/null)
          PAIRS=""
          for f in $(grep -rl '^func Fuzz' pkg/relational pkg/recordlayer pkg/rabitq --include='*_test.go'); do
            dir=$(dirname "$f")
            target="//$dir:$(basename "$dir")_test"
            echo "$VALID" | grep -qxF "$target" || {
              echo "::error::derived target $target (from $f) is not a real go_test — gazelle naming changed"
              exit 1
            }
            for fn in $(grep -oP '^func \KFuzz\w+' "$f"); do
              PAIRS="$PAIRS ${target}|${fn}"
            done
          done
          if [ -z "$PAIRS" ]; then
            echo "::error::no //pkg/relational or //pkg/recordlayer Fuzz targets discovered — engine fuzz gate is a no-op"
            exit 1
          fi
          ROTATE=$(( 10#$(date -u +%j) % 3 ))
          echo "Discovered $(echo $PAIRS | wc -w) (target,func) pairs; active rotation offset=$ROTATE (of 3)"
          # Select first so TOTAL is known: the retry cutoff below has to reserve a
          # first run for every pair still queued, which needs the count up front.
          SELECTED=""
          i=0
          for pair in $PAIRS; do
            if [ $(( i % 3 )) -eq "$ROTATE" ]; then SELECTED="$SELECTED $pair"; fi
            i=$((i+1))
          done
          TOTAL=$(echo $SELECTED | wc -w)
          # Budget model. PER_TARGET seeds an estimate of one attempt (the 90s budget
          # plus bazel's per-test overhead); once the loop is running it is replaced by
          # the OBSERVED average, so a slow target — several of these packages start an
          # FDB testcontainer — corrects the schedule instead of silently blowing it.
          # STEP_END is anchored to JOB_START (see the window step) because
          # timeout-minutes (75) runs from job start, not from this step.
          # This is the TIGHT job: ~33 pairs is already ~60min of mandatory work,
          # so the guard below is the one most likely to fire as targets are added.
          PER_TARGET=110
          STEP_END=$(( JOB_START + 68*60 ))
          FAILED=0
          RAN=0
          RACELOG=$(mktemp)
          LOOP_START=$(date +%s)
          BUDGET=$(( STEP_END - LOOP_START ))
          # Guard the MANDATORY floor: the reservation below protects retries, but
          # nothing protects one run of every pair. TOTAL is discovered, so adding
          # fuzz targets silently walks this into the timeout — fail loud instead.
          if [ $(( TOTAL * PER_TARGET )) -ge "$BUDGET" ]; then
            echo "::error::rotation no longer fits its budget: $TOTAL pairs x ~${PER_TARGET}s = $(( TOTAL * PER_TARGET / 60 ))min vs $(( BUDGET / 60 ))min left of timeout-minutes. Shrink the rotation, cut -fuzztime, or raise timeout-minutes; otherwise the job is killed before it reports."
            FAILED=1
          elif [ $(( (TOTAL + 1) * PER_TARGET )) -ge "$BUDGET" ]; then
            echo "::warning::budget leaves no room for a confirming retry; deadline-race runs will be accepted on classification alone. This is the silent-disable case — if it persists, the rotation has outgrown timeout-minutes."
          fi
          for pair in $SELECTED; do
            # Incremented BEFORE the reservation on purpose: it counts THIS pair as
            # still owed. Moving it below shifts the reservation by a whole target.
            RAN=$((RAN+1))
            # Observed pace, used ONLY to throttle retries. It counts a retried target
            # as one unit, so it over-estimates a single attempt — deliberately: erring
            # high declines retries (safe), and it must never feed a pass/fail decision,
            # which is why there is no "we will overrun" error built on it. A genuine
            # overrun still surfaces as the job hitting timeout-minutes, loudly.
            if [ "$RAN" -gt 1 ]; then
              AVG=$(( ($(date +%s) - LOOP_START) / (RAN - 1) ))
              [ "$AVG" -gt "$PER_TARGET" ] && PER_TARGET=$AVG
            fi
            target="${pair%|*}"; fn="${pair#*|}"
            # Allow a confirming retry only if this retry AND one run of every pair
            # still queued both still fit. Without the reservation term a systematic
            # race doubles the early pairs and the job is killed part-way through the
            # rest — losing the -summarize diagnosis in the one case it exists for.
            RETRY_DEADLINE=$(( STEP_END - (TOTAL - RAN + 1) * PER_TARGET ))
            echo "=== $target $fn (90s) ==="
            "$FUZZRUN" -label "$target $fn" -deadline "$RETRY_DEADLINE" -racelog "$RACELOG" -- \
              bazelisk test "$target" \
                --test_arg=-test.run='^$' --test_arg=-test.fuzz="^${fn}\$" \
                --test_arg=-test.fuzztime=90s --test_arg=-test.fuzzcachedir=/tmp/fuzz-cache \
                --sandbox_writable_path=/tmp/fuzz-cache \
                --test_timeout=300 --nocache_test_results --test_output=errors || FAILED=1
          done
          "$FUZZRUN" -summarize "$RACELOG" -total "$RAN" || FAILED=1
          exit $FAILED

      - name: Upload failing fuzz logs + cache (crash corpus)
        if: steps.window.outputs.ok == 'true' && failure()
        uses: actions/upload-artifact@v7
        with:
          name: engine-fuzz-failure
          path: |
            bazel-testlogs/pkg/relational/**/test.log
            bazel-testlogs/pkg/recordlayer/**/test.log
            bazel-testlogs/pkg/rabitq/**/test.log
            /tmp/fuzz-cache/**
          retention-days: 30
          if-no-files-found: ignore
