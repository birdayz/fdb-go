name: Nightly Factory

# RFC-201 §5's generation factory. Two jobs with different purposes, and the
# distinction matters:
#
#   * `corpus` RE-RUNS the tests the factory already committed. It is the
#     regression net — the reason RFC-201 commits generated tests instead of
#     regenerating them. It must pass, and a failure is an engine change that
#     moved a frozen expectation.
#   * `batch` GENERATES new ones. It is the growth lane, and it opens a PR
#     rather than pushing: a batch is reviewable content, and §5.2's per-run
#     quota exists so that review is possible.
#
# The growth lane's branch is ROLLING (`factory/batch`), not date-stamped. A
# date-stamped branch mints a new PR every night and abandons the previous one
# the instant anything touches the corpus, because the census baseline conflicts
# on every corpus merge — so the abandoned PR is permanently unmergeable and
# nothing in the system ever revisits it. That accumulates one dead PR per
# corpus-touching merge, each carrying a full night of generated coverage into
# the ground. Rolling instead: tonight's batch is generated ON TOP of the
# pending one, so review latency delays a merge rather than destroying content.
#
# Closing the stale PR instead was the obvious alternative and it loses: a
# closed batch still discards its scenarios, which is exactly what §5.2's quota
# exists to protect, and it would do so on every night that review lags by one
# day. Turning a review-latency problem into permanent coverage loss is the
# wrong direction; the reviewable UNIT survives accumulation anyway, because the
# rolling branch keeps one commit and one manifest comment per run.
#
# The FULL corpus also runs in every `just test` and every PR CI run (owner
# ruling 2026-08-01: the committed corpus is ordinary suite content). The
# `corpus` job here is therefore redundant as coverage, but it is KEPT: it is
# the scheduled master-branch net, and its genuine-run heartbeat is what
# nightly-reconcile.yml checks — removing the job would turn the reconciler
# red with nothing broken.

on:
  schedule:
    # 02:41 UTC — an off-minute between the rowdiff sweep (00:17) and the
    # stress job (04:23). See nightly-rowdiff.yml for why the runner-side
    # window check below is load-bearing rather than belt-and-braces: GitHub
    # dispatches the JOB when a self-hosted box frees up, which a
    # backlog delays by hours.
    - cron: '41 2 * * *'
  workflow_dispatch:
    inputs:
      seeds:
        description: 'Seed count for the batch (default 4000)'
        required: false
        default: '4000'
      quota:
        description: 'Maximum scenarios committed by the batch (default 1000)'
        required: false
        default: '1000'
      seed_start:
        description: 'First seed (default: rotated by day-of-year)'
        required: false

jobs:
  corpus:
    name: Full committed corpus (the regression net)
    runs-on: hetzner-fdb-vm
    timeout-minutes: 180
    steps:
      - name: Check nightly window
        # A `schedule` trigger fires the WORKFLOW, but GitHub dispatches the
        # JOB whenever a hetzner-fdb-vm box frees up,
        # which a backlog delays by hours — landing a multi-hour run in the
        # middle of the workday. The check MUST run here, as the first step on
        # the runner actually allocated: a pre-queue gate passes at dispatch
        # time and is stale by the time this runner is free. See
        # nightly-rowdiff.yml for the measured dispatch delays that set the
        # window's width. `workflow_dispatch` always proceeds.
        id: window
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The permitted band, declared as two explicit hours so it is
          # machine-readable: pkg/docscheck's TestNightlyWindowAdmitsMeasuredLandings
          # parses these and replays every allocation hour this net has been given.
          # WINDOW_START > WINDOW_END means the band WRAPS midnight.
          #
          # This job landed with an inlined `-ge 0 -lt 10` bound, written before the
          # wrapping band existed. That bound is the one measured to discard evening
          # landings as "daytime" and to throw away a 10:22 allocation for being 22
          # minutes late. It is the same defect on a brand-new net, which is how a
          # freshly-built safety net inherits the fake-green shape the older ones
          # were just cured of.
          WINDOW_START=18
          WINDOW_END=12
          HOUR=$(date -u +%-H)
          if [ "$WINDOW_START" -lt "$WINDOW_END" ]; then
            if [ "$HOUR" -ge "$WINDOW_START" ] && [ "$HOUR" -lt "$WINDOW_END" ]; then IN=1; else IN=0; fi
          else
            if [ "$HOUR" -ge "$WINDOW_START" ] || [ "$HOUR" -lt "$WINDOW_END" ]; then IN=1; else IN=0; fi
          fi
          if [ "$IN" -eq 1 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::this runner became available at ${HOUR}:00 UTC, outside the ${WINDOW_START}:00-${WINDOW_END}:00 window (the self-hosted queue delayed dispatch) — skipping the rest of this job to protect the workday CI slot; it fires again at tomorrow's scheduled time. No heartbeat is recorded, so nightly-reconcile.yml will fail if this repeats."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.window.outputs.ok == 'true'
        uses: actions/checkout@v5

      - name: Check Docker (mandatory — else the gate silently no-ops)
        if: steps.window.outputs.ok == 'true'
        # The corpus target takes the allowed `FDB not available (no Docker)`
        # skip when there is no container, so without Docker this job reports
        # SUCCESS having executed ZERO scenarios. Fail loudly here instead.
        run: |
          docker info >/dev/null 2>&1 || { echo "::error::Docker unavailable — the factory corpus would skip (exit 0) and the gate would pass with no coverage"; exit 1; }

      - name: Run the full committed corpus
        if: steps.window.outputs.ok == 'true'
        id: corpus
        # The same target every `just test` runs; named explicitly and
        # uncached because this job's product is the scheduled master-branch
        # heartbeat, not incremental coverage.
        run: |
          set -o pipefail
          bazelisk test //pkg/relational/conformance/factorycorpus/full:full_test \
            --test_timeout=3600 --test_output=streamed --nocache_test_results 2>&1 | tee corpus.log

      - name: Record genuine-run heartbeat
        # A windowed job that skips is indistinguishable from one that ran and
        # passed — which is how ten consecutive rowdiff nights went green having
        # compared zero rows. This file is written ONLY when the corpus actually
        # executed. The condition deliberately does NOT require success: a red
        # corpus is the net WORKING. The heartbeat answers "did it run", the job
        # conclusion answers "did it pass".
        if: ${{ steps.window.outputs.ok == 'true' && !cancelled() && steps.corpus.outcome != 'skipped' }}
        run: |
          {
            echo "net=factory-corpus"
            echo "ran_at=$(date -u +%FT%TZ)"
            echo "run_id=${{ github.run_id }}"
            echo "sha=${{ github.sha }}"
            echo "corpus_outcome=${{ steps.corpus.outcome }}"
          } | tee nightly-heartbeat.txt

      - name: Upload genuine-run heartbeat
        if: ${{ steps.window.outputs.ok == 'true' && !cancelled() && steps.corpus.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        # if-no-files-found: error, NOT ignore — a heartbeat that silently fails
        # to upload reproduces the very silence this mechanism exists to break.
        with:
          name: nightly-heartbeat-factory-corpus
          path: nightly-heartbeat.txt
          retention-days: 90
          if-no-files-found: error

  batch:
    name: Generate a batch (the growth lane)
    runs-on: hetzner-fdb-vm
    timeout-minutes: 300
    needs: corpus
    steps:
      - name: Check nightly window
        # Its own gate, not inherited from `corpus`. `needs:` only orders the
        # jobs — a corpus job that SKIPS its work still succeeds, so without
        # this the batch would run alone at 2pm and take the shared runner for
        # hours.
        id: window
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Same wrapping band as the corpus job above and as every other
          # hetzner-fdb-vm net — the allocation hour is a property of the single
          # shared runner queue, not of what the job does once it has it.
          WINDOW_START=18
          WINDOW_END=12
          HOUR=$(date -u +%-H)
          if [ "$WINDOW_START" -lt "$WINDOW_END" ]; then
            if [ "$HOUR" -ge "$WINDOW_START" ] && [ "$HOUR" -lt "$WINDOW_END" ]; then IN=1; else IN=0; fi
          else
            if [ "$HOUR" -ge "$WINDOW_START" ] || [ "$HOUR" -lt "$WINDOW_END" ]; then IN=1; else IN=0; fi
          fi
          if [ "$IN" -eq 1 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::this runner became available at ${HOUR}:00 UTC, outside the ${WINDOW_START}:00-${WINDOW_END}:00 window (the self-hosted queue delayed dispatch) — skipping to protect the workday CI slot. No heartbeat is recorded, so nightly-reconcile.yml will fail if this repeats."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.window.outputs.ok == 'true'
        uses: actions/checkout@v5
        with:
          # The rolling branch is rebased onto the checked-out master below, so
          # the batch needs real history, not the default depth-1 tip.
          fetch-depth: 0

      - name: Resolve seed range and date
        if: steps.window.outputs.ok == 'true'
        id: params
        # ROTATE the start seed. Re-walking last night's window re-proves what
        # last night proved and every candidate deduplicates against the corpus
        # it already produced; the generator's space is effectively unbounded,
        # so fresh ranges are free coverage.
        #
        # The date is passed EXPLICITLY. Generation never reads the clock
        # (RFC-201 §5.4) — that is what lets a committed file be regenerated
        # byte-identically — so the workflow supplies it as an input and the
        # emitted headers record it.
        #
        # Resolved BEFORE the adopt step below, which needs the date to
        # recognise its own same-day batch on the rolling branch.
        run: |
          SEEDS="${{ github.event.inputs.seeds }}"; SEEDS="${SEEDS:-4000}"
          QUOTA="${{ github.event.inputs.quota }}"; QUOTA="${QUOTA:-1000}"
          START="${{ github.event.inputs.seed_start }}"
          if [ -z "$START" ]; then
            DOY=$(date -u +%-j)
            START=$(( 1000000 + DOY * SEEDS ))
          fi
          echo "seeds=$SEEDS" >> "$GITHUB_OUTPUT"
          echo "quota=$QUOTA" >> "$GITHUB_OUTPUT"
          echo "start=$START" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Adopt the pending batch, if review has not caught up
        if: steps.window.outputs.ok == 'true'
        id: adopt
        # Generation runs on top of the pending batch rather than on bare
        # master, and that is load-bearing twice over.
        #
        # It is what makes the lane rolling — see the header for why a
        # date-stamped branch rots and why closing it loses. But it also closes
        # a dedup hole the dated design had: the generator deduplicates
        # candidates against the corpus it can SEE, and on bare master it cannot
        # see an unmerged batch. Two consecutive unmerged nights would each
        # rediscover the same shapes and the second PR would be largely a
        # reprint of the first, with the duplication invisible until both
        # merged.
        env:
          GH_TOKEN: ${{ github.token }}
          CENSUS: pkg/relational/conformance/factorycorpus/census_baseline.json
        run: |
          set -euo pipefail
          git config user.name "factory-run"
          git config user.email "factory-run@users.noreply.github.com"

          # Any open PR whose head is a batch branch, newest first. The
          # startswith covers the date-stamped branches this lane used to mint,
          # so a batch left open by the old shape is adopted and carried forward
          # instead of being stranded.
          PENDING="$(gh pr list --state open --limit 50 \
            --json number,headRefName \
            --jq '[.[] | select(.headRefName | startswith("factory/batch"))]
                  | sort_by(.number) | last | .headRefName // empty')"

          if [ -z "$PENDING" ]; then
            echo "no pending batch PR — this batch starts from master"
            git checkout -B factory/batch
            echo "adopted=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "adopting pending batch branch $PENDING"
          git fetch --no-tags origin "+refs/heads/$PENDING:refs/remotes/origin/$PENDING"
          git checkout -B factory/batch "refs/remotes/origin/$PENDING"

          # A same-day RE-RUN replaces its own batch instead of stacking a
          # near-empty second one on top. Under the old dated branch this came
          # free (the branch was recut from master each time); under a rolling
          # branch the re-run would deduplicate its whole seed range against the
          # scenarios it committed hours earlier, commit nothing, and exit 3 —
          # reporting "the pipeline is broken" for a re-run that worked. One
          # commit per run means the tip is the only same-date one.
          if git log -1 --format=%s | grep -qF "batch ${{ steps.params.outputs.date }}"; then
            echo "tip is already this date's batch — dropping it so this run replaces rather than stacks"
            git reset --hard HEAD~1
          fi

          if ! git rebase "$GITHUB_SHA"; then
            CONFLICTS="$(git diff --name-only --diff-filter=U)"
            if [ "$CONFLICTS" != "$CENSUS" ]; then
              git rebase --abort
              echo "::error::the pending batch does not rebase onto master with only the derived census conflicting. Conflicting paths: ${CONFLICTS//$'\n'/, }. Family files are append-only, so a conflict in one is a real divergence and wants a human, not a resolution rule."
              exit 1
            fi
            # The census is DERIVED, never merged. A hand-merged census is a
            # number nobody re-derived, which is how a census stops describing
            # its corpus while still passing its own gate. Keep the PENDING
            # batch's copy — deliberately the stronger of the two baselines,
            # since it names every scenario the rebase must preserve, so a
            # scenario dropped by the rebase trips the ratchet below rather
            # than passing under master's lower numbers. `--theirs` during a
            # rebase is the commit being replayed, i.e. the batch.
            git checkout --theirs -- "$CENSUS"
            git add -- "$CENSUS"
            GIT_EDITOR=true git rebase --continue
          fi
          # -update-census re-renders this from the rebased FILES before the
          # commit below, so the placeholder above never reaches the PR.
          echo "adopted=$PENDING" >> "$GITHUB_OUTPUT"

      - name: Check Docker
        if: steps.window.outputs.ok == 'true'
        run: |
          docker info >/dev/null 2>&1 || { echo "::error::Docker unavailable — the factory cannot generate a batch"; exit 1; }

      - name: Generate the batch
        if: steps.window.outputs.ok == 'true'
        id: run
        # Typed exit codes: 1 = oracle disagreement (a potential engine bug,
        # persisted under factory-findings/), 2 = infra, 3 = the batch
        # committed nothing. Those are the TOOL's codes, and Bazel spends the
        # same small integers on its own failures — a build break also exits 1.
        # That is why the build is a separate command below: once it has
        # succeeded, an exit 1 from the run step is the tool's, and a triager
        # who reads this list goes looking for findings that actually exist.
        # 3 is a FAILURE on purpose — a factory run that
        # writes no test is a broken pipeline, not a quiet success, and the
        # thing that would otherwise hide it is that an empty batch looks
        # exactly like a flattened frontier.
        # The batch appends scenarios to the RFC-201 §5.7 family files
        # (<family>.yamsql) — or creates a new family file when a batch reaches
        # a family first — and re-renders each touched file canonically, so the
        # PR diff is the appended scenarios plus nothing.
        #
        # -update-census: persist() verifies the ratchet against the COMMITTED
        # baseline first and only then raises it, so the flag cannot mask a
        # shrink — and without it the batch PR would carry a baseline that no
        # longer equals the corpus, which TestCensusBaselineIsMeasured rejects.
        run: |
          set -o pipefail
          # bazelisk, not `go run`. Originally because the runner image had no Go
          # at all (every batch died in 12s with exit 127 `go: command not
          # found`); the fleet now installs a pinned Go, so that reason is spent
          # and the remaining one is the durable one: `go run` would resolve the
          # toolchain and the module graph itself, off whatever the box happens
          # to have, while everything else in this repo is built by Bazel from
          # the go_sdk pinned to go.mod. Two toolchains reaching the same corpus
          # is a divergence waiting to be blamed on the engine.
          #
          # Build first, separately, so a compile break fails as a compile break
          # instead of impersonating the tool's exit 1 (see the typed codes
          # above). After this succeeds the run below builds nothing.
          bazelisk build //cmd/factory-run
          # `bazelisk run` executes from the runfiles tree, not the workspace,
          # so every path flag must be absolute. Measured: with the relative
          # defaults the tool resolves testdata against the runfiles root, finds
          # no *.yamsql, and exits 2 on an empty corpus it should have loaded.
          bazelisk run //cmd/factory-run -- \
            -out "$GITHUB_WORKSPACE/pkg/relational/conformance/factorycorpus/testdata" \
            -findings "$GITHUB_WORKSPACE/factory-findings" \
            -manifest "$GITHUB_WORKSPACE/factory-manifest.json" \
            -pr-body "$GITHUB_WORKSPACE/factory-pr-body.md" \
            -run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -seeds ${{ steps.params.outputs.seeds }} \
            -seed-start ${{ steps.params.outputs.start }} \
            -quota ${{ steps.params.outputs.quota }} \
            -date ${{ steps.params.outputs.date }} \
            -update-census \
            2>&1 | tee batch.log

      - name: Record genuine-run heartbeat
        # Written ONLY when the batch actually ran, and deliberately NOT
        # conditioned on success: a batch that found an oracle disagreement
        # exits non-zero, and that is the factory WORKING. The heartbeat
        # answers "did it run", the job conclusion answers "did it pass".
        if: ${{ steps.window.outputs.ok == 'true' && !cancelled() && steps.run.outcome != 'skipped' }}
        run: |
          {
            echo "net=factory-batch"
            echo "ran_at=$(date -u +%FT%TZ)"
            echo "run_id=${{ github.run_id }}"
            echo "sha=${{ github.sha }}"
            echo "seeds=${{ steps.params.outputs.start }}..$(( ${{ steps.params.outputs.start }} + ${{ steps.params.outputs.seeds }} - 1 ))"
            echo "batch_outcome=${{ steps.run.outcome }}"
          } | tee nightly-heartbeat.txt

      - name: Upload genuine-run heartbeat
        if: ${{ steps.window.outputs.ok == 'true' && !cancelled() && steps.run.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: nightly-heartbeat-factory-batch
          path: nightly-heartbeat.txt
          retention-days: 90
          if-no-files-found: error

      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: factory-findings
          path: |
            factory-findings/
            factory-manifest.json
            batch.log
          if-no-files-found: ignore

      - name: Open or update the rolling batch PR
        if: ${{ success() && steps.window.outputs.ok == 'true' }}
        # ONE rolling PR, carrying each run's manifest (seeds, counts, dedup
        # stats, oracle stats) — §5.1's materialize stage. The branch is
        # `factory/batch`, undated; see the header for why the date-stamped
        # shape rotted and why closing the stale PR loses.
        #
        # The reviewable UNIT is not the PR, it is the run: one commit and one
        # manifest comment per night. §5.2's quota still bounds what a single
        # night adds, and accumulation across nights is a visible review-backlog
        # signal in one place rather than N abandoned PRs.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="factory/batch"
          ADOPTED="${{ steps.adopt.outputs.adopted }}"
          git config user.name "factory-run"
          git config user.email "factory-run@users.noreply.github.com"
          git add pkg/relational/conformance/factorycorpus/
          if git diff --cached --quiet; then
            echo "no new scenarios — the feature-vector frontier has flattened for this seed range"
            exit 0
          fi
          # The body is RENDERED BY THE TOOL (cmd/factory-run -pr-body), not
          # assembled here. This step used to inline the whole manifest, and the
          # manifest embeds the census's two per-scenario maps — whole-corpus
          # state, one entry per committed scenario. That crossed GitHub's 65536
          # character limit at roughly 500 scenarios and reached ~640KB at 5000,
          # so every run died on "GraphQL: Body is too long (createPullRequest)"
          # AFTER committing and pushing the branch. Dropping the maps needed
          # jq, which nothing else in this repo depends on; a typed renderer with
          # tests (factory.Manifest.SummaryMarkdown) is the durable answer.
          if [ ! -s factory-pr-body.md ]; then
            echo "::error::factory-pr-body.md is missing or empty — the tool did not render a PR body, and a batch PR with no description is not reviewable"
            exit 1
          fi
          # Belt and braces, and deliberately NOT redundant with the renderer's
          # own budget: this guard is what holds if someone later widens a field
          # the renderer treats as bounded. Cut by CHARACTER (GitHub counts
          # characters) and leave a marker — a body that stops mid-sentence with
          # no marker reads as a generator bug.
          LIMIT=65536
          CHARS=$(wc -m < factory-pr-body.md)
          if [ "$CHARS" -gt "$LIMIT" ]; then
            echo "::warning::PR body is ${CHARS} characters, over GitHub's ${LIMIT}; truncating with a marker. The full manifest is in the factory-findings artifact."
            {
              head -c 60000 factory-pr-body.md
              printf '\n\n---\n\n**[truncated: body exceeded GitHub'"'"'s %s-character limit. Full `factory-manifest.json` is in the factory-findings artifact of this run.]**\n' "$LIMIT"
            } > pr-body.trunc.md
            mv pr-body.trunc.md factory-pr-body.md
          fi
          # The COMMIT message is a short subject line, not the body: a 640KB
          # commit message is its own defect, and it survived only because git
          # has no limit where the GitHub API does.
          git commit -m "factory: batch ${{ steps.params.outputs.date }} (${{ steps.params.outputs.seeds }} seeds from ${{ steps.params.outputs.start }})"
          # Force, because the rolling branch was rebased onto master above.
          # --force-with-lease is deliberately NOT used: the lease would be
          # against the ref this job fetched minutes ago, and the only writer to
          # this branch is this job, so a lease here would buy nothing and would
          # wedge the lane on any manual rebase a reviewer performed.
          git push -f origin "$BRANCH"

          if gh pr view "$BRANCH" --json state -q .state 2>/dev/null | grep -q OPEN; then
            # Already open: the PR body describes the run that OPENED it, so
            # this run's manifest goes on as a comment. Overwriting the body
            # would delete the earlier runs' manifests, and those are the
            # per-run reviewable units the accumulated diff is made of.
            gh pr comment "$BRANCH" --body-file factory-pr-body.md
            gh pr edit "$BRANCH" --title "factory: batch — pending scenarios through ${{ steps.params.outputs.date }}"
          else
            gh pr create --head "$BRANCH" \
              --title "factory: batch — pending scenarios through ${{ steps.params.outputs.date }}" \
              --body-file factory-pr-body.md
          fi

          # A date-stamped batch PR adopted from the old shape is closed only
          # HERE, after its scenarios have been rebased, regenerated against and
          # pushed to the rolling branch — so this discards a duplicate pointer,
          # never coverage. Closing a batch that had NOT been carried forward
          # would throw away a night of generated tests, which is the thing
          # §5.2's quota exists to prevent.
          if [ -n "$ADOPTED" ] && [ "$ADOPTED" != "$BRANCH" ]; then
            gh pr close "$ADOPTED" --delete-branch --comment "Superseded by the rolling batch branch \`$BRANCH\`. Every scenario from this PR was rebased onto master and pushed there, and tonight's batch was generated on top of it, so no generated coverage is discarded — only this duplicate pointer to it. The lane is rolling now precisely so a date-stamped branch can no longer be stranded by a census conflict."
          fi
