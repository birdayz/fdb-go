# Release the frl CLI: static cross-compiled binaries + checksums + provenance.
#
# Trigger: push the project's release tag (the maintainer's release act, per
# RELEASE.md):
#
#   git tag -a v0.2.0 -m v0.2.0 && git push origin v0.2.0
#
# frl is a package of the root module, so the root tag is what
# `go install fdb.dev/cmd/frl@vX.Y.Z` resolves: the binaries here are
# byte-for-byte what the Go toolchain would build (CGO_ENABLED=0, -trimpath),
# and `frl version` reports vX.Y.Z via Go's VCS stamping, no ldflags injection.
# v0.1.0 shipped frl from a nested module under the tag cmd/frl/v0.1.0;
# install.sh still finds that release.
#
# workflow_dispatch runs the whole pipeline as a dry run (build + smoke +
# checksums, no release published); give it a version to preview that tag's notes.
#
# fdb.dev/install.sh consumes these releases; it expects assets named
# frl_<version>_<os>_<arch>.tar.gz plus checksums.txt on the release.

name: frl release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Tag whose release notes to preview, e.g. v0.2.0 (nothing is published)"
        required: false

permissions:
  contents: write # create the GitHub release
  id-token: write # provenance attestation (sigstore)
  attestations: write

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # Full history + tags: Go's buildvcs derives the module version
          # from the vX.Y.Z tag; a shallow clone would stamp a
          # pseudo-version and the smoke check below would fail the release.
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.9'
          cache-dependency-path: go.sum

      - name: Verify third-party notices are current
        run: |
          set -euo pipefail
          git ls-files --error-unmatch THIRD_PARTY_NOTICES.txt
          test -s THIRD_PARTY_NOTICES.txt
          python3 scripts/update-third-party-notices.py
          git diff --exit-code -- THIRD_PARTY_NOTICES.txt

      - name: Cross-compile static binaries
        working-directory: cmd/frl
        env:
          # Build exactly what `go install fdb.dev/cmd/frl@<tag>` builds: the
          # root module's graph, no cgo.
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist

          # Stamp check target first: the version the binary reports comes
          # from Go's VCS stamping, so build the host binary and read it back.
          go build -trimpath -ldflags='-s -w' -o dist/frl-host .
          VERSION="$(./dist/frl-host version --short)"
          echo "stamped version: $VERSION"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_VERSION="$GITHUB_REF_NAME"
            if [[ "$VERSION" != "$TAG_VERSION" ]]; then
              echo "::error::stamped version $VERSION != tag $TAG_VERSION (VCS stamping broke?)"
              exit 1
            fi
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          # linux + darwin only: FoundationDB has no supported Windows
          # client story, and the FDB client library is Unix-only
          # (clusterfile change detection uses syscall.Stat_t). Windows
          # users go through WSL, which the linux/amd64 binary covers.
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            export GOOS="${target%/*}" GOARCH="${target#*/}"
            out="dist/${GOOS}_${GOARCH}"
            mkdir -p "$out"
            echo "building $GOOS/$GOARCH"
            go build -trimpath -ldflags='-s -w' -o "$out/frl" .
            cp ../../LICENSE ../../NOTICE ../../THIRD_PARTY_NOTICES.txt "$out/"
            tar -C "$out" -czf "dist/frl_${VERSION}_${GOOS}_${GOARCH}.tar.gz" frl LICENSE NOTICE THIRD_PARTY_NOTICES.txt
          done

          (cd dist && sha256sum frl_*.tar.gz > checksums.txt && cat checksums.txt)

      - name: Smoke test (extract, run, verify checksum path)
        working-directory: cmd/frl/dist
        run: |
          set -euo pipefail
          # Exactly what install.sh does: verify the checksum, extract, run.
          sha256sum --check --ignore-missing checksums.txt
          for target in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64; do
            out="smoke/$target"
            mkdir -p "$out"
            tar -xzf "frl_${VERSION}_${target}.tar.gz" -C "$out" LICENSE NOTICE THIRD_PARTY_NOTICES.txt
            for notice in LICENSE NOTICE THIRD_PARTY_NOTICES.txt; do
              test -s "$out/$notice"
              cmp "../../../$notice" "$out/$notice"
            done
          done
          mkdir -p smoke && tar -xzf "frl_${VERSION}_linux_amd64.tar.gz" -C smoke frl
          got="$(./smoke/frl version --short)"
          [[ "$got" == "$VERSION" ]] || { echo "::error::smoke version $got != $VERSION"; exit 1; }
          ./smoke/frl --help > /dev/null
          echo "smoke OK: frl $got"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            cmd/frl/dist/frl_*.tar.gz
            cmd/frl/dist/checksums.txt

      - name: Preview release notes (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        env:
          TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          scripts/release-notes.sh --check "$TAG" > "$RUNNER_TEMP/notes.md" ||
            { echo "::error::no release notes for $TAG (see the message above)"; exit 1; }
          tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/notes.md"

      - name: Publish release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          scripts/release-notes.sh "$GITHUB_REF_NAME" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" \
            --title "$VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            cmd/frl/dist/frl_*.tar.gz cmd/frl/dist/checksums.txt

      - name: Verify published download URL (what install.sh fetches)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          # The install script downloads via the tag's URL; prove it resolves
          # and serves the exact bytes we just published.
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/frl_${VERSION}_linux_amd64.tar.gz"
          for i in {1..10}; do
            curl -fsSL -o /tmp/published.tar.gz "$url" && break
            echo "asset not ready yet ($i), retrying..."; sleep 5
          done
          cmp /tmp/published.tar.gz "cmd/frl/dist/frl_${VERSION}_linux_amd64.tar.gz"
          echo "published asset verified byte-identical: $url"
