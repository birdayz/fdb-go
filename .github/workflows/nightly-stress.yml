name: Nightly Stress

# RFC-107: the stress suite (//pkg/relational/sqldriver/stress, tag `stress`+`manual`)
# was excluded from every workflow (--test_tag_filters=-stress), so the planner/cost-model/
# executor regression net ran in NO CI. This scheduled job runs it. It does NOT gate PRs
# (too heavy); a red run here is a release blocker, surfaced like the nightly-fuzz failures.
#
# WHAT RUNS: the `bazelisk test` below passes NO --test.run filter, so it executes the
# WHOLE stress target — every scale (10K, 100K, 1M), the ingest-parallelism matrix and
# the SaveRecord comparisons — not just the 1M suite this job used to be named after.
# The 10M scales are NOT here and are not skipped either: they carry an extra
# `realcluster` build tag, so they are not compiled into this target at all (a single
# Docker FDB node cannot sustain them — see stress_10m_test.go). The advertised scale
# list and the executed scale list are therefore identical.
on:
  schedule:
    # 4:23 AM UTC daily (off-minute, after the 3:17 fuzz job, to avoid fleet congestion)
    - cron: '23 4 * * *'
  workflow_dispatch: # manual trigger

jobs:
  stress:
    name: Stress suite 10K/100K/1M (planner / cost-model / executor)
    runs-on: hetzner-fdb
    timeout-minutes: 120

    steps:
      - name: Check nightly window
        # A `schedule` trigger fires the WORKFLOW, but GitHub dispatches the
        # actual JOB whenever hetzner-fdb (our single self-hosted slot) is
        # free — a backlog (regular PR CI, or another nightly still running)
        # can delay that by hours, landing this 2h stress run in the middle
        # of the workday. The check MUST run here, as the first step on the
        # runner that was actually allocated, not in a separate gate job
        # before the queue: a pre-queue check passes at dispatch time and is
        # stale by the time this runner is finally free hours later (codex,
        # PR #445 round 1 — the first version of this gate had exactly that
        # bug). `workflow_dispatch` (manual "run it now") always proceeds.
        id: window
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HOUR=$(date -u +%-H)
          # 00:00-10:00 UTC. Sized from MEASURED dispatch, not from the cron hour:
          # across 07-15..07-29 this job's runner was allocated at 06:20..08:08 UTC
          # for an 04:23 cron, because GitHub's own scheduled-trigger dispatch on
          # this repo is late by ~2-3.5h before the self-hosted queue is even
          # consulted. The old 00:00-07:00 bound sat inside that landing spread and
          # skipped 12 consecutive nights green. 10:00 clears the worst observed
          # landing by ~2h and still leaves the 120m run finishing before midday.
          if [ "$HOUR" -ge 0 ] && [ "$HOUR" -lt 10 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::this runner became available at ${HOUR}:00 UTC, outside the 00:00-10:00 nightly window (the self-hosted queue delayed dispatch) — skipping the rest of this job to protect daytime CI capacity; it fires again at tomorrow's scheduled time. No heartbeat is recorded, so nightly-reconcile.yml will fail if this repeats."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.window.outputs.ok == 'true'
        uses: actions/checkout@v5

      - name: Check Docker (mandatory — else the stress gate silently no-ops)
        if: steps.window.outputs.ok == 'true'
        # The stress test's TestMain catches a missing FDB container and exits 0 with
        # the allowed `FDB not available (no Docker)` skip — so without Docker the
        # `bazelisk test` below reports SUCCESS while running ZERO stress coverage
        # (codex). Fail loudly here instead, so a green stress run always means the
        # scenarios actually executed.
        run: |
          docker info >/dev/null 2>&1 || { echo "::error::Docker unavailable — the stress test would skip (exit 0) and the gate would silently pass with no coverage"; exit 1; }

      - name: Type-check the realcluster-tagged scales
        if: steps.window.outputs.ok == 'true'
        # stress_10m_test.go carries `stress && realcluster`. `realcluster` is not in
        # .bazelrc's tag list, so gazelle leaves the file out of the go_test srcs and
        # NOTHING in the Bazel build ever compiles it — it would rot silently until
        # someone next reached for a real cluster. `go vet` with both tags type-checks
        # it without running it (no cluster, no Docker, seconds). Same pattern as
        # nightly-libfdbc, which compiles the `libfdbc`-tagged backend the Bazel build
        # also skips.
        run: |
          OUTPUT_BASE=$(bazelisk info output_base 2>/dev/null)
          GO_BIN=$(ls "$OUTPUT_BASE"/external/rules_go++go_sdk+*download*/bin/go 2>/dev/null | head -1)
          if [ -z "$GO_BIN" ]; then
            bazelisk run @rules_go//go -- version >/dev/null 2>&1 || true
            GO_BIN=$(ls "$OUTPUT_BASE"/external/rules_go++go_sdk+*download*/bin/go 2>/dev/null | head -1)
          fi
          [ -n "$GO_BIN" ] || GO_BIN=go
          echo "Using Go: $GO_BIN ($($GO_BIN version))"
          # NO-OP GUARD, same discipline as every other gate in this repo's CI:
          # if the tag is renamed or the file moves, stress_10m_test.go simply
          # drops out of the package and `go vet` exits 0 having checked
          # NOTHING — the exact rot this step exists to catch, wearing a green
          # check. Assert the file is actually in the realcluster build first.
          FILES=$(GOWORK=off "$GO_BIN" list -tags 'stress realcluster' -f '{{.XTestGoFiles}}' ./pkg/relational/sqldriver/stress/)
          echo "realcluster build files: $FILES"
          case "$FILES" in
            *stress_10m_test.go*) ;;
            *) echo "::error::stress_10m_test.go is not in the 'stress realcluster' build — the type-check below would be a no-op"; exit 1 ;;
          esac
          GOWORK=off "$GO_BIN" vet -tags 'stress realcluster' ./pkg/relational/sqldriver/stress/

      - name: Resolve stress targets (no-op guard)
        if: steps.window.outputs.ok == 'true'
        id: targets
        # The stress target carries BOTH `stress` and `manual` tags, so a wildcard
        # `//pkg/... --test_tag_filters=stress` drops it (manual targets are excluded
        # from wildcard expansion BEFORE the tag filter). Resolve explicit labels via
        # query and FAIL on an empty set — the no-fake-checkbox rule applied to CI:
        # a gate that silently runs nothing is worse than no gate.
        run: |
          STRESS=$(bazelisk query 'attr(tags, stress, tests(//pkg/...))' 2>/dev/null)
          if [ -z "$STRESS" ]; then
            echo "::error::no stress targets resolved — the stress gate would be a no-op"
            exit 1
          fi
          echo "Resolved stress targets:"
          echo "$STRESS"
          # space-join for the bazel test invocation
          echo "labels=$(echo $STRESS | tr '\n' ' ')" >> "$GITHUB_OUTPUT"

      - name: Run stress tests
        if: steps.window.outputs.ok == 'true'
        id: stress
        # Gate ONLY on correctness: the stress test asserts row counts / results, so a
        # cost-model or executor regression that returns wrong rows fails here (bazel
        # non-zero exit). Wall-clock latency is NOT a gate (noisy on a shared self-hosted
        # runner → false reds); it is reported below as a trend instead (RFC-107 §1).
        run: |
          # pipefail is REQUIRED: GitHub Actions runs `bash -e` but NOT pipefail, so
          # `bazelisk test … | tee` would return tee's exit (0) and SILENTLY PASS a red
          # stress run — the cardinal CI sin. With pipefail the bazel non-zero exit
          # propagates and fails the job.
          set -o pipefail
          bazelisk test ${{ steps.targets.outputs.labels }} \
            --test_timeout=3600 --test_output=streamed --test_arg=--test.v \
            --nocache_test_results 2>&1 | tee stress-output.txt

      - name: Report latency trend (non-gating)
        # Run on stress success OR failure, but NOT if the stress step was skipped
        # (Docker preflight aborted, or outside the nightly window) — else this greps
        # a non-existent output file and reports a misleading empty trend (codex).
        if: ${{ steps.window.outputs.ok == 'true' && !cancelled() && steps.stress.outcome != 'skipped' }}
        # Parse the per-op latency lines the stress test prints and emit them to the job
        # summary as a REPORTED trend. A real regression is visible without flaking the
        # build; an out-of-band alarm on the trend is future work (RFC-107 §1). The
        # CLAUDE.md reference thresholds: point lookups <5ms, full scans ~3s/1M, index
        # equality <10ms.
        run: |
          {
            echo "## Stress suite (10K/100K/1M) — latency trend ($(date -u +%FT%TZ))"
            echo '```'
            # grep -m 40 (NOT `grep | head -40`): head closes the pipe early on >40
            # matches → grep SIGPIPEs → under GHA's default `bash -eo pipefail` the
            # `|| echo` fallback would ALSO fire, printing a spurious "no matches" line
            # next to real matches (codex). `grep -m 40` caps inside grep, so its exit is
            # clean: 0 with matches (no fallback), 1 with none (fallback prints).
            grep -m 40 -iE 'point lookup|full scan|index (equality|scan)|p50|p99|latency|ms/op|rows|elapsed' \
              stress-output.txt || echo "(no latency lines matched — check the stress test output format)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload stress output
        if: ${{ steps.window.outputs.ok == 'true' && !cancelled() && steps.stress.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: stress-output
          path: stress-output.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Record genuine-run heartbeat
        # The window gate above can skip every real step and still exit SUCCESS,
        # which is how 12 consecutive nights (07-18..07-29) went green with the
        # stress suite executing zero times — the last genuine run, 07-17, had
        # FAILED. This file is written ONLY when the suite actually executed, and
        # nightly-reconcile.yml fails when its timestamp goes stale.
        #
        # The condition deliberately does NOT require success: a red stress run is
        # the net WORKING. The heartbeat answers "did it run"; the job conclusion
        # answers "did it pass". Gating this on success would silence the net for
        # exactly as long as it keeps finding the bug.
        if: ${{ steps.window.outputs.ok == 'true' && !cancelled() && steps.stress.outcome != 'skipped' }}
        run: |
          {
            echo "net=stress"
            echo "ran_at=$(date -u +%FT%TZ)"
            echo "run_id=${{ github.run_id }}"
            echo "sha=${{ github.sha }}"
            echo "outcome=${{ steps.stress.outcome }}"
          } | tee nightly-heartbeat.txt

      - name: Upload genuine-run heartbeat
        if: ${{ steps.window.outputs.ok == 'true' && !cancelled() && steps.stress.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        # if-no-files-found: error, NOT ignore — a heartbeat that silently fails to
        # upload reproduces the very silence this mechanism exists to break.
        # retention 90d must exceed the reconciler's staleness limit by a wide
        # margin, else expiry alone would read as "the net stopped running".
        with:
          name: nightly-heartbeat-stress
          path: nightly-heartbeat.txt
          retention-days: 90
          if-no-files-found: error
