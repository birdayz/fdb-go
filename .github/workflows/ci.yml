name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, Lint & Test
    runs-on: hetzner-fdb-vm
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          # Retirement ledgers name the exact historical corpus commit. A
          # shallow checkout would make the permanent history gate a no-op.
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Verify corpus retirement history anchors
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          trusted_ref=HEAD
          # Declare WHOSE history the ref belongs to. Only the target branch may
          # advance independently of this change and so be normalized to the fork
          # point; a pre-push tip that is not an ancestor of HEAD means history
          # was REWRITTEN, and narrowing there would let a force-push erase
          # retirement ledgers unnoticed.
          trusted_ref_kind=prior-tip
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            # On a PR, authenticate against the target branch as it existed
            # independently of the proposed history.
            git fetch --no-tags origin "+refs/heads/${GITHUB_BASE_REF}:refs/remotes/origin/${GITHUB_BASE_REF}"
            trusted_ref="refs/remotes/origin/$GITHUB_BASE_REF"
            trusted_ref_kind=target-branch
          elif [ -n "${EVENT_BEFORE:-}" ] && [[ ! "$EVENT_BEFORE" =~ ^0+$ ]]; then
            # On a target-branch push, use the pre-push commit when available.
            if ! git cat-file -e "$EVENT_BEFORE^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$EVENT_BEFORE"
            fi
            trusted_ref="$EVENT_BEFORE"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            trusted_ref=HEAD^
          fi
          go run ./cmd/verify-corpus-retirement-history \
            -trusted-ref "$trusted_ref" -trusted-ref-kind "$trusted_ref_kind"

      - name: Check generated code is up to date
        run: |
          just generate
          if ! git diff --exit-code; then
            echo "Generated code is out of date. Run 'just generate' and commit."
            exit 1
          fi

      - name: Check vanity-import module list is up to date
        # website/data/gomodules.yaml lists the nested Go modules that need a stub page
        # on fdb.dev. The site build regenerates it, so production self-heals; this gate
        # keeps the committed copy honest so `hugo server` locally serves what CI does.
        run: |
          # Assert the file is TRACKED before diffing it. `git diff` reports nothing for
          # an untracked path, so a renamed/never-added file would sail through green —
          # the gate would fail open, which is the direction that ships bugs.
          git ls-files --error-unmatch website/data/gomodules.yaml >/dev/null || {
            echo "::error::website/data/gomodules.yaml is not tracked; this gate cannot see it."
            exit 1
          }
          # Invoked via `bash`, not as an executable: this repo sets core.fileMode=false,
          # so a plain `chmod +x` never reaches the index and the script lands 100644 —
          # which fails only in CI (exit 126), never locally, where the on-disk bit is set.
          bash scripts/gen-vanity-modules.sh >/dev/null
          # Diff against HEAD, not the index: `git diff` alone compares worktree-vs-index
          # and goes quiet if the drift happens to be staged.
          if ! git diff --exit-code HEAD -- website/data/gomodules.yaml; then
            echo "::error::Nested Go modules changed. Run 'just vanity-modules' and commit website/data/gomodules.yaml."
            exit 1
          fi

      - name: Check Docker (else the PRIMARY merge gate silently no-ops)
        # The whole test suite drives real FDB testcontainers; without Docker every
        # FDB test hits the allowed `FDB not available (no Docker)` skip and this job
        # — the gate that BLOCKS MERGES — reports SUCCESS with no coverage (codex,
        # RFC-107). This matters more than the nightly/race jobs: fail loudly.
        run: |
          docker info >/dev/null 2>&1 || { echo "::error::Docker unavailable — the test suite would skip (exit 0) and the merge gate would silently pass with no coverage"; exit 1; }

      # `--define gotags=fdbdocker` turns the SimFDB differential's missing-container
      # skip into a FAILURE (pkg/simfdb/differential_docker_required.go). The Docker
      # preflight above proves the daemon answers; the tag proves the differential
      # actually RAN. They are not the same check — a container can fail to start on a
      # runner whose daemon is perfectly healthy, and that lands on the sanctioned
      # `FDB not available (no Docker)` skip. The differential is the ONLY test that
      # checks SimFDB against real FDB rather than against itself, so skipping it
      # yields a green suite that has verified nothing about fidelity.
      #
      # The flag is ADDITIVE to `.bazelrc`'s `--@rules_go//go/config:tags=` list
      # (rules_go go/private/context.bzl:998-1000 appends `--define gotags` to it), so
      # `bazelrunfiles` and `stress` still hold. Passing the label flag directly would
      # have to restate them and would silently drop any tag later added there.
      - name: Build, lint & test
        id: test
        run: bazelisk test //... //cmd/fdb-stacktester/bindingtester:bindingtester_test --define gotags=fdbdocker --test_tag_filters=-stress --test_summary=detailed --build_event_json_file=.bazel-bep.jsonl

      # tools/bazelscaleset is a standalone Go module (its own go.mod, absent from
      # go.work) so the runner supervisor's GitHub-API dependencies never enter the
      # record-layer dependency graph. That separation also put its 53 tests outside
      # `bazelisk test //...` — they ran NOWHERE, in CI or locally, while looking
      # entirely normal in review. This step is the lane; //pkg/docscheck's
      # TestOutOfBazelLanesAreReal fails if it is renamed or removed, so the
      # exemption cannot rot back into silence.
      - name: Test the standalone runner-supervisor module
        if: ${{ !cancelled() }}
        run: GOWORK=off go test ./... -count=1
        working-directory: tools/bazelscaleset

      - name: Timeout budgets
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        # Same gate as the race lane's, over the main suite — see the long comment
        # there for why a run's own event stream, with cache hits dropped, is the
        # only honest measure. This lane is where the heavy corpus targets carry
        # their real budgets, so it is where their growth shows up first.
        run: |
          bazelisk query 'tests(//...)' --output=xml --xml:default_values > .bazel-targets.xml
          go run ./cmd/test-budget -lane suite -bep .bazel-bep.jsonl -targets .bazel-targets.xml -warn 0.70 -threshold 0.90

      # Report/upload run on test success OR failure (always() lost the report on a
      # red suite) — but NOT when the test step was SKIPPED (e.g. the Docker preflight
      # aborted first): there's no BEP then, and `> test-report.html` would otherwise
      # truncate an EMPTY report and publish it, masking the real failure (codex).
      - name: Generate test report
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        run: |
          bazelisk build //cmd/test-report
          BAZEL_BIN=$(bazelisk info bazel-bin 2>/dev/null)
          "$BAZEL_BIN/cmd/test-report/test-report_/test-report" .bazel-bep.jsonl > test-report.html
          echo "Report generated: $(grep 'stat-total' test-report.html | grep -oP '>\K\d+(?=</span>)') tests"

      - name: Upload test report to Hetzner Object Storage
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        continue-on-error: true
        env:
          S3_ACCESS_KEY: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.HETZNER_S3_SECRET_KEY }}
          S3_ENDPOINT: ${{ secrets.HETZNER_S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.HETZNER_S3_BUCKET }}
        run: |
          if [ -z "$S3_ACCESS_KEY" ]; then
            echo "Hetzner Object Storage secrets not configured — skipping upload"
            exit 0
          fi
          if ! command -v mc &>/dev/null; then
            mkdir -p "$HOME/.local/bin"
            curl -fsSL https://dl.min.io/client/mc/release/linux-amd64/mc -o "$HOME/.local/bin/mc"
            chmod +x "$HOME/.local/bin/mc"
            export PATH="$HOME/.local/bin:$PATH"
          fi
          mc alias set hetzner "$S3_ENDPOINT" "$S3_ACCESS_KEY" "$S3_SECRET_KEY"
          REF="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"
          REF=$(echo "$REF" | sed 's|refs/pull/\([0-9]*\)/merge|pr-\1|; s|/|-|g')
          SHA="${GITHUB_SHA:0:7}"
          mc cp test-report.html "hetzner/$S3_BUCKET/reports/${REF}/latest.html"
          mc cp test-report.html "hetzner/$S3_BUCKET/reports/${REF}/${SHA}/report.html"
          REPORT_URL="https://${S3_BUCKET}.${S3_ENDPOINT#https://}/reports/${REF}/latest.html"
          echo "Report: ${REPORT_URL}"
          echo "Archive: https://${S3_BUCKET}.${S3_ENDPOINT#https://}/reports/${REF}/${SHA}/report.html"

      - name: Upload test report as artifact
        if: ${{ !cancelled() && steps.test.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: test-report.html
          retention-days: 30

  wire-oracle:
    name: Wire-type oracle (deterministic)
    # RFC-115 §5. The cross-client DATA-plane differential is already per-PR
    # (nightly-libfdbc.yml). This promotes the cmd/fdb-diff-oracle WIRE-type oracle —
    # nightly-only until now (nightly-fuzz.yml) — to per-PR, so a marshal regression in
    # a less-traveled reply type (e.g. the 8 reply-parse types) reddens BEFORE merge,
    # not ~a day later.
    #
    # Per-PR is DETERMINISTIC ONLY: TestDiff* + every Fuzz* SEED corpus replayed against
    # the C++ oracle. ACTIVE fuzzing (new-input discovery) is deliberately NOT a per-PR
    # gate — it is non-deterministic in WHAT it finds, so it reddens PRs on pre-existing
    # divergences unrelated to the change. (It did exactly that here: it surfaced the
    # latent IPAddress variant-marshal wire bug — real, but pre-existing — fixed in this
    # RFC §7.) Active fuzzing is the (revived) nightly net's job (nightly-fuzz.yml §7).
    runs-on: hetzner-fdb-vm
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build C++ oracle
        run: bazelisk build //cmd/fdb-diff-oracle:diff_oracle_bin

      - name: Build Go fuzz test
        run: bazelisk build //cmd/fdb-diff-oracle:fdb-diff-oracle_test

      - name: Resolve Bazel Go SDK
        id: go-sdk
        run: |
          OUTPUT_BASE=$(bazelisk info output_base 2>/dev/null)
          GO_BIN=$(ls "$OUTPUT_BASE"/external/rules_go++go_sdk+*download*/bin/go 2>/dev/null | head -1)
          if [ -z "$GO_BIN" ]; then
            echo "Bazel Go SDK not materialized (cold slot) — fetching it via bazel"
            bazelisk run @rules_go//go -- version >/dev/null 2>&1 || true
            GO_BIN=$(ls "$OUTPUT_BASE"/external/rules_go++go_sdk+*download*/bin/go 2>/dev/null | head -1)
          fi
          if [ -z "$GO_BIN" ]; then
            echo "Bazel Go SDK not found — trying system go"
            GO_BIN=go
          fi
          echo "go-bin=$GO_BIN" >> "$GITHUB_OUTPUT"
          echo "Using Go: $GO_BIN ($($GO_BIN version))"

      - name: Deterministic wire-type oracle (TestDiff + all fuzz seed corpora)
        # Runs every TestDiff* against the C++ oracle AND replays all Fuzz* SEED corpora
        # (committed under testdata/fuzz + each f.Add). The `^Fuzz` in -run is load-bearing:
        # without it `go test` does NOT exercise the Fuzz functions at all, so -run=TestDiff
        # alone silently skipped the seed corpora (the comment used to overclaim). With it,
        # a marshal regression in ANY oracle-compared type — or on any accumulated
        # interesting seed — reddens HERE, per-PR. Deterministic, ~0.1s. Active fuzzing
        # (new-input discovery) stays nightly (nightly-fuzz.yml §7).
        run: |
          ORACLE=$(realpath bazel-bin/cmd/fdb-diff-oracle/diff-oracle)
          DIFF_ORACLE_BIN="$ORACLE" ${{ steps.go-sdk.outputs.go-bin }} test -run='TestDiff|^Fuzz' -v -count=1 ./cmd/fdb-diff-oracle/

  govulncheck:
    name: Vulnerability scan
    runs-on: hetzner-fdb-vm
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: govulncheck (shipped packages)
        # Invoked through ./cmd/vulnscan rather than calling govulncheck directly.
        # The direct call was `go run golang.org/x/vuln/cmd/govulncheck@latest $PKGS`
        # and it failed the SECURITY GATE on an upstream 403: govulncheck fetches one
        # document per advisory from vuln.go.dev on every job, and a fleet of
        # self-hosted runners sharing a small block of addresses gets rate-limited.
        # Two PRs hit it within seconds of each other.
        #
        # The wrapper fixes three things that cannot be fixed in a shell one-liner,
        # each documented at its own site in cmd/vulnscan:
        #   - it mirrors the database locally (one 3 MB request per refresh window,
        #     zero in steady state) instead of issuing hundreds per job, and tolerates
        #     a failed refresh only while the mirror is inside a HARD staleness bound;
        #   - it pins the scanner version, so the gate's verdict cannot change without
        #     a diff in this repository;
        #   - it classifies on govulncheck's `-format json` output, so "found nothing"
        #     and "could not consult the database" are different outcomes. They are
        #     not distinguishable by exit code alone: pointed at an empty directory
        #     govulncheck exits 0 and emits a well-formed, zero-finding report.
        #
        # Both halves are gates. A transient fetch failure no longer reddens the
        # build, and nothing that failed to consult the database is ever reported as
        # clean. pkg/testcontainers stays excluded (see SECURITY.md); the exclusion
        # now lives in cmd/vulnscan next to the scan it applies to.
        run: go run ./cmd/vulnscan

  race:
    name: Race detector (SQL layer + client + cascades)
    runs-on: hetzner-fdb-vm
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Check Docker (else the race gates silently no-op)
        # Both race steps below drive real FDB testcontainers; without Docker the
        # tests skip (exit 0) and the gate passes with no race coverage (codex,
        # RFC-107). Fail loudly so a green race job always means -race actually ran.
        run: |
          docker info >/dev/null 2>&1 || { echo "::error::Docker unavailable — race tests would skip (exit 0) and the gate would silently pass"; exit 1; }

      - name: Set up Go
        # For `go run ./cmd/test-budget` in the budget step. It is deliberately not
        # built through Bazel: the race lane's whole cache discipline is that its
        # output_base only ever sees the race config, and building one tool at the
        # normal config there would discard the race analysis cache — the exact
        # thrash the isolated base exists to prevent.
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: -race tests (SQL layer + client + cascades) — isolated output_base
        id: race
        # CACHE ISOLATION (the perf fix). -race builds with --@rules_go//go/config:race,
        # a DIFFERENT build config than the normal "Build, Lint & Test" job. On a SHARED
        # output_base (the default), alternating that flag makes Bazel DISCARD the
        # analysis cache AND re-execute every action each run — so on the single
        # self-hosted runner the normal build and the race build cold-recompile on EVERY
        # PR (the CI slowness). A DEDICATED --output_base gives the race config its own
        # warm analysis + action cache that never thrashes — and is never thrashed by —
        # the normal build. Same base path as nightly-coverage's race step, so they share
        # one warm race cache. Mirrors nightly-coverage's memory discipline:
        #   - `bazelisk shutdown` frees the normal-base server's heap before the race
        #     server starts (7.6 GB box; FDB testcontainers also run here);
        #   - --host_jvm_args=-Xmx3g caps the race server; --local_resources bounds
        #     test concurrency by RAM.
        # The three scopes share ONE bazel server and one warm output_base, but are
        # THREE separate `bazel test` invocations — see the serialisation rationale
        # down at the invocation itself. (An older line here claimed relational and
        # client ran as one invocation; they have not since the serial split, and
        # with cascades added that would now be wrong three ways.)
        # WHY these scopes: the relational/SQL layer is driven concurrently via
        # database/sql and once caught a real client race (tx.hadRead → atomic.Bool);
        # the client packages (pipelined reads / commit / transport) are that same
        # hadRead class. bench (cgo libfdb_c) + conformance (Docker) stay excluded —
        # race-instrumented they'd dominate PR latency (RFC-107 §3). A data race in
        # either corrupts a SHARED FDB cluster, so keep it gating.
        #
        # That exclusion is why REL_SCOPE subtracts //pkg/relational/conformance/...
        # rather than being a plain //pkg/relational/... wildcard. The rule was
        # written for //pkg/fdbgo/...; the relational wildcard quietly acquired the
        # same class as directories were added under it, and nobody ever expanded
        # the scope "with measured numbers" the way RFC-107 §3 requires — the
        # corpora expanded into it. Measured, -race, four cores (the runner is a
        # 4-vCPU cx33), each target alone: the corpus execution target
        # //pkg/relational/conformance/factorycorpus/full runs 5000 scenarios in
        # 1328s and is the heaviest target in the lane, while
        # //pkg/relational/sqldriver takes 277s and
        # //pkg/relational/conformance/plandiff takes 31s. Co-scheduled four at a
        # time on a 4-vCPU / 7.6 GB box those numbers stop meaning anything: on
        # PR #577's run plandiff — a 31s target — hit its 900s timeout, and
        # sqldriver hit its own, while the corpus target ran 1830s. Nothing had
        # got slower; the runner had run out of resources and every target was
        # starving.
        #
        # The corpora are CONTENT gates, not concurrency probes: they drive the same
        # driver → planner → executor stack sqldriver_test already drives from 1292
        # concurrent tests, over per-scenario state that is shared with nothing. The
        # race-coverage delta is ~0 and the cost is the merge queue. They keep
        # running non-instrumented in "Build, Lint & Test" on every PR, and under
        # the detector in nightly-coverage's race step.
        #
        # CASCADES is the third scope. Note precisely what it adds: the relational
        # scope already LINKS AND DRIVES the Cascades planner, so planner code was
        # never entirely un-raced — it was covered INDIRECTLY, through whatever
        # paths the SQL tests happen to take. What was missing is the cascades
        # package's OWN test binary under the detector, which matters because that
        # package has explicitly concurrent tests (TestRuleRegistry_Concurrent
        # spawns goroutines) that no relational test can reach. Cascades is
        # CPU-only — no Docker, no FDB, no testcontainers — so unlike bench and
        # conformance it costs a compile plus a few seconds of tests.
        run: |
          bazelisk shutdown
          RACE_BASE="$HOME/.cache/bazel/_race_output_base"
          REL_SCOPE="//pkg/relational/... -//pkg/relational/conformance/..."
          CLIENT_SCOPE="//pkg/fdbgo/client/... //pkg/fdbgo/transport/... //pkg/fdbgo/fdb/..."
          CASCADES_SCOPE="//pkg/recordlayer/query/plan/cascades/..."
          # No-op guard PER SCOPE (codex): count each gate independently. Counting the
          # UNION would let one side silently drop to zero (e.g. the client packages stop
          # exposing test targets) while the other keeps the union > 0 — `bazel test`
          # would still exit 0 and quietly lose that race coverage. All must be non-empty.
          #
          # A scope is a list of `bazel test` TARGET PATTERNS, where `-//pkg/x/...`
          # subtracts; `bazel query` wants one expression, where `a - b` subtracts.
          # qexpr translates, per token, instead of blanket-joining on " + " — that
          # older one-liner turned an exclusion into `a + -b`, which query rejects,
          # and the guard would have counted 0 and failed the job on syntax.
          qexpr() {
            expr=""
            for p in $1; do
              case "$p" in
                -*) expr="$expr - ${p#-}" ;;
                *)  if [ -z "$expr" ]; then expr="$p"; else expr="$expr + $p"; fi ;;
              esac
            done
            echo "$expr"
          }
          q() { bazelisk --output_base="$RACE_BASE" --host_jvm_args=-Xmx3g query "tests($(qexpr "$1"))" 2>/dev/null | wc -l; }
          NR=$(q "$REL_SCOPE"); NC=$(q "$CLIENT_SCOPE"); NX=$(q "$CASCADES_SCOPE")
          if [ "$NR" -eq 0 ]; then echo "::error::relational race scope resolved 0 test targets — gate would be a no-op"; exit 1; fi
          if [ "$NC" -eq 0 ]; then echo "::error::client race scope resolved 0 test targets — gate would be a no-op"; exit 1; fi
          if [ "$NX" -eq 0 ]; then echo "::error::cascades race scope resolved 0 test targets — gate would be a no-op"; exit 1; fi
          echo "race scope: relational=$NR client=$NC cascades=$NX test targets"
          # Run the heavy suites as SEPARATE, serial invocations (codex) — NOT one
          # combined `bazel test`. A combined invocation lets Bazel interleave relational
          # and client targets under --local_test_jobs=4, so the heavy client_test could
          # overlap the heavy relational FDB-testcontainer tests and reintroduce Docker/
          # container contention on the single runner. Serial keeps the heavy suites from
          # overlapping; the SHARED RACE_BASE keeps both warm + isolated from the normal
          # build. (set -e stops on the first scope that races — same as the old two steps.)
          # Cascades runs FIRST: it is the cheap CPU-only scope, so a planner race is
          # reported in seconds instead of behind two testcontainer suites.
          RACE="bazelisk --output_base=$RACE_BASE --host_jvm_args=-Xmx3g test --@rules_go//go/config:race --test_tag_filters=-stress --test_output=errors --local_resources=memory=HOST_RAM*0.6"
          # Each scope writes its OWN event stream, and each scope's queried target
          # set is captured next to it, so the budget step below can say which
          # target used how much of which budget. One shared .bazel-bep.jsonl (the
          # .bazelrc default) would be truncated by the next invocation and the
          # first two scopes would go unmeasured.
          for s in cascades:"$CASCADES_SCOPE" rel:"$REL_SCOPE" client:"$CLIENT_SCOPE"; do
            name="${s%%:*}"
            bazelisk --output_base="$RACE_BASE" --host_jvm_args=-Xmx3g \
              query "tests($(qexpr "${s#*:}"))" --output=xml --xml:default_values \
              > ".bazel-targets.race-$name.xml"
          done
          # `--` before the scope is load-bearing, not style: Bazel rejects a
          # negative target pattern that appears before the end-of-options marker
          # ("Invalid options syntax: -//pkg/..."), so REL_SCOPE's exclusion needs
          # it. Passing it for every scope keeps the three invocations identical.
          $RACE --build_event_json_file=.bazel-bep.race-cascades.jsonl -- $CASCADES_SCOPE
          $RACE --build_event_json_file=.bazel-bep.race-rel.jsonl -- $REL_SCOPE
          $RACE --build_event_json_file=.bazel-bep.race-client.jsonl -- $CLIENT_SCOPE

      - name: Race lane timeout budgets
        # Runs on success OR failure: a lane that just timed out is exactly the
        # lane whose budget report matters, and `if: success()` would withhold it
        # there. Skipped only when the race step never ran (Docker preflight
        # aborted), where there is no event stream to read.
        if: ${{ !cancelled() && steps.race.outcome != 'skipped' }}
        # THE POINT: a Bazel timeout tells you a suite outgrew its budget at the
        # moment that fact blocks the merge queue, and not one run earlier. The
        # action cache makes that worse rather than better — a master run that
        # executes 2 of its 25 gated targets (measured, run 30751175864) reports
        # green while measuring almost nothing, so the growth first becomes visible
        # on whichever PR happens to invalidate the cache. cmd/test-budget reads
        # this run's event streams, DROPS the cache hits (their duration belongs to
        # some earlier run on some earlier box), and reports while the target still
        # has headroom instead of after it has none.
        #
        # Two lines, deliberately: warn at 70%, fail at 90%. One line low enough to
        # give notice would sit on top of targets that are big but healthy —
        # //pkg/relational/conformance/rowdiff runs 659s of its 900s budget on
        # master, passing every time — and failing there would block PRs that
        # changed nothing, which is the disease, not the cure. One line high enough
        # to avoid that gives no notice at all. So the warning is the early signal
        # a human reads, and the failure is the last stop before a timeout.
        run: |
          for name in cascades rel client; do
            [ -f ".bazel-bep.race-$name.jsonl" ] || continue
            go run ./cmd/test-budget \
              -lane "race/$name" \
              -bep ".bazel-bep.race-$name.jsonl" \
              -targets ".bazel-targets.race-$name.xml" \
              -warn 0.70 -threshold 0.90
          done
