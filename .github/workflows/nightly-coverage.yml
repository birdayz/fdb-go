name: Nightly Coverage

on:
  schedule:
    # 2:00 AM UTC daily — before fuzz at 3:17
    - cron: '0 2 * * *'
  workflow_dispatch: # manual trigger

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  coverage:
    name: Coverage + Race + Bench
    runs-on: hetzner-fdb
    timeout-minutes: 60

    steps:
      - name: Check nightly window
        # A `schedule` trigger fires the WORKFLOW, but GitHub dispatches the
        # actual JOB whenever hetzner-fdb (our single self-hosted slot) is
        # free — a backlog (regular PR CI, or another nightly still running)
        # can delay that by hours, landing this 1h coverage+race+bench run
        # in the middle of the workday. The check MUST run here, as the
        # first step on the runner that was actually allocated, not in a
        # separate gate job before the queue: a pre-queue check passes at
        # dispatch time and is stale by the time this runner is finally
        # free hours later (codex, PR #445 round 1 — the first version of
        # this gate had exactly that bug). `workflow_dispatch` (manual "run
        # it now") always proceeds.
        id: window
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HOUR=$(date -u +%-H)
          # 00:00-07:00 UTC: generous margin past the 02:00 cron plus this
          # job's 60m timeout.
          if [ "$HOUR" -ge 0 ] && [ "$HOUR" -lt 7 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::this runner became available at ${HOUR}:00 UTC, outside the 00:00-07:00 nightly window (the self-hosted queue delayed dispatch) — skipping the rest of this job to protect daytime CI capacity; it fires again at tomorrow's scheduled time."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.window.outputs.ok == 'true'
        uses: actions/checkout@v5

      - name: Set up Go
        if: steps.window.outputs.ok == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Check Docker (else coverage + race silently no-op)
        if: steps.window.outputs.ok == 'true'
        # The coverage run and the race step below drive real FDB testcontainers;
        # without Docker every FDB test hits the allowed `FDB not available (no Docker)`
        # skip and the job reports SUCCESS with no coverage/race data (RFC-107). Fail
        # loudly so a green nightly coverage run always reflects real execution.
        run: |
          docker info >/dev/null 2>&1 || { echo "::error::Docker unavailable — coverage/race tests would skip (exit 0) and the gate would silently pass"; exit 1; }

      - name: Run tests with coverage
        if: steps.window.outputs.ok == 'true'
        id: coverage
        run: bazelisk coverage //... //cmd/fdb-stacktester/bindingtester:bindingtester_test --combined_report=lcov --test_summary=detailed

      - name: Race detector (FDB client + record layer)
        if: steps.window.outputs.ok == 'true'
        run: |
          bazelisk shutdown
          bazelisk --output_base=$HOME/.cache/bazel/_race_output_base \
            --host_jvm_args=-Xmx3g \
            test \
            //pkg/fdbgo/client:client_test \
            //pkg/fdbgo/fdb:fdb_test \
            //pkg/recordlayer:recordlayer_test \
            //pkg/recordlayer/chaos:chaos_test \
            //conformance:conformance_test \
            --@rules_go//go/config:race \
            --build_event_json_file=.bazel-bep.race.jsonl \
            --local_resources=memory=HOST_RAM*0.6 \
            --test_timeout=900 \
            --test_summary=detailed

      - name: Generate coverage report
        if: ${{ steps.window.outputs.ok == 'true' && !cancelled() && steps.coverage.outcome != 'skipped' }}
        run: |
          bazelisk build //cmd/test-report
          BAZEL_BIN=$(bazelisk info bazel-bin 2>/dev/null)
          LCOV=$(bazelisk info output_path 2>/dev/null)/_coverage/_coverage_report.dat
          BEP_ARGS=(.bazel-bep.jsonl)
          [ -f .bazel-bep.race.jsonl ] && BEP_ARGS+=(.bazel-bep.race.jsonl)
          if [ -f "$LCOV" ]; then
            "$BAZEL_BIN/cmd/test-report/test-report_/test-report" -coverage "$LCOV" "${BEP_ARGS[@]}" > test-report.html
          else
            "$BAZEL_BIN/cmd/test-report/test-report_/test-report" "${BEP_ARGS[@]}" > test-report.html
          fi
          echo "Report generated: $(grep 'stat-total' test-report.html | grep -oP '>\K\d+(?=</span>)') tests"

      - name: Upload coverage report to Hetzner Object Storage
        if: ${{ steps.window.outputs.ok == 'true' && !cancelled() && steps.coverage.outcome != 'skipped' }}
        continue-on-error: true
        env:
          S3_ACCESS_KEY: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.HETZNER_S3_SECRET_KEY }}
          S3_ENDPOINT: ${{ secrets.HETZNER_S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.HETZNER_S3_BUCKET }}
        run: |
          if [ -z "$S3_ACCESS_KEY" ]; then
            echo "S3 secrets not configured — skipping"
            exit 0
          fi
          if ! command -v mc &>/dev/null; then
            mkdir -p "$HOME/.local/bin"
            curl -fsSL https://dl.min.io/client/mc/release/linux-amd64/mc -o "$HOME/.local/bin/mc"
            chmod +x "$HOME/.local/bin/mc"
            export PATH="$HOME/.local/bin:$PATH"
          fi
          mc alias set hetzner "$S3_ENDPOINT" "$S3_ACCESS_KEY" "$S3_SECRET_KEY"
          mc cp test-report.html "hetzner/$S3_BUCKET/reports/coverage/latest.html"
          echo "Coverage report: https://${S3_BUCKET}.${S3_ENDPOINT#https://}/reports/coverage/latest.html"

      - name: Upload coverage report as artifact
        if: ${{ steps.window.outputs.ok == 'true' && !cancelled() && steps.coverage.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: test-report.html
          retention-days: 30

      - name: Fetch previous benchmark baseline
        # MUST run BEFORE the bench step's results overwrite master-latest.txt
        # below, so the comparison is last-nightly vs this-nightly.
        if: steps.window.outputs.ok == 'true'
        continue-on-error: true
        env:
          S3_ACCESS_KEY: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.HETZNER_S3_SECRET_KEY }}
          S3_ENDPOINT: ${{ secrets.HETZNER_S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.HETZNER_S3_BUCKET }}
        run: |
          # Never let a leftover file stand in for a fetch that did not happen —
          # the comparison step keys on this file's existence.
          rm -f bench-baseline.txt
          if [ -z "$S3_ACCESS_KEY" ]; then
            echo "S3 secrets not configured — no baseline to compare against"
            exit 0
          fi
          if ! command -v mc &>/dev/null; then
            mkdir -p "$HOME/.local/bin"
            curl -fsSL https://dl.min.io/client/mc/release/linux-amd64/mc -o "$HOME/.local/bin/mc"
            chmod +x "$HOME/.local/bin/mc"
            export PATH="$HOME/.local/bin:$PATH"
          fi
          mc alias set hetzner "$S3_ENDPOINT" "$S3_ACCESS_KEY" "$S3_SECRET_KEY"
          # First-ever run has no object yet — absent baseline is not an error.
          mc cp "hetzner/$S3_BUCKET/bench/master-latest.txt" bench-baseline.txt \
            || echo "no previous baseline in S3 (first run?)"

      - name: Run benchmarks
        if: steps.window.outputs.ok == 'true'
        run: just bench-ci

      - name: Compare against previous baseline (non-gating)
        # Closes the loop on a baseline that was previously WRITE-ONLY: every
        # nightly published bench/master-latest.txt and nothing ever read it, so
        # a drift had no consumer. This diffs last nightly against this one and
        # reports the deltas in the job summary.
        #
        # Deliberately NOT a gate. These binaries share a self-hosted runner with
        # FDB testcontainers and run at benchtime=1s; bench-report's own threshold
        # note puts single-iteration CI variance at 10-30%. A hard threshold on
        # that is a flake generator, and a flaky gate is worse than no gate. The
        # DETERMINISTIC half of benchmark health — did the timed work actually
        # succeed — is gated instead, inside the planner bench binaries
        # themselves (see `bench-ci` in the justfile).
        if: ${{ steps.window.outputs.ok == 'true' && !cancelled() }}
        continue-on-error: true
        run: |
          if [ ! -s bench-baseline.txt ]; then
            echo "no baseline fetched — skipping comparison"
            exit 0
          fi
          # bench-ci can now fail (the planner bench binaries gate); if it died
          # before writing results there is nothing to compare.
          if [ ! -s bench-results.txt ]; then
            echo "no current results — skipping comparison"
            exit 0
          fi
          bazelisk run //cmd/bench-report -- \
            -old "$PWD/bench-baseline.txt" -new "$PWD/bench-results.txt" > bench-delta.md
          {
            echo "## Benchmark delta vs previous nightly master"
            cat bench-delta.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results as artifact
        if: ${{ steps.window.outputs.ok == 'true' && !cancelled() && steps.coverage.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: bench-results
          path: bench-results.txt
          retention-days: 90

      - name: Upload master benchmark baseline
        if: steps.window.outputs.ok == 'true'
        continue-on-error: true
        env:
          S3_ACCESS_KEY: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.HETZNER_S3_SECRET_KEY }}
          S3_ENDPOINT: ${{ secrets.HETZNER_S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.HETZNER_S3_BUCKET }}
        run: |
          if [ -z "$S3_ACCESS_KEY" ]; then
            echo "S3 secrets not configured — skipping"
            exit 0
          fi
          if ! command -v mc &>/dev/null; then
            mkdir -p "$HOME/.local/bin"
            curl -fsSL https://dl.min.io/client/mc/release/linux-amd64/mc -o "$HOME/.local/bin/mc"
            chmod +x "$HOME/.local/bin/mc"
            export PATH="$HOME/.local/bin:$PATH"
          fi
          mc alias set hetzner "$S3_ENDPOINT" "$S3_ACCESS_KEY" "$S3_SECRET_KEY"
          mc cp bench-results.txt "hetzner/$S3_BUCKET/bench/master-latest.txt"
          echo "Uploaded master benchmark baseline"
