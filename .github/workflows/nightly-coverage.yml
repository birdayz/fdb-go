name: Nightly Coverage

on:
  schedule:
    # 2:00 AM UTC daily — before fuzz at 3:17
    - cron: '0 2 * * *'
  workflow_dispatch: # manual trigger

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  coverage:
    name: Coverage + Race + Bench
    runs-on: hetzner-fdb-vm
    # 150, not 60: this job took on the SQL conformance corpora under -race when
    # ci.yml's race lane gave them up (they starved the PR lane on an 8 GB box).
    # Measured, four cores: the corpus execution target alone is 1328s, and the
    # corpora step runs one target at a time on purpose. A 60-minute cap would
    # cancel the job mid-race and report it as infrastructure noise rather than
    # as the coverage it is.
    timeout-minutes: 150

    steps:
      - name: Check nightly window
        # A `schedule` trigger fires the WORKFLOW, but GitHub dispatches the
        # actual JOB whenever hetzner-fdb-vm (one of five self-hosted boxes) is
        # free — a backlog (regular PR CI, or another nightly still running)
        # can delay that by hours, landing this 1h coverage+race+bench run
        # in the middle of the workday. The check MUST run here, as the
        # first step on the runner that was actually allocated, not in a
        # separate gate job before the queue: a pre-queue check passes at
        # dispatch time and is stale by the time this runner is finally
        # free hours later (codex, PR #445 round 1 — the first version of
        # this gate had exactly that bug). `workflow_dispatch` (manual "run
        # it now") always proceeds.
        id: window
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The permitted band, declared as two explicit hours so it is
          # machine-readable: pkg/docscheck's TestNightlyWindowAdmitsMeasuredLandings
          # parses these and replays against them every job-allocation hour this net
          # has ever actually been given. WINDOW_START > WINDOW_END means the band
          # WRAPS midnight.
          #
          # Sized from measured allocation, not from the cron hour, which predicts
          # nothing: GitHub's own scheduled-trigger dispatch on this repo is late by
          # ~2-3.5h before the self-hosted queue is even consulted. This job has been
          # the healthiest of the nets, but the skid it was one bad night away from
          # has since happened — the observed allocation hours are 04,05,06,07,08 and
          # 22, and the superseded 00:00-10:00 bound discarded that 22:00 landing for
          # being "daytime". An evening is not a workday, and a non-wrapping band
          # cannot say so.
          WINDOW_START=18
          WINDOW_END=12
          HOUR=$(date -u +%-H)
          if [ "$WINDOW_START" -lt "$WINDOW_END" ]; then
            if [ "$HOUR" -ge "$WINDOW_START" ] && [ "$HOUR" -lt "$WINDOW_END" ]; then IN=1; else IN=0; fi
          else
            if [ "$HOUR" -ge "$WINDOW_START" ] || [ "$HOUR" -lt "$WINDOW_END" ]; then IN=1; else IN=0; fi
          fi
          if [ "$IN" -eq 1 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::this runner became available at ${HOUR}:00 UTC, outside the ${WINDOW_START}:00-${WINDOW_END}:00 window (the self-hosted queue delayed dispatch) — skipping the rest of this job to protect the workday CI slot; it fires again at tomorrow's scheduled time. No heartbeat is recorded, so nightly-reconcile.yml will fail if this repeats."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.window.outputs.ok == 'true'
        uses: actions/checkout@v5

      - name: Set up Go
        if: steps.window.outputs.ok == 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Check Docker (else coverage + race silently no-op)
        if: steps.window.outputs.ok == 'true'
        # `id` is load-bearing: the race steps below run on a RED coverage step
        # (a failing test must not cost the corpora their only raced run) but
        # must NOT run when this preflight failed, or they would skip their way
        # to exit 0 and re-open the exact hole this step exists to close.
        id: docker
        # The coverage run and the race step below drive real FDB testcontainers;
        # without Docker every FDB test hits the allowed `FDB not available (no Docker)`
        # skip and the job reports SUCCESS with no coverage/race data (RFC-107). Fail
        # loudly so a green nightly coverage run always reflects real execution.
        run: |
          docker info >/dev/null 2>&1 || { echo "::error::Docker unavailable — coverage/race tests would skip (exit 0) and the gate would silently pass"; exit 1; }

      - name: Run tests with coverage
        if: steps.window.outputs.ok == 'true'
        id: coverage
        run: bazelisk coverage //... //cmd/fdb-stacktester/bindingtester:bindingtester_test --combined_report=lcov --test_summary=detailed

      - name: Race detector (FDB client + record layer)
        # `!cancelled()`, not the implicit success(): the step immediately above
        # is `bazelisk coverage //...`, which runs these same packages
        # UNINSTRUMENTED. Under success() any red test anywhere in //... would
        # delete this lane's raced run of them for the night — the one run that
        # can find the race that made the test red. Gated on the Docker
        # preflight instead, which is the only upstream failure that would make
        # this step pass while executing nothing.
        if: ${{ steps.window.outputs.ok == 'true' && !cancelled() && steps.docker.outcome == 'success' }}
        run: |
          bazelisk shutdown
          bazelisk --output_base=$HOME/.cache/bazel/_race_output_base \
            --host_jvm_args=-Xmx3g \
            test \
            //pkg/fdbgo/client:client_test \
            //pkg/fdbgo/fdb:fdb_test \
            //pkg/recordlayer:recordlayer_test \
            //pkg/recordlayer/chaos:chaos_test \
            //conformance:conformance_test \
            --@rules_go//go/config:race \
            --build_event_json_file=.bazel-bep.race.jsonl \
            --local_resources=memory=HOST_RAM*0.6 \
            --test_timeout=900 \
            --test_summary=detailed

      - name: Race detector (SQL conformance corpora)
        # Same condition, same reason as the race step above: this lane is the
        # corpora's ONLY raced run, and success() would hand a red `bazelisk
        # coverage //...` the power to delete it for the night.
        if: ${{ steps.window.outputs.ok == 'true' && !cancelled() && steps.docker.outcome == 'success' }}
        # These are the targets the PR race lane deliberately does NOT carry
        # (ci.yml's REL_SCOPE subtracts them). RFC-107 §3 made that scoping call
        # for //pkg/fdbgo/... on measured-latency grounds — race-instrumented
        # Docker/cgo suites become the PR lane's entire cost — and the relational
        # wildcard has since grown into the same class. Nightly is where these
        # targets still get the detector, so the exclusion moves the cost off the
        # merge queue rather than dropping the coverage.
        #
        # --local_test_jobs=1, not the .bazelrc default of 4: measured under -race
        # on four cores, the corpus execution target runs 5000 scenarios in 1328s
        # and is by far the heaviest resident set here. Four of these at once on a
        # 7.6 GB box is what put a 31s target (plandiff) past its 900s timeout on
        # PR #577 — the runner was out of headroom and everything starved. One at
        # a time, each target gets the machine and reports its own runtime rather
        # than the queue's.
        #
        # Timeouts come from the same four slots .bazelrc declares, NOT the flat
        # --test_timeout=900 the step above uses: the corpus target is `eternal` on
        # purpose and a flat 900 would fail it by fiat, which is a budget lie, not
        # a budget.
        run: |
          bazelisk --output_base=$HOME/.cache/bazel/_race_output_base \
            --host_jvm_args=-Xmx3g \
            test //pkg/relational/conformance/... \
            --@rules_go//go/config:race \
            --build_event_json_file=.bazel-bep.race-corpora.jsonl \
            --local_resources=memory=HOST_RAM*0.6 \
            --local_test_jobs=1 \
            --test_timeout=60,300,900,3600 \
            --test_summary=detailed

      - name: Corpora race budgets
        # This lane is now the corpora's only instrumented run, so it is where
        # their growth has to be visible. Measured on four cores at 5000
        # scenarios, the worst target here sits at 37% of its budget; the gate
        # annotates at 70% and fails at 90%, which is the last point at which
        # failing is cheaper than timing out. Same slot values as the run above,
        # or the tool would judge against budgets Bazel did not enforce.
        if: ${{ steps.window.outputs.ok == 'true' && !cancelled() }}
        run: |
          # Same guard the race lane's budget step carries. This step is not
          # success()-gated, so it also runs when the race step above was skipped
          # or died before Bazel wrote its event stream; without this, an absent
          # upstream surfaces as `read bep: no such file or directory` and exit 2
          # — a tool crash standing in for the real story.
          if [ ! -f .bazel-bep.race-corpora.jsonl ]; then
            echo "::warning::no corpora race event stream — the race step did not run to the point of writing one; no budgets to report"
            exit 0
          fi
          bazelisk --output_base=$HOME/.cache/bazel/_race_output_base --host_jvm_args=-Xmx3g \
            query 'tests(//pkg/relational/conformance/...)' --output=xml --xml:default_values \
            > .bazel-targets.race-corpora.xml
          go run ./cmd/test-budget -lane nightly/corpora \
            -bep .bazel-bep.race-corpora.jsonl \
            -targets .bazel-targets.race-corpora.xml \
            -timeouts 60,300,900,3600 -warn 0.70 -threshold 0.90

      - name: Generate coverage report
        if: ${{ steps.window.outputs.ok == 'true' && !cancelled() && steps.coverage.outcome != 'skipped' }}
        run: |
          bazelisk build //cmd/test-report
          BAZEL_BIN=$(bazelisk info bazel-bin 2>/dev/null)
          LCOV=$(bazelisk info output_path 2>/dev/null)/_coverage/_coverage_report.dat
          BEP_ARGS=(.bazel-bep.jsonl)
          [ -f .bazel-bep.race.jsonl ] && BEP_ARGS+=(.bazel-bep.race.jsonl)
          if [ -f "$LCOV" ]; then
            "$BAZEL_BIN/cmd/test-report/test-report_/test-report" -coverage "$LCOV" "${BEP_ARGS[@]}" > test-report.html
          else
            "$BAZEL_BIN/cmd/test-report/test-report_/test-report" "${BEP_ARGS[@]}" > test-report.html
          fi
          echo "Report generated: $(grep 'stat-total' test-report.html | grep -oP '>\K\d+(?=</span>)') tests"

      - name: Upload coverage report to Hetzner Object Storage
        if: ${{ steps.window.outputs.ok == 'true' && !cancelled() && steps.coverage.outcome != 'skipped' }}
        continue-on-error: true
        env:
          S3_ACCESS_KEY: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.HETZNER_S3_SECRET_KEY }}
          S3_ENDPOINT: ${{ secrets.HETZNER_S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.HETZNER_S3_BUCKET }}
        run: |
          if [ -z "$S3_ACCESS_KEY" ]; then
            echo "S3 secrets not configured — skipping"
            exit 0
          fi
          if ! command -v mc &>/dev/null; then
            mkdir -p "$HOME/.local/bin"
            curl -fsSL https://dl.min.io/client/mc/release/linux-amd64/mc -o "$HOME/.local/bin/mc"
            chmod +x "$HOME/.local/bin/mc"
            export PATH="$HOME/.local/bin:$PATH"
          fi
          mc alias set hetzner "$S3_ENDPOINT" "$S3_ACCESS_KEY" "$S3_SECRET_KEY"
          mc cp test-report.html "hetzner/$S3_BUCKET/reports/coverage/latest.html"
          echo "Coverage report: https://${S3_BUCKET}.${S3_ENDPOINT#https://}/reports/coverage/latest.html"

      - name: Upload coverage report as artifact
        if: ${{ steps.window.outputs.ok == 'true' && !cancelled() && steps.coverage.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: test-report.html
          retention-days: 30

      - name: Fetch previous benchmark baseline
        # MUST run BEFORE the bench step's results overwrite master-latest.txt
        # below, so the comparison is last-nightly vs this-nightly.
        if: steps.window.outputs.ok == 'true'
        continue-on-error: true
        env:
          S3_ACCESS_KEY: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.HETZNER_S3_SECRET_KEY }}
          S3_ENDPOINT: ${{ secrets.HETZNER_S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.HETZNER_S3_BUCKET }}
        run: |
          # Never let a leftover file stand in for a fetch that did not happen —
          # the comparison step keys on this file's existence.
          rm -f bench-baseline.txt
          if [ -z "$S3_ACCESS_KEY" ]; then
            echo "S3 secrets not configured — no baseline to compare against"
            exit 0
          fi
          if ! command -v mc &>/dev/null; then
            mkdir -p "$HOME/.local/bin"
            curl -fsSL https://dl.min.io/client/mc/release/linux-amd64/mc -o "$HOME/.local/bin/mc"
            chmod +x "$HOME/.local/bin/mc"
            export PATH="$HOME/.local/bin:$PATH"
          fi
          mc alias set hetzner "$S3_ENDPOINT" "$S3_ACCESS_KEY" "$S3_SECRET_KEY"
          # First-ever run has no object yet — absent baseline is not an error.
          mc cp "hetzner/$S3_BUCKET/bench/master-latest.txt" bench-baseline.txt \
            || echo "no previous baseline in S3 (first run?)"

      - name: Run benchmarks
        if: steps.window.outputs.ok == 'true'
        run: just bench-ci

      - name: Compare against previous baseline (non-gating)
        # Closes the loop on a baseline that was previously WRITE-ONLY: every
        # nightly published bench/master-latest.txt and nothing ever read it, so
        # a drift had no consumer. This diffs last nightly against this one and
        # reports the deltas in the job summary.
        #
        # Deliberately NOT a gate. These binaries share a self-hosted runner with
        # FDB testcontainers and run at benchtime=1s; bench-report's own threshold
        # note puts single-iteration CI variance at 10-30%. A hard threshold on
        # that is a flake generator, and a flaky gate is worse than no gate. The
        # DETERMINISTIC half of benchmark health — did the timed work actually
        # succeed — is gated instead, inside the planner bench binaries
        # themselves (see `bench-ci` in the justfile).
        if: ${{ steps.window.outputs.ok == 'true' && !cancelled() }}
        continue-on-error: true
        run: |
          if [ ! -s bench-baseline.txt ]; then
            echo "no baseline fetched — skipping comparison"
            exit 0
          fi
          # bench-ci can now fail (the planner bench binaries gate); if it died
          # before writing results there is nothing to compare.
          if [ ! -s bench-results.txt ]; then
            echo "no current results — skipping comparison"
            exit 0
          fi
          bazelisk run //cmd/bench-report -- \
            -old "$PWD/bench-baseline.txt" -new "$PWD/bench-results.txt" > bench-delta.md
          {
            echo "## Benchmark delta vs previous nightly master"
            cat bench-delta.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results as artifact
        if: ${{ steps.window.outputs.ok == 'true' && !cancelled() && steps.coverage.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: bench-results
          path: bench-results.txt
          retention-days: 90

      - name: Upload master benchmark baseline
        if: steps.window.outputs.ok == 'true'
        continue-on-error: true
        env:
          S3_ACCESS_KEY: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.HETZNER_S3_SECRET_KEY }}
          S3_ENDPOINT: ${{ secrets.HETZNER_S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.HETZNER_S3_BUCKET }}
        run: |
          if [ -z "$S3_ACCESS_KEY" ]; then
            echo "S3 secrets not configured — skipping"
            exit 0
          fi
          if ! command -v mc &>/dev/null; then
            mkdir -p "$HOME/.local/bin"
            curl -fsSL https://dl.min.io/client/mc/release/linux-amd64/mc -o "$HOME/.local/bin/mc"
            chmod +x "$HOME/.local/bin/mc"
            export PATH="$HOME/.local/bin:$PATH"
          fi
          mc alias set hetzner "$S3_ENDPOINT" "$S3_ACCESS_KEY" "$S3_SECRET_KEY"
          mc cp bench-results.txt "hetzner/$S3_BUCKET/bench/master-latest.txt"
          echo "Uploaded master benchmark baseline"

      - name: Record genuine-run heartbeat
        # The window gate above can skip every real step and still exit SUCCESS.
        # This file is written ONLY when the coverage run actually executed, and
        # nightly-reconcile.yml fails when its timestamp goes stale. Keyed to the
        # coverage step, the job's mandatory first piece of real work. The
        # condition deliberately does NOT require success — a red coverage/race run
        # is the net WORKING; the heartbeat answers "did it run", the job
        # conclusion answers "did it pass".
        if: ${{ steps.window.outputs.ok == 'true' && !cancelled() && steps.coverage.outcome != 'skipped' }}
        run: |
          {
            echo "net=coverage"
            echo "ran_at=$(date -u +%FT%TZ)"
            echo "run_id=${{ github.run_id }}"
            echo "sha=${{ github.sha }}"
            echo "outcome=${{ steps.coverage.outcome }}"
          } | tee nightly-heartbeat.txt

      - name: Upload genuine-run heartbeat
        if: ${{ steps.window.outputs.ok == 'true' && !cancelled() && steps.coverage.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        # if-no-files-found: error, NOT ignore — a heartbeat that silently fails to
        # upload reproduces the very silence this mechanism exists to break.
        with:
          name: nightly-heartbeat-coverage
          path: nightly-heartbeat.txt
          retention-days: 90
          if-no-files-found: error
