# Build website/ with Hugo and deploy to GitHub Pages (fdb.dev).
# Prep now; effective once the repo is public and Pages source is set to "GitHub Actions".
name: Deploy website (fdb.dev)

on:
  push:
    branches: ["master"]
    paths:
      - "website/**"
      - "CHANGELOG.md"
      - ".github/workflows/website.yml"
      # A new/removed nested Go module changes which vanity-import stubs the site must
      # serve, so it has to trigger a redeploy even when nothing under website/ changed.
      - "**/go.mod"
      - "scripts/gen-vanity-modules.sh"
  # The site carries master's test report (fdb.dev/reports/latest.html, the README badge),
  # so each finished master CI run redeploys it.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read # download CI's test-report artifact

# One deployment at a time; let in-flight runs finish.
concurrency:
  group: "pages"
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    # Only master pushes publish a report; a PR's CI run keeps it as a GitHub artifact.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: "0.162.0"
    steps:
      - name: Install Hugo CLI (extended)
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
      - name: Checkout
        uses: actions/checkout@v5
      - name: Sync changelog (single source of truth)
        run: |
          {
            printf -- '---\ntitle: Changelog\ntoc: true\n---\n\n'
            cat CHANGELOG.md
          } > website/content/changelog.md
      - name: Derive vanity-import module roots (single source of truth)
        # Via `bash`, not as an executable — core.fileMode=false in this repo means a
        # chmod +x silently never reaches the index. See the same note in ci.yml.
        run: bash scripts/gen-vanity-modules.sh
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build
        env:
          HUGO_ENVIRONMENT: production
          HUGO_CACHEDIR: "${{ runner.temp }}/hugo_cache"
        run: hugo --source website --gc --minify --baseURL "https://fdb.dev/"
      - name: Check website
        run: |
          python3 website/check.py website/public
          python3 -B -m unittest discover -s website -p 'check_test.py'
      # Pages replaces the whole site on each deploy, so every build re-adds the newest
      # report from a finished master push run; a run without one (cancelled) is skipped.
      - name: Add master's latest test report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          dir="${{ runner.temp }}/report"
          for id in $(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=master&event=push&status=completed&per_page=20" --jq '.workflow_runs[].id'); do
            if gh run download "$id" -R "$GITHUB_REPOSITORY" -n test-report -D "$dir" 2>/dev/null; then
              install -D -m 0644 "$dir/test-report.html" website/public/reports/latest.html
              echo "Published the test report of CI run $id"
              exit 0
            fi
          done
          echo "::warning::no master CI run among the last 20 has a test-report artifact; publishing without one"
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
