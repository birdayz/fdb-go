# Build website/ with Hugo and deploy to GitHub Pages (fdb.dev).
# Prep now; effective once the repo is public and Pages source is set to "GitHub Actions".
name: Deploy website (fdb.dev)

on:
  push:
    branches: ["master"]
    paths:
      - "website/**"
      - "docs/benchmarks/**"
      - "CHANGELOG.md"
      - ".github/workflows/website.yml"
      # A new/removed nested Go module changes which vanity-import stubs the site must
      # serve, so it has to trigger a redeploy even when nothing under website/ changed.
      - "**/go.mod"
      - "scripts/gen-vanity-modules.sh"
      - "scripts/sync-website-benchmarks.py"
  # The site carries master's test report (fdb.dev/reports/latest.html, the README badge),
  # so each finished master CI run redeploys it.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read # download CI's test-report artifact

# One deployment at a time; let in-flight runs finish. Runs whose build is skipped (see
# build's `if`) get their own group, so they cannot displace a queued real deploy.
concurrency:
  group: ${{ github.event_name == 'workflow_run' && (github.event.workflow_run.event != 'push' || github.event.workflow_run.head_repository.full_name != github.repository) && format('pages-noop-{0}', github.run_id) || 'pages' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    # Only master pushes publish a report; a PR's CI run keeps it as a GitHub artifact.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: "0.162.0"
    steps:
      - name: Install Hugo CLI (extended)
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
      - name: Checkout
        uses: actions/checkout@v5
      - name: Sync changelog (single source of truth)
        run: |
          {
            printf -- '---\ntitle: Changelog\ntoc: true\n---\n\n'
            cat CHANGELOG.md
          } > website/content/changelog.md
      - name: Sync benchmark campaign pages (single source of truth)
        run: python3 scripts/sync-website-benchmarks.py
      - name: Derive vanity-import module roots (single source of truth)
        # Via `bash`, not as an executable — core.fileMode=false in this repo means a
        # chmod +x silently never reaches the index. See the same note in ci.yml.
        run: bash scripts/gen-vanity-modules.sh
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build
        env:
          HUGO_ENVIRONMENT: production
          HUGO_CACHEDIR: "${{ runner.temp }}/hugo_cache"
        run: hugo --source website --gc --minify --baseURL "https://fdb.dev/"
      - name: Check website
        run: |
          python3 website/check.py website/public
          python3 -B -m unittest discover -s website -p 'check_test.py'
      # Pages replaces the whole site on each deploy, so every build re-adds the newest
      # report from a finished master push run (cancelled runs have none).
      - name: Add master's latest test report
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=website/public/reports/latest.html
          ids=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=master&event=push&status=completed&per_page=100" --jq '.workflow_runs[].id')
          for id in $ids; do
            n=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$id/artifacts?name=test-report" --jq '[.artifacts[] | select(.expired | not)] | length')
            [ "$n" -gt 0 ] || continue
            gh run download "$id" -R "$GITHUB_REPOSITORY" -n test-report -D "${{ runner.temp }}/report"
            install -D -m 0644 "${{ runner.temp }}/report/test-report.html" "$out"
            echo "Published the test report of CI run $id"
            exit 0
          done
          # None in reach (a long cancelled streak, or all expired after 30 days): keep the live one.
          if curl -fsSL --create-dirs -o "$out" https://fdb.dev/reports/latest.html; then
            echo "::warning::no master test-report artifact in the last 100 runs; kept the live report"
            exit 0
          fi
          rm -f "$out"
          # Pages replaces the whole site, so every event must preserve the published report.
          echo "::error::no master test report to publish"
          exit 1
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
