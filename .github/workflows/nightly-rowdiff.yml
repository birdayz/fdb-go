name: Nightly RowDiff

# RFC-182's generative row-soundness differential harness runs 25 seeds in the
# PR suite — enough to keep the plan-family templates honest, nowhere near
# enough to find anything. RFC-183's exit criteria ask for >=50k seeds; this
# job is where that scale actually happens.
#
# Seed budget (10k). The previous 18k was sized against an ESTIMATED ~1.5
# seeds/s and never fit. MEASURED on this runner, from the healthy prefix of
# four consecutive nights (seeds walked before the cluster died, over the
# elapsed time from the `random_seeds` RUN line to the first INFRA line):
#
#   run 31350088492  1909 seeds / 2040s = 0.94/s
#   run 31290367277  2111 seeds / 2057s = 1.03/s
#   run 31234733111  2235 seeds / 2087s = 1.07/s
#   run 31143737482  2304 seeds / 2007s = 1.15/s
#
# So ~1.05 seeds/s, not 1.5. At that rate 18000 seeds needs 4h46m against what
# was a 4h50m timeout — four minutes of margin, i.e. the sweep was structurally
# unable to finish and one slow night from timing out even with a perfectly
# healthy cluster. It never did finish: it timed out on six consecutive nights.
#
# THE CLOCK SIZES THE NIGHT, NOT THE SEED COUNT. 15000 is a CEILING, and
# ROWDIFF_BUDGET is what actually ends the sweep; running out of clock is a
# normal termination that logs its coverage rather than failing. This is
# deliberate, because every seed count picked here has a short shelf life: when
# the nested case family landed, the paged lane's per-seed cost moved 3.73x
# (measured back-to-back on one tree: un-paged 0.864 seeds/s, paged 0.232), and
# any absolute number chosen against last week's generator is wrong after the
# next one. A clock is not.
#
# What keeps that honest is ROWDIFF_MIN_SEEDS, the per-lane coverage FLOOR: a
# truncated night is fine, a night that measured almost nothing is not, and
# without a floor a tenfold cost regression would walk 200 seeds and report
# green forever. The floor is per lane because per-seed cost is — one number
# sized for the fast lane fails the slow one for doing its job.
#
# It does NOT gate PRs (far too heavy); a red run here is a release blocker,
# surfaced like the nightly-fuzz and nightly-stress failures.
#
# The 25-seed smoke slice being all anyone ran is exactly how 27 seeds stayed
# red on master unnoticed (an oracle false positive on int64 SUM overflow under
# HAVING, fixed in 288f9be15). A safety net nobody runs at scale measures the
# first 25 seeds and nothing else.
on:
  schedule:
    # 00:17 UTC daily — an off-minute, early in the nightly window so the
    # ~3h sweep finishes well before the 04:23 stress job wants the runner.
    - cron: '17 0 * * *'
  workflow_dispatch:
    inputs:
      seeds:
        description: 'Seed count (default 10000; measured ~1.05 seeds/s on this runner)'
        required: false
        default: '15000'
      seed_start:
        description: 'First seed (default: rotated by day-of-year)'
        required: false

jobs:
  rowdiff:
    name: RowDiff deep sweep (row soundness vs the oracle)
    runs-on: hetzner-fdb-vm
    timeout-minutes: 300

    steps:
      - name: Check nightly window
        # Same reasoning as nightly-stress: a `schedule` trigger fires the
        # WORKFLOW, but GitHub dispatches the JOB whenever hetzner-fdb-vm (one
        # of the self-hosted boxes) frees up, which a backlog can delay by
        # hours — landing a ~4h sweep in the middle of the workday. The check
        # MUST run here, as the first step on the runner actually allocated;
        # a pre-queue gate passes at dispatch time and is stale by the time
        # this runner is free. `workflow_dispatch` always proceeds.
        id: window
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The permitted band, declared as two explicit hours so it is
          # machine-readable: pkg/docscheck's TestNightlyWindowAdmitsMeasuredLandings
          # parses these and replays against them every job-allocation hour this net
          # has ever actually been given. WINDOW_START > WINDOW_END means the band
          # WRAPS midnight.
          #
          # The band is sized from measured allocation, not from the cron hour, which
          # predicts nothing: GitHub's own scheduled-trigger dispatch on this repo is
          # late by ~2-3.5h before the self-hosted queue is even consulted, and the
          # original 00:00-02:00 bound was unreachable by construction — ten
          # consecutive nights exited green having compared zero rows.
          #
          # The wrap is the correction the 00:00-08:00 replacement declined to make,
          # on the reasoning that a midnight-crossing comparison was "an extra branch
          # for no gain". The gain is measurable: allocation hours observed over this
          # job's scheduled history are 03,04 and 20, and the 20:00 landing was
          # discarded as "daytime". An evening is not a workday. 18:00-12:00 admits
          # all three, and the ~4h sweep still finishes before the excluded block.
          WINDOW_START=18
          WINDOW_END=12
          HOUR=$(date -u +%-H)
          if [ "$WINDOW_START" -lt "$WINDOW_END" ]; then
            if [ "$HOUR" -ge "$WINDOW_START" ] && [ "$HOUR" -lt "$WINDOW_END" ]; then IN=1; else IN=0; fi
          else
            if [ "$HOUR" -ge "$WINDOW_START" ] || [ "$HOUR" -lt "$WINDOW_END" ]; then IN=1; else IN=0; fi
          fi
          if [ "$IN" -eq 1 ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::this runner became available at ${HOUR}:00 UTC, outside the ${WINDOW_START}:00-${WINDOW_END}:00 window for this ~4h sweep (the self-hosted queue delayed dispatch) — skipping to protect the workday CI slot; it fires again at tomorrow's scheduled time. No heartbeat is recorded, so nightly-reconcile.yml will fail if this repeats."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.window.outputs.ok == 'true'
        uses: actions/checkout@v5

      - name: Check Docker (mandatory — else the gate silently no-ops)
        if: steps.window.outputs.ok == 'true'
        # TestFDB_RowDiff_Smoke takes the allowed `FDB not available (no
        # Docker)` skip when there is no container, so without Docker the
        # `bazelisk test` below reports SUCCESS having compared ZERO rows.
        # Fail loudly here instead, so a green run always means the sweep
        # actually executed.
        run: |
          docker info >/dev/null 2>&1 || { echo "::error::Docker unavailable — the rowdiff sweep would skip (exit 0) and the gate would silently pass with no coverage"; exit 1; }

      - name: Resolve seed range
        if: steps.window.outputs.ok == 'true'
        id: seeds
        # ROTATE the start seed. Re-walking the same window every night
        # re-proves what last night already proved; the generator's space is
        # effectively unbounded, so fresh ranges are free coverage. Day-of-year
        # gives a deterministic, non-overlapping window per night that a
        # failure report can name exactly ("seeds 2500001..2550000") and anyone
        # can replay with ROWDIFF_SEED_START.
        run: |
          SEEDS="${{ github.event.inputs.seeds }}"
          SEEDS="${SEEDS:-15000}"
          START="${{ github.event.inputs.seed_start }}"
          if [ -z "$START" ]; then
            DOY=$(date -u +%-j)
            START=$(( 1 + DOY * SEEDS ))
          fi
          echo "seeds=$SEEDS" >> "$GITHUB_OUTPUT"
          echo "start=$START" >> "$GITHUB_OUTPUT"
          echo "Sweeping seeds $START..$(( START + SEEDS - 1 )) ($SEEDS seeds)"

      - name: Run rowdiff deep sweep
        if: steps.window.outputs.ok == 'true'
        id: sweep
        # pipefail is REQUIRED: GitHub Actions runs `bash -e` but NOT pipefail,
        # so `bazelisk test … | tee` would return tee's exit (0) and SILENTLY
        # PASS a red sweep — the cardinal CI sin.
        #
        # ROWDIFF_BUDGET is the CONTROL; --test_timeout is only the backstop, and
        # the gap between them is deliberate. MEASURED (runs 31350088492 and five
        # nights either side): when the FDB container died mid-sweep, every
        # remaining seed spent a full 60s deadline in a TCP connect to a dead
        # address, so the sweep could only end by timeout — and the Go alarm's
        # SIGQUIT killed the process before the tally or the vacuity floor, both
        # of which run after the seed loop, could print anything. The 4h50m log
        # contains no ROWDIFF_TALLY line at all. A budget that fires INSIDE the
        # test stops the loop, reports the coverage actually achieved, and names
        # the cause; a Bazel timeout can only kill.
        #
        # 3h30m against a 4h backstop: 10000 seeds at the worst measured rate is
        # 2h57m, so the budget has headroom for a normal night and still leaves
        # the backstop 30 minutes clear of it. The old 17400s (4h50m) was not
        # sized against anything — it was one wedge silently costing ~5 hours of
        # a two-runner fleet before anyone noticed CI had gone quiet. The INFRA
        # circuit breaker in the test is what actually catches THIS failure, in
        # ~10 minutes rather than ~5 hours; the budget catches the other one, a
        # range that genuinely outgrew its slot.
        run: |
          set -o pipefail
          bazelisk test //pkg/relational/sqldriver:sqldriver_test \
            --test_output=streamed \
            --test_arg="--test.run=TestFDB_RowDiff_Smoke" \
            --test_arg="--test.v" \
            --test_timeout=14400 \
            --nocache_test_results \
            --test_env=ROWDIFF_BUDGET=3h30m \
            --test_env=ROWDIFF_MIN_SEEDS=2000 \
            --test_env=ROWDIFF_SEEDS=${{ steps.seeds.outputs.seeds }} \
            --test_env=ROWDIFF_SEED_START=${{ steps.seeds.outputs.start }} \
            2>&1 | tee rowdiff-output.txt

      - name: Run rowdiff PAGING sweep
        # `!cancelled()` rather than the default "skip if a previous step failed".
        # The two sweeps test DIFFERENT properties — un-paged row soundness and
        # continuation soundness across a page boundary — so a red un-paged sweep
        # is no reason to learn nothing about continuations. MEASURED: on every
        # night from 2026-08-05 to 2026-08-10 the un-paged step timed out and this
        # step reported `skipped`, so the paging gate contributed ZERO coverage for
        # six consecutive nights while the job still recorded a genuine-run
        # heartbeat — nightly-reconcile saw a live net over a half that never ran.
        # Running it unconditionally is now cheap even on a dead cluster: the
        # INFRA circuit breaker stops it in ~10 minutes instead of its full budget.
        if: ${{ !cancelled() && steps.window.outputs.ok == 'true' }}
        id: paging
        # Paging mode (a small scanned-rows limit forces INTERNAL paging) tests
        # CONTINUATION soundness generatively — resume across a page boundary
        # must return the rows a single-pass run does — the class BUG C
        # (paginated DISTINCT re-admission) belonged to, which the un-paged sweep
        # above cannot reach (its 20..120-row cases fit in one page). Fewer seeds
        # than the un-paged sweep over a fresh, disjoint range (+5e8) so it is
        # free coverage, not a re-walk.
        #
        # Seed count sized from a MEASURED ratio, because this step has never
        # actually executed in CI — it reported `skipped` on every night of its
        # recorded history, so there is no nightly throughput for it and the old
        # "~2.5x slower, ~58min for 5000 seeds" was an estimate resting on
        # nothing. Measured back-to-back on one box (25 seeds each, same tree):
        # un-paged 42.1s = 0.593 seeds/s, paged 75.1s = 0.333 seeds/s, so paging
        # costs 1.78x per seed, not 2.5x. Against the un-paged rate measured on
        # the runner (~1.05 seeds/s) that puts paging at ~0.59 seeds/s there, so
        # the old 5000 seeds would have needed ~2h21m — over double its budget
        # and over triple the ~58min claimed. 2000 seeds is ~57min at that rate,
        # inside the 70m ROWDIFF_BUDGET, and the whole job lands near 3h36m.
        # The RATIO is what transfers between boxes; the absolute local rates do
        # not, and are not used as anything but the ratio's two terms.
        # pipefail as above: else `| tee` masks a red sweep.
        run: |
          set -o pipefail
          PSTART=$(( ${{ steps.seeds.outputs.start }} + 500000000 ))
          echo "Paging-sweeping seeds $PSTART..$(( PSTART + 5000 - 1 )) (5000 seeds ceiling, scanLimit=4)"
          bazelisk test //pkg/relational/sqldriver:sqldriver_test \
            --test_output=streamed \
            --test_arg="--test.run=TestFDB_RowDiff_Paging" \
            --test_arg="--test.v" \
            --test_timeout=5400 \
            --nocache_test_results \
            --test_env=ROWDIFF_BUDGET=70m \
            --test_env=ROWDIFF_MIN_SEEDS=500 \
            --test_env=ROWDIFF_SEEDS=5000 \
            --test_env=ROWDIFF_SEED_START=$PSTART \
            2>&1 | tee rowdiff-paging-output.txt

      - name: Capture FDB container forensics
        # The sweep's FDB testcontainer dies partway through EVERY night this job
        # has run, and this step exists to name the mechanism the next time it
        # does. Runs on success or failure — a healthy night's output is the
        # control the failing night is read against — and before any cleanup, so
        # the exited container is still inspectable.
        #
        # MEASURED across eight nights on FIVE distinct runners, elapsed from the
        # `random_seeds` RUN line to the first `WARN fdbgo: connection to server
        # failed`: 31m39s, 32m46s, 31m31s, 32m27s, 33m47s, 33m17s, ~34m00s,
        # 31m45s — mean 1959s, sigma ~55s (2.8%). Five hosts holding 2.8% is a
        # software-deterministic failure, not a wedged box; and it tracks ELAPSED
        # TIME rather than seeds walked (which vary 20% across the same nights).
        #
        # What it is NOT, each ruled out with evidence: Ryuk reaping (the
        # Reaper.connect goroutine is alive in the 4h50m dump, and its timeouts
        # are 1m/10s, not 33m); the client giving up (topology.go polls every 5s
        # forever, and a FRESH dial is what hangs); the memory storage engine
        # filling (KeyValueStoreMemory returns Never() on out-of-space, it does
        # not exit, and measured growth needs ~10h to reach the limit); an fd
        # leak (23 fds against a 1024 soft limit).
        #
        # What IS established is the shape: the container EXITS and its bridge IP
        # then blackholes — which matches the CI stack blocking in
        # net.(*netFD).connect rather than getting an RST, because a live
        # container with a dead process would refuse the connection. An exit of
        # that shape was reproduced deliberately by filling the data tmpfs:
        # fdbserver logs `Fatal Error: Disk i/o operation failed` and traces
        # `SharedTLogFailed`/`io_error`/1510, then `StopAfterError`, and the
        # container exits 1 with **OOMKilled=false** — which is exactly why an
        # OOM check has never explained this.
        #
        # NO MECHANISM IS ESTABLISHED for why that happens on the runner, and
        # this comment says so rather than implying one. The two memory stories
        # that fit the signature were both measured and both REFUTED: the
        # size-less tmpfs does not grow into its ~3872 MB ceiling (~130 MB at the
        # death point, and pinning it to the CI size changed nothing), and host
        # exhaustion does not arrive in time (summed consumers reach ~52% of
        # 7745 MB at t+33min, ~217 minutes short). Which is the point of dumping
        # forensics instead of arguing: read the exit state, do not infer it.
        #
        # These three outcomes are distinguishable and this dump separates them:
        #   exit 1  + StopAfterError/io_error/1510 -> tmpfs ENOSPC
        #   exit 137 + OOMKilled=true              -> kernel OOM-kill
        #   exit 143 + no fatal trace              -> stopped externally
        # `|| true` throughout: forensics must never turn a green sweep red.
        if: ${{ !cancelled() && steps.window.outputs.ok == 'true' }}
        run: |
          {
            echo "=== host ==="; free -m || true; df -h || true
            journalctl -k --since "-6h" 2>/dev/null | grep -iE "oom|killed process" | tail -40 || true
            echo "=== containers (including exited) ==="
            docker ps -a --format '{{.ID}} {{.Image}} {{.Status}} {{.Names}}' || true
            for c in $(docker ps -aq --filter ancestor=foundationdb/foundationdb:7.3.77); do
              echo "=== inspect $c ==="
              docker inspect "$c" --format 'exit={{.State.ExitCode}} oom={{.State.OOMKilled}} err={{.State.Error}} restarts={{.RestartCount}} started={{.State.StartedAt}} finished={{.State.FinishedAt}}' || true
              echo "=== docker logs $c (tail) ==="
              docker logs --tail 80 "$c" 2>&1 || true
              echo "=== fdbserver Severity=40 trace events $c ==="
              docker exec "$c" sh -c 'grep -ho "Severity=\"40\"[^>]*" /var/fdb/logs/*.xml 2>/dev/null | tail -40' 2>/dev/null || true
              echo "=== container disk $c ==="
              docker exec "$c" df -h /var/fdb/data 2>/dev/null || true
            done
          } > fdb-forensics.txt 2>&1 || true
          tail -200 fdb-forensics.txt || true

      - name: Upload FDB container forensics
        if: ${{ !cancelled() && steps.window.outputs.ok == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: rowdiff-fdb-forensics
          path: fdb-forensics.txt
          if-no-files-found: warn

      - name: Report sweep summary
        # Runs on success OR failure, but not when the sweep step was skipped
        # (Docker preflight aborted, or outside the window) — else this greps a
        # non-existent file and reports a misleading empty summary.
        if: ${{ steps.window.outputs.ok == 'true' && !cancelled() && steps.sweep.outcome != 'skipped' }}
        run: |
          {
            echo "## RowDiff deep sweep ($(date -u +%FT%TZ))"
            echo ""
            echo "Seeds \`${{ steps.seeds.outputs.start }}\`..\`$(( ${{ steps.seeds.outputs.start }} + ${{ steps.seeds.outputs.seeds }} - 1 ))\`"
            echo ""
            # THE VERDICT LINES COME FIRST, and this ordering is the fix for a
            # real triage failure. On 2026-08-07 this sweep logged 257 INFRA
            # lines and 16 MISMATCH lines; the capped grep below showed 60 lines
            # of INFRA, the mismatches never appeared, and four seeds' worth of a
            # genuine ordering finding read as "the cluster died" for a week.
            # ROWDIFF_TALLY carries the counts, ROWDIFF_VACUOUS says the sweep
            # measured nothing at all, and MISMATCH lines are pulled out of the
            # noise into their own block.
            #
            # The general shape, because it recurs: a SHARED witness budget lets
            # the COMMON outcome class evict the RARE one, and the rare one is
            # always the one worth reading. One 60-line cap across MISMATCH,
            # INFRA and DECLINE is arithmetically guaranteed to show only INFRA
            # once infra failures pass 60. Per-class budgets are the fix
            # wherever a capped sample spans classes of wildly different
            # frequency — the cap must be per class, never per report.
            echo "### Outcome tally"
            echo '```'
            grep -m 10 -E 'ROWDIFF_TALLY|ROWDIFF_VACUOUS' rowdiff-output.txt rowdiff-paging-output.txt 2>/dev/null \
              || echo "(no tally line — the sweep did not reach the end of a lane)"
            echo '```'
            echo ""
            echo "### Soundness findings (MISMATCH — these are engine bugs, not infrastructure)"
            echo '```'
            grep -m 40 -E 'MISMATCH' rowdiff-output.txt rowdiff-paging-output.txt 2>/dev/null \
              || echo "(none — no row divergence found)"
            echo '```'
            echo ""
            echo "### Full log slice"
            echo '```'
            # grep -m N (NOT `grep | head -N`): head closes the pipe early on
            # more matches → grep SIGPIPEs → under `bash -eo pipefail` the
            # `|| echo` fallback ALSO fires, printing a spurious "no matches"
            # line beside real ones.
            grep -m 60 -E 'MISMATCH|INFRA|DECLINE|rowdiff: seeds|plan-error' \
              rowdiff-output.txt || echo "(clean — no mismatches, infra failures or declines)"
            echo '```'
            echo ""
            echo "### Paging sweep (continuation soundness)"
            echo '```'
            if [ -f rowdiff-paging-output.txt ]; then
              grep -m 60 -E 'MISMATCH|INFRA|rowdiff PAGED|plan-error' \
                rowdiff-paging-output.txt || echo "(clean — no mismatches; 54F01 scan-limit DECLINEs are expected resource limits, not divergences)"
            else
              echo "(paging sweep did not run)"
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload sweep output
        if: ${{ steps.window.outputs.ok == 'true' && !cancelled() && steps.sweep.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: rowdiff-output
          path: |
            rowdiff-output.txt
            rowdiff-paging-output.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Record genuine-run heartbeat
        # The window gate above can skip every real step and still exit SUCCESS,
        # which is how 10 consecutive nights (07-20..07-29) went green having
        # compared zero rows. This file is written ONLY when the sweep actually
        # executed, and nightly-reconcile.yml fails when its timestamp goes stale.
        #
        # Keyed to the un-paged sweep, the mandatory half; the paging sweep is
        # inside the same job and cannot run without it. The condition deliberately
        # does NOT require success — a red sweep is the net WORKING. The heartbeat
        # answers "did it run"; the job conclusion answers "did it pass".
        if: ${{ steps.window.outputs.ok == 'true' && !cancelled() && steps.sweep.outcome != 'skipped' }}
        run: |
          {
            echo "net=rowdiff"
            echo "ran_at=$(date -u +%FT%TZ)"
            echo "run_id=${{ github.run_id }}"
            echo "sha=${{ github.sha }}"
            echo "seeds=${{ steps.seeds.outputs.start }}..$(( ${{ steps.seeds.outputs.start }} + ${{ steps.seeds.outputs.seeds }} - 1 ))"
            echo "sweep_outcome=${{ steps.sweep.outcome }}"
            echo "paging_outcome=${{ steps.paging.outcome }}"
          } | tee nightly-heartbeat.txt

      - name: Upload genuine-run heartbeat
        if: ${{ steps.window.outputs.ok == 'true' && !cancelled() && steps.sweep.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        # if-no-files-found: error, NOT ignore — a heartbeat that silently fails to
        # upload reproduces the very silence this mechanism exists to break.
        with:
          name: nightly-heartbeat-rowdiff
          path: nightly-heartbeat.txt
          retention-days: 90
          if-no-files-found: error
