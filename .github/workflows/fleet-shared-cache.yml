name: Fleet shared cache (RFC-257)

# One-shot, idempotent: creates the ci-fleet private network, attaches both
# runners (infra/shared_cache.tf declares the same resources; import them into
# the tofu state afterwards, see infra/README.md), and enables the shared Bazel
# cache on each box. Runs on a push to the ops branch below, so it can run
# before this file reaches the default branch.
on:
  push:
    branches: [ops/fleet-shared-cache]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  network:
    name: Create ci-fleet and attach the runners
    runs-on: ubuntu-latest
    env:
      HCLOUD_TOKEN: ${{ secrets.HCLOUD_TOKEN }}
    steps:
      - name: Network and attachments (Hetzner API)
        run: |
          set -euo pipefail
          api() { curl -fsS -H "Authorization: Bearer $HCLOUD_TOKEN" -H 'Content-Type: application/json' "$@"; }
          H=https://api.hetzner.cloud/v1
          NET=$(api "$H/networks?name=ci-fleet" | jq -r '.networks[0].id // empty')
          if [ -z "$NET" ]; then
            NET=$(api -X POST "$H/networks" -d '{"name":"ci-fleet","ip_range":"10.77.0.0/16","subnets":[{"type":"cloud","network_zone":"eu-central","ip_range":"10.77.0.0/24"}]}' | jq -r .network.id)
            echo "created network $NET"
          fi
          attach() { # server-name private-ip
            S=$(api "$H/servers?name=$1" | jq -r '.servers[0].id')
            [ -n "$S" ] && [ "$S" != null ] || { echo "no server $1"; exit 1; }
            if api "$H/servers/$S" | jq -e --argjson n "$NET" '.server.private_net[] | select(.network == $n)' >/dev/null; then
              echo "$1 already attached"; return
            fi
            A=$(api -X POST "$H/servers/$S/actions/attach_to_network" -d "{\"network\":$NET,\"ip\":\"$2\"}" | jq -r .action.id)
            for _ in $(seq 1 60); do
              st=$(api "$H/actions/$A" | jq -r .action.status)
              [ "$st" = success ] && { echo "$1 attached as $2"; return; }
              [ "$st" = error ] && { echo "attach $1 failed"; exit 1; }
              sleep 2
            done
            echo "attach $1 timed out"; exit 1
          }
          attach gh-runner-fdb 10.77.0.2
          attach gh-runner-drain-0 10.77.0.10
          echo "network id: $NET"

  server:
    name: Enable on gh-runner-fdb (cache server)
    needs: network
    runs-on: [hetzner-fdb-vm, fdb-ci-main]
    steps:
      - uses: actions/checkout@v5
      - run: sudo bash infra/enable-shared-cache.sh server

  client:
    name: Enable on gh-runner-drain-0
    needs: server
    runs-on: [hetzner-fdb-vm, fdb-ci-aux]
    steps:
      - uses: actions/checkout@v5
      - run: sudo bash infra/enable-shared-cache.sh client
