      <text x="152" y="881">No cgo required.</text>
    </g>
    <g transform="translate(1500 346)">
      <text x="0" y="0" fill="#a5b1ad" font-size="25" letter-spacing="2">INSIDE YOUR GO APPLICATION</text>
      <g fill="#171d1a" stroke="#323c38" stroke-width="2">
        <rect x="0" y="44" width="748" height="130" rx="8"/>
