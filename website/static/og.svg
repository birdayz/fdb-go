        <rect x="0" y="376" width="748" height="130" rx="8" fill="#1a2c23" stroke="#98d9ba"/>
      </g>
      <g fill="#e7edeb" font-size="42" font-weight="bold">
        <text x="36" y="124">SQL engine</text>
        <text x="36" y="290">Record Layer</text>
        <text x="36" y="456">Pure-Go FDB client</text>
      </g>
      <g fill="#a5b1ad" font-size="28" text-anchor="middle">
        <text x="374" y="203">↓</text>
