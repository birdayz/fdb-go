    <path d="M152 1050H2248" stroke="#323c38" stroke-width="2"/>
    <text x="152" y="1130" fill="#98d9ba" font-size="32">Independent open source · Pre-1.0</text>
    <text x="2248" y="1130" fill="#a5b1ad" font-size="30" text-anchor="end">github.com/birdayz/fdb-go</text>
