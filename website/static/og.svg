<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1260" viewBox="0 0 2400 1260">
  <rect width="2400" height="1260" fill="#111111"/>
  <g font-family="DejaVu Sans, sans-serif">
    <text x="152" y="184" fill="#e7edeb" font-size="54" font-weight="bold">fdb.dev</text>
    <text x="152" y="302" fill="#a5b1ad" font-size="28" letter-spacing="3">FOUNDATIONDB FOR GO</text>
    <g fill="#e7edeb" font-size="144" font-weight="bold" letter-spacing="-7">
      <text x="144" y="508">FoundationDB,</text>
      <text x="144" y="678">from Go.</text>
    </g>
    <g fill="#a5b1ad" font-size="43">
