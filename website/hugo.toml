# fdb.dev website (FoundationDB for Go)
# Static site (landing + docs + changelog + performance + Go vanity imports),
# built with Hugo + the vendored hextra theme (themes/hextra), deployed to GitHub Pages.

baseURL = "https://fdb.dev/"
title = "fdb.dev"
theme = "hextra"

enableRobotsTXT = true
enableGitInfo = false
hasCJKLanguage = false

# hextra renders some HTML (badges, SVG icons) from shortcodes.
[markup]
  [markup.highlight]
    noClasses = false
    lineNos = false
    style = "github-dark"
  [markup.goldmark.renderer]
    unsafe = true
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[menu]
  [[menu.main]]
    name = "Docs"
    pageRef = "/docs"
    weight = 1
  [[menu.main]]
    name = "Status"
    url = "/docs/maturity/"
    weight = 2
  [[menu.main]]
    name = "Changelog"
    pageRef = "/changelog"
    weight = 3
  [[menu.main]]
    name = "Appearance"
    weight = 7
    [menu.main.params]
      type = "theme-toggle"
  [[menu.main]]
    name = "Search"
    weight = 8
    [menu.main.params]
      type = "search"
  [[menu.main]]
    name = "GitHub"
    weight = 9
    url = "https://github.com/birdayz/fdb-go"
    [menu.main.params]
      icon = "github"

[params]
  description = "A native Go FoundationDB client, a Record Layer, and an embedded SQL engine. No cgo required. Explore the APIs, examples, and compatibility boundaries."
  # Default og:image / twitter:image (2400x1260; render static/og.svg to og.png).
  images = ["/og.png"]

  [params.navbar]
    displayTitle = true
    displayLogo = false

  [params.theme]
    default = "system"
    displayToggle = true

  [params.footer]
    enable = true
    displayCopyright = true
    displayPoweredBy = false

  [params.editURL]
    enable = false

  [params.search]
    enable = true
    type = "flexsearch"
    [params.search.flexsearch]
      index = "content"
      tokenize = "forward"

  [params.page]
    width = "normal"
